# rbac.yaml: NPU Operator RBAC 리소스
# 생성일: 2026-03-25
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "npu-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "npu-operator.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "npu-operator.fullname" . }}-role
rules:
  # P6 최소화: NCP 는 사용자 생성 CR — operator 는 reconcile(status/finalizer)만. create/delete 미사용 제거.
  - apiGroups: ["npu.ai"]
    resources: ["npuclusterpolicies", "npuclusterpolicies/status", "npuclusterpolicies/finalizers"]
    verbs: ["get", "list", "watch", "update", "patch"]
  # ACPP: 사용자 생성 CR — reconciler get/list/watch + status/finalizer update (owner-lock 는 DS annotation).
  - apiGroups: ["npu.ai"]
    resources: ["acceleratorpartitionpolicies", "acceleratorpartitionpolicies/status", "acceleratorpartitionpolicies/finalizers"]
    verbs: ["get", "list", "watch", "update", "patch"]
  # 추상 사용자 API: AcceleratorClass 는 read-only(사용자/관리자가 만든다), AcceleratorWorkload 는
  # 컨트롤러가 status 를 쓴다. Deployment 는 워크로드 렌더용으로 아래 apps 규칙에서 create 를 받는다.
  - apiGroups: ["npu.ai"]
    resources: ["acceleratorclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["npu.ai"]
    resources: ["acceleratorworkloads", "acceleratorworkloads/status"]
    verbs: ["get", "list", "watch", "update", "patch"]
  # 검증 근거: operator 가 생성·갱신하는 CR — evidence 는 컨트롤러만 쓴다(사용자는 읽기만).
  - apiGroups: ["npu.ai"]
    resources: ["acceleratorevidences", "acceleratorevidences/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # 검증 정책: 사용자/관리자가 만드는 CR — 컨트롤러는 읽기만 한다.
  - apiGroups: ["npu.ai"]
    resources: ["acceleratorverificationpolicies"]
    verbs: ["get", "list", "watch"]
  # 트랜잭션: operator 가 만들고 진행시키는 CR. 사용자는 읽기만 하지만 컨트롤러는 정리를 위해
  # delete 까지 필요하다(종점 operation 회수).
  - apiGroups: ["npu.ai"]
    resources: ["acceleratoroperations", "acceleratoroperations/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # health 상태: operator 가 생성·갱신하는 CR(노드당 하나). 사용자는 읽기만.
  - apiGroups: ["npu.ai"]
    resources: ["acceleratorhealths", "acceleratorhealths/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # health 정책: 사용자/관리자가 만드는 CR — 컨트롤러는 읽기만 한다.
  - apiGroups: ["npu.ai"]
    resources: ["acceleratorhealthpolicies"]
    verbs: ["get", "list", "watch"]
  # P6 최소화(get/list/watch) 이후 확장: 정책과 무관한 MIG 관측 컨트롤러(migobservation_controller.go)
  # 가 특권 Job 의 관측 결과를 이 보고서에 직접 기록한다(detector 는 비특권이라 MIG 를 못 봐서
  # 대신 쓴다) — status 에 update/patch 가 없으면 그 기록이 조용히 거절되고, 보고서가 영영
  # 안 바뀌어 재관측이 필요하다고 계속 판단해 특권 Job 이 반복 생성된다(2026-08-04 라이브 핫루프,
  # config/rbac/role.yaml 은 이미 이 verb 를 갖고 있었지만 실제 배포는 이 파일이라 반영이 안 됐다).
  # status 서브리소스는 list/watch 를 안 받는다(생성본 config/rbac/role.yaml 과 동일 — 서브리소스는
  # 컬렉션이 아니라 list/watch 가 의미가 없다).
  - apiGroups: ["npu.ai"]
    resources: ["nodedevicereports"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["npu.ai"]
    resources: ["nodedevicereports/status"]
    verbs: ["get", "update", "patch"]
  # P6 최소화: DIP 는 사용자 생성 CR — reconciler get/list/watch + 관리 API(pkg/npuctl)가 spec patch(upgrade/rollback/toggle). create/update 미사용 제거.
  - apiGroups: ["npu.ai"]
    resources: ["driverinstallpolicies"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["npu.ai"]
    resources: ["driverupgradestates", "driverupgradestates/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # WP-C-1 Mode=job: DUS 상태머신이 install Job 을 생성/조회/삭제하고 controller-runtime 이 Job 을 watch 함
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # A6.1: quiesce-on-driver-upgrade — Cordoning 진입 시 라벨 가진 Deployment 의 replicas 를 0 으로 patch, Idle/Failed 진입 시 복구
  # create: AcceleratorWorkload 컨트롤러가 사용자 워크로드 Deployment 를 만든다(삭제는 ownerReference GC 몫이라 delete 불필요).
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # P1: PDB-aware drain via Eviction API (pods/eviction create + PDB read)
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  # events: 컨트롤러가 발행(create/patch)하고, 관리 API 의 /api/v1/events 가 읽는다(get/list/watch).
  # 읽기 권한이 없으면 UI 의 History 탭이 조용히 500 을 낸다 — 마커만 고치고 여기를 빠뜨리면
  # 코드는 맞고 배포는 틀린 상태가 된다(이 저장소에서 이미 두 번 발생).
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "patch"]
  # 노드 Lease: 같은 노드를 두 프로세스가 동시에 만지지 않게 하는 트랜잭션 잠금(internal/operation
  # 의 LeaseManager). 이 SA 는 이미 leader-election Role 로 이 namespace 의 모든 Lease 에
  # get/list/watch/create/update/patch/delete 권한이 있어(resourceNames 제한 없음) 이 규칙은
  # 지금 당장은 중복이다 — 그래도 명시하는 이유는, 그 Role 은 controller-runtime 리더 선출용이고
  # 나중에 resourceNames 로 좁혀지면(최소권한 정리) 노드 Lease 가 조용히 깨지기 때문이다.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  # Rebellions ATOM+ 지원: rbln-system 네임스페이스 + SA + RBAC 생성에 필요
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # DRA 드라이버를 끄면 그 드라이버의 SA·역할을 회수하므로 delete 가 필요하다.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # P4 관리 REST API(S5-3-②): 외부 관리툴 Bearer 토큰 인증(TokenReview)·인가(SubjectAccessReview).
  # api.enabled=false 여도 무해하며, 누락 시 모든 API 요청이 500(리뷰 생성 실패)이 되므로 항상 부여.
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
  # DRA 드라이버에 줄 권한은 operator 자신이 먼저 갖고 있어야 한다 — 쿠버네티스가
  # 자기가 없는 권한을 담은 ClusterRole 생성을 막는다(권한 상승 방지). 그래서
  # 가용성 실측용 읽기에 더해 드라이버가 요구하는 쓰기까지 여기 있다.
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceslices", "resourceclaims", "resourceclaimtemplates"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceslices/status", "resourceclaims/status", "resourceclaimtemplates/status"]
    verbs: ["update", "patch"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims/driver"]
    verbs: ["associated-node:update", "associated-node:patch"]
  # DeviceClass 는 읽기에 더해 쓰기가 필요하다 — DRA 드라이버를 배포할 때 그 벤더의
  # DeviceClass 를 operator 가 만들고, 끄면 회수한다.
  - apiGroups: ["resource.k8s.io"]
    resources: ["deviceclasses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "npu-operator.fullname" . }}-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "npu-operator.fullname" . }}-role
subjects:
  - kind: ServiceAccount
    name: {{ include "npu-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}

---
# kcloud-node-manager DaemonSet이 NodeDeviceReport CR을 생성/업데이트할 수 있도록 허용
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kcloud-node-manager-role
rules:
  - apiGroups: ["npu.ai"]
    resources: ["nodedevicereports", "nodedevicereports/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # node-agent NFD/GFD 라벨링(§5.3, Q1=A): 자기 prefix(kcloud.ai/*) 라벨만 patch. 비특권 유지.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "update", "patch"]
  # node-agent Validation ③ device-plugin/allocatable 관찰용.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kcloud-node-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kcloud-node-manager-role
subjects:
  - kind: ServiceAccount
    name: kcloud-node-manager
    # detector SA 는 operator 부속으로 release namespace(=OPERATOR_NAMESPACE, kcloud)에 생성됨(#16).
    namespace: {{ .Release.Namespace }}

---
# Leader election (Lease lock) — controller-runtime 기본 경로
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "npu-operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "npu-operator.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "npu-operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "npu-operator.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "npu-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
