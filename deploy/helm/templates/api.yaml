{{- if .Values.api.enabled }}
# ============================================================
# api.yaml: 관리 REST API(S5-3-②) cert Secret + ClusterIP Service
# 상세: operator pod 내 :9444 HTTPS listener 용 self-signed cert(lookup 멱등, upgrade 재수행에도 불변)
#       + kcloud-operator-api Service. 기본 api.enabled=false(opt-in).
# 생성일: 2026-07-20
# ============================================================
{{- $fullname := include "npu-operator.fullname" . -}}
{{- $svcName := printf "%s-api" $fullname -}}
{{- $secretName := printf "%s-api-cert" $fullname -}}
{{- $altNames := list (printf "%s.%s.svc" $svcName .Release.Namespace) (printf "%s.%s.svc.cluster.local" $svcName .Release.Namespace) -}}
{{/*
cert 멱등성(P3 webhook 과 동일): 기존 Secret 이 있으면 그 값을 재사용, 없을 때만 최초 1회 발급.
helm upgrade 반복에도 Secret 불변(검증 f). lookup 은 base64 data, gen* 은 PEM → b64enc 로 통일.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $tlsCert := "" -}}
{{- $tlsKey := "" -}}
{{- if $existing -}}
{{- $tlsCert = index $existing.data "tls.crt" -}}
{{- $tlsKey = index $existing.data "tls.key" -}}
{{- else -}}
{{- $ca := genCA "kcloud-operator-api-ca" 3650 -}}
{{- $cert := genSignedCert $svcName nil $altNames 3650 $ca -}}
{{- $tlsCert = b64enc $cert.Cert -}}
{{- $tlsKey = b64enc $cert.Key -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "npu-operator.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $tlsCert }}
  tls.key: {{ $tlsKey }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svcName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "npu-operator.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: management-api
spec:
  type: ClusterIP
  selector:
    {{- include "npu-operator.selectorLabels" . | nindent 4 }}
  ports:
  - name: https
    port: 443
    targetPort: {{ .Values.api.port }}
    protocol: TCP
{{- end }}
