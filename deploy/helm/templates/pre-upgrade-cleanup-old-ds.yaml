{{/*
pre-upgrade-cleanup-old-ds.yaml: helm upgrade 시 구 이름 DaemonSet 전체를 사전 삭제하는 pre-upgrade Job.
상세: DS selector 가 immutable 이라 이름을 바꾸면 구 DS 를 지우고 신 DS 를 다시 만들어야
      한다. v0.5.23 이전 전 세대의 구 이름을 모두 지워 복수 세대 업그레이드도 안전하다.
생성일: 2026-04-22 | 수정일: 2026-10-11
*/}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kcloud-operator-cleanup-old-ds
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kcloud-operator-cleanup-old-ds
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kcloud-operator-cleanup-old-ds
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kcloud-operator-cleanup-old-ds
subjects:
  - kind: ServiceAccount
    name: kcloud-operator-cleanup-old-ds
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kcloud-operator-cleanup-old-ds
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 60
  template:
    spec:
      serviceAccountName: kcloud-operator-cleanup-old-ds
      restartPolicy: OnFailure
      # cordoned worker 로만 스케줄되면 pre-upgrade hook 이 hang 해 helm upgrade 가 멈춘다.
      # control-plane taint 를 tolerate 해 workers 전량 cordon 시에도 스케줄 가능하게 하고,
      # preferred affinity 로 control-plane 에 우선 배치한다(DS 삭제는 API 접근만 필요).
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      containers:
        - name: cleanup-old-ds
          image: "{{ .Values.crdUpgrade.kubectlImage | default (include "kcloud-operator.vendorImage" (dict "registry" .Values.global.vendorRegistry "upstream" .Values.crdUpgrade.kubectlUpstream "repo" .Values.crdUpgrade.kubectlRepository "tag" .Values.crdUpgrade.kubectlTag)) }}"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              # (1) pre-v0.5.7 구 이름: npu-op-<vendor>-device-plugin
              kubectl -n kube-system delete ds --ignore-not-found \
                npu-op-nvidia-device-plugin \
                npu-op-furiosa-device-plugin \
                npu-op-furiosa-rngd-device-plugin \
                npu-op-rbln-device-plugin
              # (2) v0.5.7~v0.5.22 구 이름: detector / npu-op-device-plugin-<vendor>
              kubectl -n kube-system delete ds --ignore-not-found \
                npu-op-detector \
                npu-op-device-plugin-nvidia \
                npu-op-device-plugin-furiosa \
                npu-op-device-plugin-furiosa-rngd \
                npu-op-device-plugin-rbln
              # (3) v0.5.7~v0.5.22 구 이름: npu-op-driver-<vendor>-<model>
              kubectl -n kube-system delete ds --ignore-not-found \
                npu-op-driver-nvidia-generic \
                npu-op-driver-furiosa-warboy \
                npu-op-driver-furiosa-rngd
              echo "pre-upgrade cleanup done"
