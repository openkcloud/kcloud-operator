# ============================================================
# driverinstallpolicy.yaml: DriverInstallPolicy CR 자동 생성
# 상세: driverInstallPolicies.<vendor>.enabled=true 인 벤더마다 DIP CR 을 만든다. helm hook 이
#       아니라 릴리스 자원이라 업그레이드로 uid 가 바뀌어도 소유 DaemonSet 이 연쇄 재생성되지 않는다.
# 생성일: 2026-04-10 | 수정일: 2026-10-11
# ============================================================
{{- if .Values.driverInstallPolicies.furiosa.enabled }}
apiVersion: npu.ai/v1alpha1
kind: DriverInstallPolicy
metadata:
  name: {{ .Values.driverInstallPolicies.furiosa.name }}
spec:
  vendor: {{ .Values.driverInstallPolicies.furiosa.vendor }}
  model: {{ .Values.driverInstallPolicies.furiosa.model }}
  rebootStrategy: {{ .Values.driverInstallPolicies.furiosa.rebootStrategy }}
  kernelAllowlist:
    {{- toYaml .Values.driverInstallPolicies.furiosa.kernelAllowlist | nindent 4 }}
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  driver:
    {{- with .Values.driverInstallPolicies.furiosa.driver.mode }}
    mode: {{ . }}
    {{- end }}
    version: "{{ .Values.driverInstallPolicies.furiosa.driver.version }}"
    image: "{{ include "kcloud-operator.image" (dict "registry" .Values.global.registry "repo" .Values.driverInstallPolicies.furiosa.driver.repository "tag" .Values.driverInstallPolicies.furiosa.driver.tag) }}"
    {{- with .Values.driverInstallPolicies.furiosa.driver.installer }}
    installer: {{ . }}
    {{- end }}
    allowDowngrade: {{ .Values.driverInstallPolicies.furiosa.driver.allowDowngrade }}
    versionSource: {{ .Values.driverInstallPolicies.furiosa.driver.versionSource | quote }}
    skipOnPassthrough: {{ .Values.driverInstallPolicies.furiosa.driver.skipOnPassthrough }}
    {{- with .Values.driverInstallPolicies.furiosa.driver.env }}
    env:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.driverInstallPolicies.furiosa.driver.kernelImages }}
    kernelImages: {{ toYaml . | nindent 6 }}
    {{- end }}
    {{- if .Values.driverInstallPolicies.furiosa.driver.kernelImageBuildRevision }}
    kernelImageBuildRevision: {{ .Values.driverInstallPolicies.furiosa.driver.kernelImageBuildRevision | quote }}
    {{- with .Values.driverInstallPolicies.furiosa.driver.kernelImageVariant }}
    kernelImageVariant: {{ . | quote }}
    {{- end }}
    {{- end }}
  {{- with .Values.driverInstallPolicies.furiosa.verifiedVersions }}
  verifiedVersions:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.driverInstallPolicies.furiosa.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.driverInstallPolicies.furiosa.upgradePolicy }}
  upgradePolicy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.driverInstallPolicies.furiosa.jobOverrides }}
  jobOverrides:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.driverInstallPolicies.furiosa.workloadProbe }}
  workloadProbe:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
