{{- /*
servicemonitor.yaml: Prometheus Operator 용 수집 정의
상세: metrics.serviceMonitor.enabled 가 참일 때만 만든다. monitoring.coreos.com CRD 가
      없는 클러스터에서 렌더하면 설치가 실패하므로 기본은 꺼짐이다.
      scheme 은 metrics.secure 를 따른다 — operator 의 --metrics-secure 와 갈라지면
      Prometheus 가 평문 포트에 https 로 붙어 수집이 통째로 실패한다.
생성일: 2026-09-17
*/ -}}
{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "kcloud-operator.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "kcloud-operator.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: controller
spec:
  selector:
    matchLabels:
      {{- include "kcloud-operator.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scheme: {{ if .Values.metrics.secure }}https{{ else }}http{{ end }}
      {{- if .Values.metrics.secure }}
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        insecureSkipVerify: true
      {{- end }}
{{- end }}
