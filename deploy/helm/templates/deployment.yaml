# deployment.yaml: NPU Operator Controller Manager Deployment
# 생성일: 2026-03-25
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "npu-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "npu-operator.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "npu-operator.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "npu-operator.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: {{ include "npu-operator.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        image: "{{ include "kcloud-operator.image" (dict "registry" .Values.global.registry "repo" .Values.image.repository "tag" .Values.image.tag) }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
        - /manager
        args:
        - --leader-elect={{ .Values.leaderElection.enabled }}
        - --health-probe-bind-address=:8081
        {{- if .Values.webhook.enabled }}
        - --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs
        {{- end }}
        {{- if .Values.api.enabled }}
        - "--api-bind-address=:{{ .Values.api.port }}"
        - --api-cert-path=/tmp/k8s-api-server/serving-certs
        {{- end }}
        {{- if .Values.metrics.enabled }}
        - "--metrics-bind-address=:{{ .Values.metrics.port }}"
        - "--metrics-secure={{ .Values.metrics.secure }}"
        {{- end }}
        env:
        # OPERATOR_NAMESPACE: operator 관리 워크로드(driver DS / install Job / toolkit DS)를
        # 배치할 네임스페이스. release namespace 를 Downward API 로 주입한다(#16). device-plugin 은
        # 이 값과 무관하게 kube-system 고정. 미설정 시 코드 기본값 kube-system(회귀 0).
        - name: OPERATOR_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        {{- if .Values.acpp.probeImage }}
        # ACPP_PROBE_IMAGE: AcceleratorPartitionPolicy verify 단계가 띄우는 1-파티션 테스트 Pod 이미지.
        # air-gap(Harbor mirror) 클러스터는 미러 도달 가능 이미지로 지정(미설정 시 코드 기본값 registry.k8s.io/pause:3.9).
        - name: ACPP_PROBE_IMAGE
          value: {{ .Values.acpp.probeImage | quote }}
        {{- end }}
        {{- if .Values.acpp.migJobImage }}
        - name: ACPP_MIG_JOB_IMAGE
          value: {{ .Values.acpp.migJobImage | quote }}
        {{- end }}
        {{- if .Values.acpp.mpsControlDaemon }}
        {{- if .Values.acpp.mpsControlDaemon.image }}
        # ACPP_MPS_CONTROL_IMAGE: MPS 공유 모드에서 뜨는 control daemon 이미지. air-gap(Harbor
        # mirror) 클러스터는 미러 도달 가능 이미지로 지정(미설정 시 코드 기본값 사용).
        - name: ACPP_MPS_CONTROL_IMAGE
          value: {{ .Values.acpp.mpsControlDaemon.image | quote }}
        {{- end }}
        {{- end }}
        {{- with .Values.acpp.measuredSharing }}
        {{- if .multiProcess }}
        # KCLOUD_NVIDIA_MULTIPROCESS / KCLOUD_NVIDIA_TIMESLICING: 라이브 실측 결과를 주입해
        # capability status 의 검증 축을 올린다("verified" 만 유효, 그 외/미설정은 required).
        # 코드가 스스로 주장하지 않는 값이므로 이 클러스터에서 실제로 시험한 뒤에만 켠다.
        - name: KCLOUD_NVIDIA_MULTIPROCESS
          value: {{ .multiProcess | quote }}
        {{- end }}
        {{- if .timeSlicing }}
        - name: KCLOUD_NVIDIA_TIMESLICING
          value: {{ .timeSlicing | quote }}
        {{- end }}
        {{- end }}
        {{- if and .Values.operationCoordinator (eq .Values.operationCoordinator.mode "delegate") }}
        # KCLOUD_OPERATION_COORDINATOR: 위임 모드 스위치. "delegate" 만 유효하고, 이 env 가 아예
        # 주입되지 않으면 꺼진 것으로 읽힌다.
        # .Values.operationCoordinator 존재를 먼저 확인하는 이유: --reuse-values 로 이 키가 없던
        # 이전 릴리스를 업그레이드하면 이 맵 자체가 nil 이라 .mode 접근이 렌더링 실패로 죽는다
        # (이 저장소에서 이미 겪은 함정과 같은 종류 — 방어 가드를 templates 에 남긴다).
        - name: KCLOUD_OPERATION_COORDINATOR
          value: "delegate"
        {{- end }}
        # P6(S4-5) Pod Security: pod-level runAsNonRoot+seccompRuntimeDefault 와 결합해 restricted 준수.
        # cert(webhook/api)는 read-only secret 마운트, manager 는 rootfs 에 쓰지 않으므로 RO rootfs 안전.
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        {{- if or .Values.webhook.enabled .Values.api.enabled }}
        ports:
        {{- if .Values.webhook.enabled }}
        - name: webhook
          containerPort: {{ .Values.webhook.port }}
          protocol: TCP
        {{- end }}
        {{- if .Values.api.enabled }}
        - name: mgmt-api
          containerPort: {{ .Values.api.port }}
          protocol: TCP
        {{- end }}
        volumeMounts:
        {{- if .Values.webhook.enabled }}
        - name: webhook-cert
          mountPath: /tmp/k8s-webhook-server/serving-certs
          readOnly: true
        {{- end }}
        {{- if .Values.api.enabled }}
        - name: api-cert
          mountPath: /tmp/k8s-api-server/serving-certs
          readOnly: true
        {{- end }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
          # failureThreshold=20: 20×20=400s > 300s(5분) — reconcile-alive grace 와 정합
          failureThreshold: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
      {{- if or .Values.webhook.enabled .Values.api.enabled }}
      volumes:
      {{- if .Values.webhook.enabled }}
      - name: webhook-cert
        secret:
          secretName: {{ include "npu-operator.fullname" . }}-webhook-cert
      {{- end }}
      {{- if .Values.api.enabled }}
      - name: api-cert
        secret:
          secretName: {{ include "npu-operator.fullname" . }}-api-cert
      {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 10
