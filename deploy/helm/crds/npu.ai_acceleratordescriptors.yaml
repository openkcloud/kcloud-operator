---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: acceleratordescriptors.npu.ai
spec:
  group: npu.ai
  names:
    kind: AcceleratorDescriptor
    listKind: AcceleratorDescriptorList
    plural: acceleratordescriptors
    shortNames:
    - adesc
    singular: acceleratordescriptor
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.vendor
      name: VENDOR
      type: string
    - jsonPath: .spec.allocationUnit
      name: UNIT
      type: string
    - jsonPath: .status.feasibleBackends
      name: FEASIBLE
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AcceleratorDescriptorSpec 은 장치 하나의 backend 중립 기술이다.
            properties:
              allocationUnit:
                description: AllocationUnit 은 할당의 최소 단위다.
                enum:
                - device
                - partition
                type: string
              backends:
                description: |-
                  Backends 는 이 descriptor 로 만들 수 있다고 주장하는 backend 목록이다.
                  주장일 뿐이며 실제 가능 여부는 정적 검증기가 판정한다.
                items:
                  type: string
                minItems: 1
                type: array
              cleanup:
                description: Cleanup 은 반납 후 조건이다.
                properties:
                  requiresDeviceReset:
                    description: |-
                      RequiresDeviceReset 이 true 면 반납 후 장치 리셋이 필요하다.
                      리셋 수단이 선언되지 않으면 backend 생성이 거절된다.
                    type: boolean
                  resetCommand:
                    description: ResetCommand 는 리셋 수단이다. RequiresDeviceReset 이 true
                      면 필수.
                    items:
                      type: string
                    type: array
                type: object
              deviceNodes:
                description: |-
                  DeviceNodes 는 컨테이너에 주입할 /dev 경로 glob 목록이다. 비면 주입할 것이 없다는 뜻이라
                  어느 backend 로도 갈 수 없다.
                items:
                  type: string
                minItems: 1
                type: array
              identity:
                description: Identity 는 장치 식별 근거다.
                properties:
                  source:
                    description: Source 는 식별자의 출처다.
                    enum:
                    - pciAddress
                    - uuid
                    - serial
                    type: string
                  stableAcrossReboot:
                    description: |-
                      StableAcrossReboot 이 true 면 재부팅 후에도 같은 값이어야 한다.
                      pciAddress 를 쓰면서 true 로 두는 것은 허용하되, 슬롯 변경 시 계약 위반이며
                      그 책임은 descriptor 작성자가 진다.
                    type: boolean
                required:
                - source
                - stableAcrossReboot
                type: object
              product:
                description: Product 는 제품 키다("a30"·"blackhole-p150" 등).
                type: string
              vendor:
                description: Vendor 는 벤더 키다("nvidia"·"rngd"·"tenstorrent" 등, detector
                  의 vendorKey 와 같은 어휘).
                type: string
            required:
            - allocationUnit
            - backends
            - deviceNodes
            - identity
            - product
            - vendor
            type: object
          status:
            description: AcceleratorDescriptorStatus 는 정적 검증 결과다.
            properties:
              conditions:
                items:
                  properties:
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  type: object
                type: array
              feasibleBackends:
                description: FeasibleBackends 는 검증기가 생성 가능하다고 판정한 backend 목록이다.
                items:
                  type: string
                type: array
              refusals:
                description: Refusals 는 거절된 backend 와 그 사유다. 거절을 조용히 삼키지 않는다.
                items:
                  description: DescriptorRefusal 은 backend 하나가 왜 거절됐는지다.
                  properties:
                    backend:
                      type: string
                    reason:
                      type: string
                  required:
                  - backend
                  - reason
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
