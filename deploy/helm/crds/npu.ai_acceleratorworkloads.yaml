---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: acceleratorworkloads.npu.ai
spec:
  group: npu.ai
  names:
    kind: AcceleratorWorkload
    listKind: AcceleratorWorkloadList
    plural: acceleratorworkloads
    shortNames:
    - aw
    singular: acceleratorworkload
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.accelerator.class
      name: CLASS
      type: string
    - jsonPath: .spec.accelerator.access.mode
      name: MODE
      type: string
    - jsonPath: .status.resolved.resourceName
      name: RESOURCE
      type: string
    - jsonPath: .status.phase
      name: PHASE
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AcceleratorWorkloadSpec 는 장치와 무관한 사용자 YAML 이다.
            properties:
              accelerator:
                description: AcceleratorRequest 는 장치 요구다.
                properties:
                  access:
                    description: AccessSpec 는 장치를 어떻게 쓸 것인가다.
                    properties:
                      implementation:
                        default: auto
                        description: |-
                          Implementation 은 공유를 무엇으로 실현할지다. auto 면 장치가 verified 로 보고한
                          방식 중 timeSlicing → multiProcess → brokered 순으로 고른다.
                        enum:
                        - auto
                        - timeSlicing
                        - multiProcess
                        - brokered
                        type: string
                      mode:
                        enum:
                        - exclusive
                        - shared
                        - partitioned
                        - partitioned-shared
                        type: string
                      replicas:
                        description: |-
                          Replicas 는 장치 하나를 몇 갈래로 나눠 쓰는가다 — 광고 배수이지 성능 비율이 아니다(§4.2).
                          spec.workload.replicas(Pod 개수)와 전혀 다른 값이다. 공유 계열 모드에서 2 이상이어야 한다.
                        format: int32
                        maximum: 16
                        minimum: 0
                        type: integer
                    required:
                    - mode
                    type: object
                  class:
                    description: Class 는 AcceleratorClass(cluster-scoped) 이름이다.
                    type: string
                  preferences:
                    description: AcceleratorPreferences 는 선호이지 요구가 아니다 — 만족하는 것이 없으면
                      거절이 아니라 다음 후보로 넘어간다.
                    properties:
                      allocationAPI:
                        default: auto
                        description: |-
                          AllocationAPI 는 노출 계층이다. dra 가용 여부는 하드코딩이 아니라
                          DeviceClass·ResourceSlice 실측으로 판정한다(internal/intent/dra.go).
                        enum:
                        - auto
                        - devicePlugin
                        - dra
                        type: string
                      vendors:
                        description: Vendors 는 선호 벤더 순서다. 클래스 mappings 에 없는 벤더는 무시된다.
                        items:
                          type: string
                        type: array
                    type: object
                  requirements:
                    description: Requirements 는 클래스 요구사항을 완화하지 않는다 — 클래스와 이 값 중 강한
                      쪽이 이긴다.
                    properties:
                      minimumIsolation:
                        description: |-
                          MinimumIsolation 은 최소 격리 등급이다(R&D v1.0 §19.1). 실측 근거가 없는 장치는
                          IsolationCapability 가 빈 문자열이며, 그런 장치는 이 요구를 만족하지 않는 것으로 본다.
                        enum:
                        - none
                        - process
                        - subdevice
                        - device
                        - hardware
                        type: string
                      minimumMemory:
                        anyOf:
                        - type: integer
                        - type: string
                        description: |-
                          MinimumMemory 는 워크로드 하나가 쓸 수 있어야 하는 최소 장치 메모리다(예 8Gi).
                          전체 장치 모드는 NodeDeviceReport 의 memoryMiB 와, 분할 모드는 profile 이름에
                          인코딩된 메모리(1g.6gb → 6Gi)와 비교한다.
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                    type: object
                required:
                - access
                - class
                type: object
              workload:
                description: WorkloadTemplate 은 실행할 컨테이너다. operator 가 이것으로 Deployment
                  하나를 만든다.
                properties:
                  args:
                    items:
                      type: string
                    type: array
                  command:
                    items:
                      type: string
                    type: array
                  env:
                    items:
                      description: EnvVar represents an environment variable present
                        in a Container.
                      properties:
                        name:
                          description: |-
                            Name of the environment variable.
                            May consist of any printable ASCII characters except '='.
                          type: string
                        value:
                          description: |-
                            Variable references $(VAR_NAME) are expanded
                            using the previously defined environment variables in the container and
                            any service environment variables. If a variable cannot be resolved,
                            the reference in the input string will be unchanged. Double $$ are reduced
                            to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                            "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                            Escaped references will never be expanded, regardless of whether the variable
                            exists or not.
                            Defaults to "".
                          type: string
                        valueFrom:
                          description: Source for the environment variable's value.
                            Cannot be used if value is not empty.
                          properties:
                            configMapKeyRef:
                              description: Selects a key of a ConfigMap.
                              properties:
                                key:
                                  description: The key to select.
                                  type: string
                                name:
                                  default: ""
                                  description: |-
                                    Name of the referent.
                                    This field is effectively required, but due to backwards compatibility is
                                    allowed to be empty. Instances of this type with an empty value here are
                                    almost certainly wrong.
                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                  type: string
                                optional:
                                  description: Specify whether the ConfigMap or its
                                    key must be defined
                                  type: boolean
                              required:
                              - key
                              type: object
                              x-kubernetes-map-type: atomic
                            fieldRef:
                              description: |-
                                Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                                spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                              properties:
                                apiVersion:
                                  description: Version of the schema the FieldPath
                                    is written in terms of, defaults to "v1".
                                  type: string
                                fieldPath:
                                  description: Path of the field to select in the
                                    specified API version.
                                  type: string
                              required:
                              - fieldPath
                              type: object
                              x-kubernetes-map-type: atomic
                            fileKeyRef:
                              description: |-
                                FileKeyRef selects a key of the env file.
                                Requires the EnvFiles feature gate to be enabled.
                              properties:
                                key:
                                  description: |-
                                    The key within the env file. An invalid key will prevent the pod from starting.
                                    The keys defined within a source may consist of any printable ASCII characters except '='.
                                    During Alpha stage of the EnvFiles feature gate, the key size is limited to 128 characters.
                                  type: string
                                optional:
                                  default: false
                                  description: |-
                                    Specify whether the file or its key must be defined. If the file or key
                                    does not exist, then the env var is not published.
                                    If optional is set to true and the specified key does not exist,
                                    the environment variable will not be set in the Pod's containers.

                                    If optional is set to false and the specified key does not exist,
                                    an error will be returned during Pod creation.
                                  type: boolean
                                path:
                                  description: |-
                                    The path within the volume from which to select the file.
                                    Must be relative and may not contain the '..' path or start with '..'.
                                  type: string
                                volumeName:
                                  description: The name of the volume mount containing
                                    the env file.
                                  type: string
                              required:
                              - key
                              - path
                              - volumeName
                              type: object
                              x-kubernetes-map-type: atomic
                            resourceFieldRef:
                              description: |-
                                Selects a resource of the container: only resources limits and requests
                                (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                              properties:
                                containerName:
                                  description: 'Container name: required for volumes,
                                    optional for env vars'
                                  type: string
                                divisor:
                                  anyOf:
                                  - type: integer
                                  - type: string
                                  description: Specifies the output format of the
                                    exposed resources, defaults to "1"
                                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                  x-kubernetes-int-or-string: true
                                resource:
                                  description: 'Required: resource to select'
                                  type: string
                              required:
                              - resource
                              type: object
                              x-kubernetes-map-type: atomic
                            secretKeyRef:
                              description: Selects a key of a secret in the pod's
                                namespace
                              properties:
                                key:
                                  description: The key of the secret to select from.  Must
                                    be a valid secret key.
                                  type: string
                                name:
                                  default: ""
                                  description: |-
                                    Name of the referent.
                                    This field is effectively required, but due to backwards compatibility is
                                    allowed to be empty. Instances of this type with an empty value here are
                                    almost certainly wrong.
                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                  type: string
                                optional:
                                  description: Specify whether the Secret or its key
                                    must be defined
                                  type: boolean
                              required:
                              - key
                              type: object
                              x-kubernetes-map-type: atomic
                          type: object
                      required:
                      - name
                      type: object
                    type: array
                  image:
                    type: string
                  replicas:
                    default: 1
                    description: Replicas 는 Pod 개수다(access.replicas 와 다르다).
                    format: int32
                    minimum: 0
                    type: integer
                required:
                - image
                type: object
            required:
            - accelerator
            - workload
            type: object
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                format: int64
                type: integer
              phase:
                type: string
              rejection:
                description: |-
                  Rejection 은 번역이 거절됐을 때의 축·사유다. Translated=False 와 함께 채워진다.
                  구버전 operator 가 쓴 객체에는 없으므로 소비자는 condition message 폴백을 유지한다.
                properties:
                  axis:
                    type: string
                  message:
                    type: string
                  reason:
                    type: string
                type: object
              resolved:
                description: ResolvedAllocation 은 번역 결과다 — 사용자가 쓴 추상 의도가 무엇으로 바뀌었는지
                  그대로 보여준다.
                properties:
                  allocationAPI:
                    type: string
                  deviceClassName:
                    description: |-
                      DeviceClassName 은 DRA 경로에서 ResourceClaimTemplate 이 참조할 DeviceClass 다.
                      allocationAPI=devicePlugin 이면 비어 있고, dra 면 ResourceName 이 비고 이쪽이 찬다.
                    type: string
                  explanation:
                    description: Explanation 은 사람이 읽는 근거다. 공유 모드면 replica 사이에 격리가
                      없다는 사실을 적는다.
                    type: string
                  mode:
                    type: string
                  nodes:
                    description: Nodes 는 이 번역이 성립하는 노드 후보다(nodeAffinity 로 박힌다).
                    items:
                      type: string
                    type: array
                  quantity:
                    format: int32
                    type: integer
                  resourceName:
                    description: ResourceName 은 Pod 이 실제로 요청하는 extended resource 다.
                    type: string
                  vendor:
                    type: string
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
