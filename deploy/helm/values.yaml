# values.yaml: NPU Operator 기본 설정값
# 생성일: 2026-03-25 | 수정일: 2026-10-12

# ─────────────────────────────────────────────────────────────────────────────
# 레지스트리는 두 종류다. 어느 이미지가 어느 쪽인지는 deploy/helm/README.md 의 "레지스트리
# 구성" 절 표에 있다.
# ─────────────────────────────────────────────────────────────────────────────

# global.registry: kcloud 가 빌드하는 이미지(operator·node-manager·host-exec·furiosa-exporter·
#   드라이버 설치기 3종·Furiosa 통합/Tenstorrent device-plugin·descriptor auto-apply 런타임
#   2종)의 레지스트리다. 기본값은 공개 배포 경로(GHCR)다. 사설 미러는 한 줄로 바꾼다:
#     --set global.registry=<host:port>/<project>

# global.vendorRegistry: 3rd-party(벤더) 이미지의 레지스트리다. 비어 있으면(기본) 각 항목의
#   upstream 값이 가리키는 공개 레지스트리에서 직접 당긴다. air-gap 클러스터는 벤더 이미지를
#   <미러>/<org>/<image> 규약으로 올린 뒤 한 줄로 바꾼다: --set global.vendorRegistry=<host:port>/<project>
#   대상: nvidia/k8s-device-plugin, bitnamilegacy/kubectl, dra-driver-nvidia/dra-driver-nvidia-gpu,
#   furiosaai/furiosa-device-plugin, furiosaai/furiosa-dra-driver, rebellions/k8s-device-plugin.

# 전체 경로를 그대로 적는 값(detector.image, nvidia.devicePluginImage, furiosa.devicePluginImage,
#   nvidia.dcgmExporter.image, acpp.probeImage, acpp.probeImages.*, crdUpgrade.kubectlImage,
#   driverInstallPolicies.nvidia.toolkit.image)은 두 레지스트리 어느 쪽도 적용받지 않는다.
#   사용자가 미러 경로를 직접 적는 자리이기 때문이다.
global:
  registry: "ghcr.io/openkcloud"
  vendorRegistry: ""

# metrics: controller-runtime 지표 노출. 기본은 끈다 — 라이브에 인증 없는 포트를
# 열지 않기 위해서다. 제어면 비용 측정(KWOK 하네스)에서만 켠다.
# 켜려면: metrics.enabled=true metrics.secure=true metrics.service.enabled=true
#   metrics.serviceMonitor.enabled=true (secure 는 TokenReview 기반 인증, cert 는
#   --metrics-cert-path 로 지정). operator 자체 지표 목록은 운영 구성 안내의
#   "operator 지표" 절 참고.
metrics:
  enabled: false
  port: 8080
  secure: false
  # Service 는 Prometheus 가 긁을 대상이다. enabled 여야 의미가 있으므로 함께 판정한다.
  service:
    enabled: false
  # ServiceMonitor 는 Prometheus Operator 가 설치된 클러스터에서만 의미가 있다.
  # monitoring.coreos.com CRD 가 없는 곳에 렌더하면 helm install 이 실패하므로 별도 스위치다.
  serviceMonitor:
    enabled: false
    interval: 30s

# operator 이미지: registry 는 global.registry 로 조립됨 (repository 는 registry-relative path).
image:
  repository: kcloud-operator
  tag: v0.8.0
  pullPolicy: IfNotPresent

# hostExec: operator 가 호스트에서 명령을 대신 실행할 때 띄우는 특권 hostPID Job 이미지
#   (alpine + util-linux nsenter). 소비처: NVIDIA MIG 관측·apply/rollback Job, ACPP 재부팅 Job,
#   NodeReboot 작업, DRA CDI 활성화 init container. repository 는 레지스트리 상대 경로이고
#   global.registry 가 앞에 붙는다. 비우면 env 가 주입되지 않아 위 경로가 전부 동작하지 않는다.
#   구 이름 mig-tool(acpp.migJob) 을 대체한다. 차트는 v0.7.26 이하 operator 이미지를 위해
#   옛 env ACPP_MIG_JOB_IMAGE 도 같은 값으로 한 릴리스 동안 함께 주입한다.
hostExec:
  repository: "kcloud-host-exec"
  tag: "v0.1.0"

# generatedBackend: AcceleratorDescriptor auto-apply 가 만드는 일반 런타임 DaemonSet(device-plugin/
#   DRA driver) 이미지. registry 는 global.registry 로 조립되고, repository 를 비우면 operator
#   Deployment 인자(--generated-dp-image/--generated-dra-image) 자체가 빠져 그 backend 는
#   auto-apply 되지 않는다(빈 이미지로 InvalidImageName 나는 것을 막는 거절 경로와 동일 규약).

# devicePlugin 은 v3 이상이어야 한다 — descriptor spec.sharing(SW 시분할)이 컴파일하는
#   backend.json 의 replicas 를 v2 는 읽지 않아 장치를 1개로만 광고한다(게이트는 통과하지만
#   광고 수가 안 늘어나는 조용한 실패). draDriver 는 sharing 과 무관해 v2 그대로다.
generatedBackend:
  devicePlugin:
    repository: "generic-device-plugin"
    tag: "v3"
  draDriver:
    repository: "generic-dra-driver"
    tag: "v2"

# acpp: AcceleratorPartitionPolicy 관련 설정.
#   probeImage: verify 단계 1-파티션 테스트 Pod 이미지. air-gap(Harbor mirror) 클러스터는
#   미러 도달 가능 이미지로 지정. 빈 값이면 operator 코드 기본값(registry.k8s.io/pause:3.9) 사용.
acpp:
  probeImage: docker.io/library/nginx:1.25.2-alpine
  # probeImages: 벤더 기능 probe(파드가 벤더 CLI 를 1회 실행하고 종료코드로 판정) 이미지.
  #   acpp.probeImage 와 같은 규약의 전체 경로 값이라 global.registry/vendorRegistry 로
  #   조립되지 않는다(air-gap 이면 미러 경로를 직접 적는다). 빈 값(기본)인 벤더는 표에
  #   미등록으로 취급돼 기존 pause/Running 판정을 그대로 쓴다(이미지 미수신이 실패로 뒤집히지 않음).

  #   - nvidia: `nvidia-smi -L` 1회 실행. nvidia-container runtime 이 주입하는 base CUDA
  #     이미지면 된다. 예: nvidia/cuda:12.9.1-base-ubuntu22.04(Harbor 미러: kcloud/nvidia/cuda:
  #     동일 태그).

  #   - tenstorrent: `tt-smi -s` 1회 실행. images 저장소 probe-tenstorrent(PyPI tt-smi) 빌드.

  #   - furiosa: `furiosa-smi info` 1회 실행. docker.io/furiosaai/furiosa-smi:2026.1.0 은
  #     라이브러리(libfuriosa_smi.so)만 담고 CLI 바이너리가 없어 이미지만으로는 매번 실패한다.
  #     `probeHostBinary.furiosa` 에 호스트 furiosa-smi 절대경로를 채우면 그 바이너리를 probe
  #     파드에 마운트해 쓸 수 있다(기본은 비어 있어 opt-in).

  #   - rebellions: `rbln-stat` 1회 실행. images 저장소 probe-rebellions(nsenter 로 호스트
  #     네임스페이스 진입 후 호스트 바이너리 실행) 빌드 — ⚠ privileged+hostPID 파드라서
  #     기본을 비워 둔다. 켜는 순간 특권 파드가 그 벤더 노드마다 뜬다.
  probeImages:
    nvidia: ""
    tenstorrent: ""
    furiosa: ""
    rebellions: ""
  # probeHostBinary.furiosa: 호스트 furiosa-smi 절대경로(예: /usr/bin/furiosa-smi). probeImages.furiosa
  #   이미지엔 CLI 가 없어 이 값을 채워야 furiosa probe 가 동작한다(설정된 노드에서만 유효 —
  #   노드마다 버전이 다를 수 있다). Command 가 파드 PATH 로 찾으므로 이 경로는 이미지 PATH
  #   안(예: /usr/bin)에 있어야 한다.

  # 마운트되는 것은 바이너리뿐이라, 실행 시 호스트가 아니라 probeImages.furiosa 이미지에 담긴
  #   libfuriosa_smi.so 를 로드한다 — 호스트와 이미지의 라이브러리 버전이 호환돼야 하며, 버전이
  #   다르면 라이브러리 크기·체크섬이 달라질 수 있다. 호환 여부는 이 값만으로는 보장되지
  #   않고 probe 파드의 종료코드·stderr 로 확인한다.
  probeHostBinary:
    furiosa: ""
  # MPS 공유 모드의 control daemon. ACPP 가 sharing.mode=mps 일 때만 배치한다(별도 토글 없이
  # 정책이 켜면 뜨고 끄면 사라진다). hostExec 과 같은 규약이다 — repository 가 비면 env 가
  # 주입되지 않아 코드 기본값(공개 nvcr.io/nvidia/k8s-device-plugin)이 쓰이고, air-gap 에서는
  # 당길 수 없어 ImagePullBackOff 로 남는다. 벤더 이미지라 global.vendorRegistry 를 비우면
  # upstream(nvcr.io)에서 직접, 채우면 <vendorRegistry>/nvidia/k8s-device-plugin 으로 당긴다.
  # 미러가 없으면 daemon 이 못 뜬 채 SharingDaemonNotReady 로 드러난다(Ready 로 위장 안 함).
  mpsControlDaemon:
    upstream: "nvcr.io"
    repository: "nvidia/k8s-device-plugin"
    tag: "v0.19.3"
  # measuredSharing: 이 클러스터에서 **실제로 시험한** 공유 기능을 기록한다. capability status 의
  # verification 축이 required → verified 로 올라간다. 유효값은 "verified" 뿐이고 그 외/미설정은
  # required 다. 코드는 이 값을 스스로 만들지 않는다 — 실측은 하드웨어·드라이버·device-plugin
  # 조합에서 일어난 사건이라 코드가 모든 장치에 대해 주장할 수 없기 때문이다.
  # MPS 지원 여부 자체(supported)는 장치별 MIG 관측이 정하므로 이 값이 뒤집지 못한다 —
  # 검증 축만 올린다. 하드웨어를 교체하면 다시 시험할 때까지 지워야 한다.

  # ⚠ 이 값은 status 표기만 바꾸지 않는다 — **워크로드 승인 게이트**다. AcceleratorWorkload 의
  # 공유 요청은 미검증 축을 거절하므로, 켜는 순간 이 클러스터의 모든 NVIDIA 장치에서 그 거절이
  # 풀린다. implementation:auto 의 후보 선택도 이 축을 읽는다(timeSlicing → multiProcess 순).

  # 두 값의 효과는 대칭이 아니다:
  #  - timeSlicing: MIG-capable 장치의 time-slicing 워크로드 승인을 실제로 연다.
  #    비-MIG 장치(A2 등)는 TimeSlicing 축이 미기입이라 영향 없음.
  #  - multiProcess: auto 후보로는 올라가지만 워크로드는 아직 거절된다 — MPS capability 가
  #    maxReplicas 를 채우지 않아 "maxReplicas is unset" 게이트에 걸린다. 이것만 켜면 auto 가
  #    MPS 를 고른 뒤 거절하므로, 켤 때는 timeSlicing 도 함께 켜는 편이 안전하다.

  # ⚠ 이종 클러스터: 이 값은 클러스터 단위다. A30/A2 를 시험하고 켠 뒤 H100 노드를 추가하면
  # 그 노드는 한 번도 측정되지 않은 채 공유 워크로드를 받는다.
  measuredSharing:
    # multiProcess: "verified"  # MPS 한 GPU 위 CUDA 프로세스 2개 동시 실행 확인 시
    # timeSlicing: "verified"   # time-slicing 배수 광고·할당 확인 시
    multiProcess: ""
    timeSlicing: ""

# operationCoordinator: 장치 변경을 트랜잭션으로 직렬화하는 조정자 설정. mode=off(기본)는
#   정책이 직접 장치를 바꾸고, mode=delegate 는 정책이 AcceleratorOperation 을 만들어 조정자가
#   충돌 판정·노드 잠금·선행 기록을 거쳐 같은 적용 경로를 실행한다(적용 로직은 두 모드가 동일).
#   기본값을 off 로 두는 이유는 켜진 채 배포되면 라이브 장애로 직결되기 때문이다.

# ⚠ 끄는 것이 항상 즉시 안전하지는 않다. AcceleratorOperation 컨트롤러는 이 스위치와 무관하게
#   항상 등록돼 있다(진행 중 트랜잭션을 중간에 버리면 하드웨어가 어중간한 상태로 남아 스위치로
#   못 막는다). 끄는 순간 진행 중(비-종점) 트랜잭션이 있으면 조정자가 그것을 끝까지 실행하면서
#   동시에 정책의 직접 경로도 새로 돌아 두 주체가 같은 노드를 만질 수 있다. 안전하게 끄려면
#   `kubectl get aop` 로 비-종점(Succeeded/RolledBack/ManualRecoveryRequired 가 아닌) 트랜잭션이
#   없는지 먼저 확인한다.
operationCoordinator:
  mode: "off"

# fullnameOverride: operator Deployment/SA/RBAC 리소스명(파드 prefix). 릴리스명과 분리.
#   NVIDIA gpu-operator 처럼 Deployment 이름에 controller 를 병기하지 않는다. 파생 이름도
#   따라간다(kcloud-operator-api, -webhook, -role, -leader-election). selector 라벨은
#   chart/release 이름 기반이라 불변이므로 immutable selector 함정이 없다.
fullnameOverride: kcloud-operator

serviceAccount:
  create: true
  name: ""

rbac:
  # 부분 스위치다 — rbac.yaml(operator 본체 + kcloud-node-manager + leader-election)
  # 만 끈다. pre/post hook Job 넷(uninstall gate·crd purge·crd apply·구 DS 정리)이
  # 각자 갖는 SA·ClusterRole·ClusterRoleBinding 열두 개는 이 값과 무관하게 항상 생성된다.
  create: true

deployClusterPolicy: true

clusterPolicy:
  name: npuclusterpolicy-sample
  namespace: ""

detector:
  # registry 는 global.registry 로 조립됨 (repository 는 registry-relative path).
  repository: "kcloud-node-manager"
  # 0.6.19 이상이어야 한다 — node-manager DaemonSet 의 PodResources 사이드카가 그 이미지에만
  # 있는 /podresources-writer 경로로 실행된다(구 이미지면 사이드카 컨테이너만 시작 실패).
  tag: "0.6.19"
  # 전체 경로를 명시하면 global.registry 접두와 repository·tag 조립을 모두 무시하고
  # 이 값을 그대로 쓴다(full override, crdUpgrade.kubectlImage 와 같은 규약). air-gap
  # 미러에서 전체 경로를 한 값으로 주는 자리.
  image: ""

# ─────────────────────────────────────────────────────────────────────────────
# NOTE: 아래 nvidia/furiosa 블록은 NPUClusterPolicy CR의 devicePlugin 설정입니다.
#       드라이버 설치 정책(DriverInstallPolicy CR)은 하단 driverInstallPolicies 블록을
#       사용하세요. 두 블록은 별개의 CRD를 대상으로 합니다.
# ─────────────────────────────────────────────────────────────────────────────
nvidia:
  enabled: true
  # managementMode: managed(기본)|delegated|external. 빈 값 = managed.
  #   managed  : kcloud 가 device-plugin/DRA/exporter 를 배포·삭제한다(벤더 operator 가 없을 때).
  #   delegated: 벤더 operator(예: NVIDIA GPU Operator)가 이미 배포를 맡는다. kcloud 는 배포하지
  #              않고 존재만 확인하며, 못 찾아도 managed 로 내려가지 않고 경고만 낸다.
  #   external : 드라이버·런타임이 kcloud 밖에 이미 설치돼 있다. kcloud 는 노드만 관측한다.
  #   세 값 모두 detector 라벨·NodeDeviceReport·evidence 관측은 유지한다. 관리 모드 안내 참조.
  managementMode: ""
  # advertiseBy: 이 벤더 장치를 누가 광고하는가. 빈 값/미지정이면 device-plugin 이다.
  #   "dra" 로 바꾸면 operator 가 대상 노드에 dra-owned 라벨을 붙이고 그 노드에서
  #   device-plugin DaemonSet 을 걷는다. 광고는 벤더 DRA 드라이버가 발행하는
  #   ResourceSlice 가 맡는다 — 그 드라이버가 없으면 그 노드는 아무것도 광고하지 않는다.
  #   ⚠ 벤더 DRA 드라이버를 먼저 설치하고 ResourceSlice 발행을 확인한 뒤에 켤 것.
  #   되돌리려면 이 값을 지우면 된다(라벨 회수 + device-plugin 복귀).
  advertiseBy: ""
  devicePluginImage: "nvcr.io/nvidia/k8s-device-plugin:v0.17.1"
  # 자립 셀렉터(node-manager 가 감지 시 부여). NFD/gpu-operator 라벨 비의존.
  nodeSelector:
    kcloud.ai/nvidia.present: "true"
  # GPU 텔레메트리(온도/사용률/메모리/전력) exporter. NPU 4벤더는 node-manager 가
  # hwmon 으로 수집하지만 NVIDIA 드라이버는 hwmon 을 등록하지 않아 NVML 경로가 필요하다.
  # enabled=true 로 켜면 NVIDIA 노드에 upstream dcgm-exporter DS(:9400)가 뜬다.
  dcgmExporter:
    enabled: false
    image: "nvcr.io/nvidia/k8s/dcgm-exporter:4.5.2-4.8.1-ubuntu22.04"
  # dra: NVIDIA DRA 드라이버 배포. Furiosa 와 달리 광고 주체와 묶여 있다 —
  # advertiseBy 가 dra 가 아니면 operator 가 거절한다(벤더 chart 가 device-plugin 과의
  # 공존을 막고, 광고를 끈 채로 깔면 발행물 없는 껍데기만 남는다).
  # 노드 일부만 넘기는 구성도 거절한다. 벤더 발행 스위치가 DaemonSet 단위다.
  # 벤더 이미지다 — vendorRegistry 를 비우면 upstream(registry.k8s.io)에서 직접 당긴다.
  dra:
    enabled: false
    upstream: "registry.k8s.io"
    repository: "dra-driver-nvidia/dra-driver-nvidia-gpu"
    tag: "v0.4.0"

furiosa:
  enabled: true
  # managementMode: managed(기본)|delegated|external. 빈 값 = managed.
  #   managed  : kcloud 가 device-plugin/DRA/exporter 를 배포·삭제한다(벤더 operator 가 없을 때).
  #   delegated: 벤더 operator 가 이미 배포를 맡는다. furiosa 는 감지 시그니처가 없어(다른
  #              벤더와 달리) 존재 확인이 안 되지만, 그래도 managed 로 내려가 중복 배포하진 않는다.
  #   external : 드라이버·런타임이 kcloud 밖에 이미 설치돼 있다. kcloud 는 노드만 관측한다.
  #   세 값 모두 detector 라벨 등은 유지. managed 가 아니면 furiosa-exporter 도 렌더 안 됨.
  managementMode: ""
  # advertiseBy: nvidia 블록 주석 참조. 빈 값이면 device-plugin.
  advertiseBy: ""
  devicePluginImage: "ghcr.io/furiosa-ai/k8s-device-plugin:0.10.1"
  configMapName: "npu-device-plugin"
  # 자립 셀렉터(node-manager 가 Warboy 감지 시 부여). NFD/수동 라벨 비의존.
  nodeSelector:
    kcloud.ai/furiosa.present: "true"
  # exporter: RNGD 텔레메트리 exporter(:9410). 코어 사용률·DRAM·전력·온도.
  # dcgm-exporter 의 Furiosa 대응물이며 벤더 SMI 를 cgo 로 호출한다.
  exporter:
    enabled: false
    repository: "furiosa-exporter"
    tag: "0.1.3"
    interval: "10s"
  # ─────────────────────────────────────────────────────────────────────
  # Furiosa RNGD device plugin. spec.furiosa.rngd 필드는 omitempty 라 enabled=false 면
  # CR 에서 생략된다.
  # ─────────────────────────────────────────────────────────────────────
  rngd:
    enabled: true
    # advertiseBy: nvidia 블록 주석 참조. 빈 값이면 device-plugin.
    advertiseBy: ""
    # 공개 벤더 device plugin 을 쓴다. 벤더 helm chart(furiosa-helm-charts/furiosa-device-plugin
    # appVersion 2026.1.1)와 같은 docker.io/furiosaai/furiosa-device-plugin 이미지다.
    # global.vendorRegistry 를 비우면 upstream(docker.io)에서 직접 당기고, air-gap 에서는
    # <vendorRegistry>/furiosaai/furiosa-device-plugin 으로 미러해 둔다.

    # 이 이미지는 --debugMode 만 받고 --policy 는 없다. ghcr.io/furiosa-ai/furiosa-device-plugin
    # (v0.0.x) 은 /etc/config/config.yaml 을 요구하는 다른 계열이라 CrashLoopBackOff 가 나 쓰지
    # 않는다. 파티션(quad/dual/single-core)이 필요하면 --policy 를 지원하는 내부 이미지
    # (kcloud/furiosa-device-plugin-mi)로 바꾸고 partitionPolicy 를 함께 바꾼다(공개 범위 밖).
    devicePluginUpstream: "docker.io"
    devicePluginRepository: "furiosaai/furiosa-device-plugin"
    devicePluginTag: "2026.1.1"
    # dra: 이 벤더의 DRA 드라이버를 operator 가 배포할 것인가. 광고 주체(advertiseBy)와
    # 독립이다 — 켜도 광고는 device-plugin 이 계속 맡는다.
    # 벤더 이미지다 — vendorRegistry 를 비우면 upstream(docker.io)에서 직접 당긴다.
    dra:
      enabled: false
      upstream: "docker.io"
      repository: "furiosaai/furiosa-dra-driver"
      tag: "2026.1.1"
    resourceName: "furiosa.ai/rngd"
    # 파티션 정책: "none"(1) / "quad-core"(2) / "dual-core"(4) / "single-core"(8) instance/card.
    # "none" 이면 --policy 를 전달하지 않는다. 그 외 값은 위 공개 이미지에서 CrashLoopBackOff.
    partitionPolicy: "none"
    # debugMode: device plugin 에 --debugMode 를 넘길지. 공개 이미지도 이 flag 는 받지만 기본은 끈다.
    #   값을 지우면 켠 것으로 해석한다(옛 동작 유지).
    debugMode: false
    # 자립 셀렉터(node-manager 가 RNGD 감지 시 부여). 수동/NFD 라벨 비의존.
    nodeSelector:
      kcloud.ai/rngd.present: "true"
  # ─────────────────────────────────────────────────────────────────────
  # Furiosa 통합 device-plugin. enabled=true 면 Warboy/RNGD 를 개별 DS 2개 대신 하나의 통합
  # DS 로 배포한다. 통합 이미지에 두 벤더 바이너리를 동봉하고 entrypoint 가 PCI(0x1ed2 device
  # ID)로 모델을 감지해 해당 바이너리를 exec 한다(proxy 없음, 리소스명·버전핀 불변).
  # 기본 false = 기존 2-DS 경로(fallback 보존). registry 는 global.registry 로 조립한다.
  # ─────────────────────────────────────────────────────────────────────
  unified:
    enabled: false
    # 자체 구현 device-plugin. global.registry 가 앞에 붙어
    # <registry>/furiosa-unified-device-plugin 이 된다. 발행 규약이 "키가 곧 이미지
    # 이름"(images 저장소 images.yaml)이므로 중간 경로를 넣지 않는다.
    # 워크로드는 kcloud 네임스페이스에 kcloud-furiosa-device-plugin 이름으로 뜬다.
    devicePluginRepository: "furiosa-unified-device-plugin"
    devicePluginTag: "0.1.0"

rebellions:
  enabled: true
  # managementMode: managed(기본)|delegated|external. 빈 값 = managed.
  #   managed  : kcloud 가 device-plugin/DRA/exporter 를 배포·삭제한다(벤더 operator 가 없을 때).
  #   delegated: 벤더 operator 가 이미 배포를 맡는다. kcloud 는 배포하지 않고 존재만 확인하며,
  #              못 찾아도 managed 로 내려가지 않고 경고만 낸다.
  #   external : 드라이버·런타임이 kcloud 밖에 이미 설치돼 있다. kcloud 는 노드만 관측한다.
  #   세 값 모두 detector 라벨·NodeDeviceReport·evidence 관측은 유지한다. 관리 모드 안내 참조.
  managementMode: ""
  # advertiseBy: nvidia 블록 주석 참조. 빈 값이면 device-plugin.
  advertiseBy: ""
  # 벤더 이미지다 — vendorRegistry 를 비우면 upstream(docker.io)에서 직접 당긴다.
  devicePluginUpstream: "docker.io"
  devicePluginRepository: "rebellions/k8s-device-plugin"
  devicePluginTag: "v0.3.6"
  resourceName: "ATOM"
  resourcePrefix: "rebellions.ai"
  namespace: "kube-system"
  configMapName: "rbln-device-plugin-config"
  # 자립 셀렉터(node-manager 가 감지 시 부여). 수동 라벨 비의존.
  nodeSelector:
    kcloud.ai/rebellions.present: "true"
    kubernetes.io/arch: "amd64"
  # DRA 드라이버 배포 여부. 기본은 끔 — 켜려면 벤더 드라이버 이미지가 닿아야 한다.
  # 벤더 이미지다 — vendorRegistry 를 비우면 upstream(docker.io)에서 직접 당긴다.
  dra:
    enabled: false
    upstream: "docker.io"
    repository: "rebellions/k8s-dra-driver-npu"
    tag: "v0.2.0"

tenstorrent:
  enabled: true
  # managementMode: managed(기본)|delegated|external. 빈 값 = managed.
  #   managed  : kcloud 가 device-plugin/DRA/exporter 를 배포·삭제한다(벤더 operator 가 없을 때).
  #   delegated: 벤더 operator 가 이미 배포를 맡는다. kcloud 는 배포하지 않고 존재만 확인하며,
  #              못 찾아도 managed 로 내려가지 않고 경고만 낸다.
  #   external : 드라이버·런타임이 kcloud 밖에 이미 설치돼 있다. kcloud 는 노드만 관측한다.
  #   세 값 모두 detector 라벨·NodeDeviceReport·evidence 관측은 유지한다. 관리 모드 안내 참조.
  managementMode: ""
  # advertiseBy: nvidia 블록 주석 참조. 빈 값이면 device-plugin.
  advertiseBy: ""
  # kcloud 가 빌드하는 이미지다(images 저장소 tenstorrent-device-plugin/).
  # registry 는 global.registry 로 조립됨 (repository 는 registry-relative path).
  devicePluginRepository: "kcloud-tt-device-plugin"
  devicePluginTag: "v0.1.0"
  resourceName: "tenstorrent.com/blackhole"
  # 자립 셀렉터(node-manager 가 Blackhole 감지 시 부여). 수동 라벨 비의존.
  nodeSelector:
    kcloud.ai/tenstorrent.present: "true"
  # DRA 드라이버 배포 여부. 기본은 끔 — 벤더가 chart 를 주지 않아 값을 우리가 고정한다.
  # 벤더 이미지다 — vendorRegistry 를 비우면 upstream(ghcr.io)에서 직접 당긴다.
  dra:
    enabled: false
    upstream: "ghcr.io"
    repository: "tenstorrent/tt-dra-driver"
    tag: "0.0.48"
    # FM(Fabric Manager) agent 이미지. 이 벤더의 드라이버는 장치 발견을 직접 하지 않고
    # 같은 파드의 이 데몬에 gRPC 로 맡기므로, 못 받으면 드라이버가 CrashLoop 한다.
    # 벤더가 버전 태그를 발행하지 않아 공개 태그가 latest·main·sha 뿐이다 — 재현 가능한
    # 배포가 필요하면 sha 태그를 골라 tag 를 덮는다. air-gap 은 드라이버 이미지와 함께 이것도
    # 미러에 올려야 한다(둘 다 global.vendorRegistry 로 조립된다).
    fabricManager:
      upstream: "ghcr.io"
      repository: "tenstorrent/tt-fabric-manager"
      tag: "latest"
    # 지금 렌더되는 FM 구성의 한계: operator 는 노드마다 FM agent 만 띄우고 FM controller 는
    # 배치하지 않는다. agent 는 등록에 실패하고 노드마다 초당 1회 장치 재발견을 재시도한다.
    # DRA 경로 자체는 이 상태로도 성립하지만(GetTopology 는 응답한다), 단일 노드에서는 무해해도
    # 운영에 올릴 구성은 아니다. 여러 노드에 걸친 fabric 토폴로지는 controller 없이는 쓸 수
    # 없다(미검증).

runtimeClass:
  nvidia:
    enabled: true

# ─────────────────────────────────────────────────────────────────────────────
# Admission webhook: DIP/NCP validating + opt-in Pod mutating.
# 기본 opt-in(enabled=false) — 라이브 검증 시에만 true 로 전환.
# cert 는 helm lookup 으로 최초 1회만 발급하고 upgrade 마다 재사용(멱등).
# failurePolicy=Ignore: webhook 장애가 클러스터 admission 을 막지 않게(최우선 안전).
# ─────────────────────────────────────────────────────────────────────────────
webhook:
  enabled: false
  # 서버 포트(operator 컨테이너 내부). controller-runtime 기본 9443.
  port: 9443
  failurePolicy: Ignore
  # Pod mutating 대상 opt-in 라벨. 이 라벨이 없는 Pod 는 무개입.
  injectLabel: "kcloud.ai/inject"

# ─────────────────────────────────────────────────────────────────────────────
# 관리 REST API + 웹 콘솔(track ③, /ui/): kubeconfig 없는 외부 관리툴/대시보드용 HTTP API.
# operator pod 내 별도 HTTPS listener(:9444). 인증=TokenReview, 인가=SubjectAccessReview.
# 기본 opt-in(enabled=false) — 라이브 검증 시에만 true 로 전환. cert 는 lookup 멱등(upgrade 재수행에도 불변).
# Service kcloud-operator-controller-api(ClusterIP, 443→9444). control 은 전부 CR patch 로 귀결.
# ─────────────────────────────────────────────────────────────────────────────
api:
  # 관리 REST API + 웹 콘솔(/ui/). 활성 시 cert Secret 과 ClusterIP Service 가 생기고
  # operator 가 :9444 HTTPS listener 를 연다. 콘솔은 별도 값 없이 이 하나로 함께 켜진다.
  enabled: false
  # 서버 포트(operator 컨테이너 내부). metrics(:8443)·webhook(:9443)와 겹치지 않게 :9444.
  port: 9444
  service:
    # ClusterIP(기본) 이면 클러스터 안에서만 닿는다. 콘솔을 클러스터 밖 브라우저로 열려면
    # NodePort 로 바꾼다 — 아무 노드 IP 의 nodePort 로 https 접속이 열린다.
    type: ClusterIP
    # NodePort 일 때 쓸 고정 포트(30000-32767). 비우면 k8s 가 임의 할당한다.
    # 고정하지 않으면 재설치마다 포트가 바뀌어 북마크가 깨진다.
    nodePort: ""
    # cert SAN 에 더할 DNS 이름. 노드 호스트명으로 접속할 때 쓴다.
    # cert 는 최초 1회만 발급되므로 나중에 늘리려면 -api-cert Secret 삭제 후 pod 재시작.
    extraAltNames: []
    # cert SAN 에 더할 IP. **IP 로 접속하려면 반드시 여기에 넣는다** — IP 를 DNS SAN 에
    # 넣으면 브라우저가 매칭하지 않아 경고가 그대로 뜬다.
    extraAltIPs: []
  console:
    # 콘솔 접속용 ServiceAccount. 콘솔은 사람이 든 Bearer 토큰으로만 데이터를 읽으므로
    # (서버가 대신 읽어주는 경로 없음) 토큰을 발급할 주체가 하나 필요하다. operator SA 를
    # 쓰면 콘솔이 요구하지 않는 권한까지 브라우저에 들어가므로 별도로 둔다.
    #   kubectl -n <ns> create token <release>-console
    serviceAccount:
      enabled: true
      # viewer   = 조회 라우트만
      # operator = 정책 생성·삭제와 드라이버 업그레이드·토글까지
      role: viewer
    # 화면(외부 UI)용 ServiceAccount 를 더 만든다. 항목마다 SA <release>-console-<name> 과 바인딩.
    # role: viewer(조회만) | operator(viewer + 정책·배포 생성·삭제, 드라이버 제어). 기본 viewer.
    # api.console.serviceAccount.enabled: true 일 때만 렌더된다(viewer ClusterRole 을 그 블록이 만든다).
    extraServiceAccounts: []
    #  - name: partner-ui
    #    role: operator

# ─────────────────────────────────────────────────────────────────────────────
# DriverInstallPolicy CR 자동 생성 설정 (driverInstallPolicies와 nvidia/furiosa 구분)
# ─────────────────────────────────────────────────────────────────────────────
driverInstallPolicies:
  # ─────────────────────────────────────────────────────────────────────
  # Furiosa Warboy (mode=daemonset). 이름을 `furiosa-warboy-ds` 로 고정해 이전 배포와의
  # 충돌을 막는다. mode=job 으로 되돌리려면 values override 로 enabled=false 후 수동으로
  # CR 을 만든다.
  # ─────────────────────────────────────────────────────────────────────
  furiosa:
    enabled: true
    name: furiosa-warboy-ds
    vendor: furiosa
    model: warboy
    rebootStrategy: IfNeeded
    kernelAllowlist: ["5.15.*", "6.8.*"]
    # verifiedVersions: 검증된 driver version 화이트리스트.
    # 비어있으면 버전 검증 skip (backward compat). 추가 시 외 버전은 UnverifiedVersion 상태로 거부.
    verifiedVersions:
      - "1.7.8"
      - "1.9.8-3"
      - "1.9.9-3"
    # Furiosa installer DaemonSet 은 node-manager 가 부여한 자립 셀렉터 노드에만 스케줄.
    # detector 오탐으로 NVIDIA-only 노드에서 Furiosa 가 보고되더라도 nodeSelector 로 2차 차단.
    nodeSelector:
      kcloud.ai/furiosa.present: "true"
    driver:
      # Warboy 는 Mode=job 이 기본이다(privileged driver DS 상주 0). 설치는 일회성 install Job 이고
      # RUN_MODE=job 지원 이미지(-v5)가 필요하다. daemonset 코드 경로는 fallback 으로 남아 있다.
      mode: job
      version: "1.9.9-3"
      # registry 는 global.registry 로 조립됨 (repository 는 registry-relative path).
      # 이미지는 드라이버를 담지 않는다. 태그는 빌드 개정(vN)이고 드라이버 버전은 위 version 이 정한다.
      # v1 부터 Warboy·RNGD 공용 통합 설치기다(driver-installer/furiosa/).
      repository: "furiosa-driver-ds"
      tag: "v3"
      installer: apt
      # 다운그레이드 허용 여부 (false=버전 낮추기 금지, 안전장치)
      allowDowngrade: false
      # 버전 출처: Policy(CR 명세 사용) | Node(노드 자동 감지)
      versionSource: "Policy"
      # Passthrough 모드 노드에서 드라이버 설치 건너뜀
      skipOnPassthrough: true
      # 커널별 사전 컴파일 이미지. 키는 노드의 uname -r, 값은 이미지 참조다.
      # 태그의 버전 토큰이 위 version 과 같아야 한다 — 다르면 operator 가 이 이미지를
      # 쓰지 않고 기본 image 로 되돌아가며 KernelImageRejected 경고를 낸다.
      # 사이트 값이며 기본은 비움.
      kernelImages: {}
      # 커널별 사전 컴파일 이미지의 빌드 개정(…-vN)과 variant 토막. 값을 주면 kernelImages 에
      # 노드 커널 항목이 없어도 "<version>-<variant>-k<커널>-<빌드 개정>" 규약으로 이미지
      # 참조를 조립한다. Warboy 발행 규약은 variant 토막이 필수라 비우면 없는 태그를 당긴다.
      # Warboy 사전 컴파일 이미지는 벤더 apt 저장소 자격 증명 문제로 아직 발행되지 않으므로
      # (빌드 타깃이 warboy variant 를 거절한다), 발행 전 이 값을 켜면 install Job 이 그
      # 태그를 당기지 못한다. 그래서 기본은 비움이다.
      kernelImageBuildRevision: ""
      kernelImageVariant: "warboy"
    # workloadProbe: 검증 체인의 마지막 단계(opt-in). 켜면 노드가 cordon 된 상태에서 장치 1개를
    # 요청하는 probe 파드를 띄워 벤더 CLI 종료 코드로 판정한다(Succeeded=통과). 기본 꺼짐 — image
    # 가 비어 있으면 파드 생성이 거절된다. `furiosa-smi info` 1회 실행(acpp.probeImages.furiosa 와
    # 같은 CLI). 단, docker.io/furiosaai/furiosa-smi:2026.1.0 은 라이브러리만 담고 CLI 가 없어
    # 켜기 전에 CLI 가 든 이미지를 image 에 지정해야 한다.
    workloadProbe:
      enabled: false
      image: ""
      command: ["furiosa-smi", "info"]
      resourceName: "beta.furiosa.ai/npu"
      timeoutSeconds: 120
    upgradePolicy:
      autoUpgrade: true
      drainEnabled: true
      forceUpgrade: false
      maxUnavailable: 1
      maxParallelUpgrades: 1
      drainTimeout: "5m"
      validationTimeout: "10m"
      rollbackOnFailure: true
  # ─────────────────────────────────────────────────────────────────────
  # NVIDIA generic (mode=daemonset)
  # ─────────────────────────────────────────────────────────────────────
  nvidia:
    enabled: true
    name: nvidia-gpu-ds
    vendor: nvidia
    model: generic
    rebootStrategy: IfNeeded
    kernelAllowlist: ["5.15.*", "6.8.*"]
    # verifiedVersions: 검증된 driver version 화이트리스트.
    verifiedVersions:
      - "535.288.01"
      - "580.126.09"
      - "580.142"
      - "580.159.03"
      - "580.173.02"
      - "580.178.04"
      - "590.48.01"
      - "595.58.03"
      - "595.84"
    # 자립 셀렉터(node-manager 부여). 드라이버 install DS/Job + toolkit DS 공용.
    nodeSelector:
      kcloud.ai/nvidia.present: "true"
    driver:
      # NVIDIA Mode=job 이 기본이다(kubelet restart 리스크를 마지막에 격리하는 순서). 런타임
      # lifecycle 은 상주 toolkit DS 가 소유한다(driver=install Job, 런타임=toolkit 으로 분리).
      # v176(a1: v17→v16 위임, MANAGE_CONTAINER_TOOLKIT=false)이 RUN_MODE=job 을 지원하며,
      # daemonset 경로는 fallback 으로 남아 있다.
      mode: job
      # plain 태그(예: 580.126.09)는 entrypoint 가 없는 broken image 다 — idempotent skip·
      # race-safe host module pool 재검사·강화된 NVRM regex 가 적용된 -v173(v17.3) 사용을
      # 권장한다. -v16(legacy host install)은 deprecated.

      # 이 값은 DKMS 경로에서만 설치 버전을 정한다(ADR-002) — 사전 컴파일 경로에서는 이미지가
      # 버전을 정하고 이 값은 태그와의 결합 검증에만 쓰인다. 그래서 기본값은 우분투 아카이브에
      # 실재하는 버전이어야 한다. 아카이브에 없는 버전을 기본값에 두면 그 차트를 쓰는 다른
      # 클러스터가 설치에 실패한다.
      version: "580.178.04"
      # registry 는 global.registry 로 조립됨 (repository 는 registry-relative path).
      repository: "nvidia-driver-ds"
      # v4 부터 설치기가 정책 version 의 패키지를 apt-cache madison 으로 찾아 고정 설치한다
      # (host·containerized 경로 모두 — 이전 태그는 계열 최신을 설치하는 방식이다). 설치
      # 버전은 `version` 하나로 정하며, 실패해도 다른 후보로 대체하지 않는다. 필요하면
      # env 로 직접 줄 수 있다.

      # v5 는 재부팅 유예 가드를 정책 version 의 patch 단위까지 비교한다(다른 patch 가 깔려
      # 있으면 재부팅을 맡기지 않는다) — apt 잠금 대기 실패는 호출부로 전파한다.
      # v6 는 이미지에 드라이버 패키지를 담지 않는다 — 설치는 호스트 apt(또는 kernelImages 의 사전 컴파일 .deb)로만 한다.
      tag: "v6"
      installer: apt
      # 다운그레이드 허용 여부 (false=버전 낮추기 금지, 안전장치)
      allowDowngrade: false
      # 버전 출처: Policy(CR 명세 사용) | Node(노드 자동 감지)
      versionSource: "Policy"
      # Passthrough 모드 노드에서 드라이버 설치 건너뜀
      skipOnPassthrough: true
      # 커널별 사전 컴파일 이미지. 키는 노드의 uname -r, 값은 이미지 참조다.
      # 태그의 버전 토큰이 위 version 과 같아야 한다 — 다르면 operator 가 이 이미지를
      # 쓰지 않고 기본 image 로 되돌아가며 KernelImageRejected 경고를 낸다.
      # 이 맵 값은 kcloud-operator.image 헬퍼를 거치지 않고 그대로 CR 에 실리므로
      # global.registry 를 포함한 전체 이미지 참조로 적는다.
      kernelImages: {}
      # 커널별 사전 컴파일 이미지의 빌드 개정(…-vN). 값을 주면 kernelImages 에 노드 커널
      # 항목이 없어도 "<version>-k<커널>-<빌드 개정>" 규약으로 이미지 참조를 조립한다 —
      # 커널 하나하나를 위 맵에 적지 않아도 사전 컴파일 경로가 동작한다.
      # NVIDIA 발행 규약에는 variant 토막이 없다(예 580.126.09-k5.15.0-171-generic-v4).
      # 빈 값(기본)이면 조립하지 않고 image(DKMS 컴파일)를 쓴다. 발행된 커널 이미지가 없는
      # 레지스트리에서 이 값을 켜면 install Job 이 그 태그를 당기지 못하므로 기본은 비움이다.
      kernelImageBuildRevision: ""
    toolkit:
      # enabled=true 시 ToolkitDaemonSet reconciler 가 nvidia-container-toolkit DS 를 생성해
      # containerd 에 nvidia runtime 을 등록한다(nvidia-ctk, idempotent). ⚠️ containerd 변경은
      # 노드 전체에 영향을 준다 — host-managed 로 이미 등록된 노드에서는 no-op. image 미지정
      # 시 코드 기본값(nvcr.io/.../container-toolkit)을 쓰므로, 내부/air-gap 클러스터에서는
      # 아래 image 를 Harbor 미러 경로로 override 한다.

      # ⛔ 기본값 disabled: toolkit DS 가 containerd 를 건드리므로 opt-in 으로만 켠다.
      #    host-managed 로 runtime 이 이미 등록된 클러스터나 toolkit 이미지 미러가 없는
      #    air-gap 에서 자동 활성화되면 회귀(ImagePullBackOff)나 불필요한 containerd 재시작
      #    위험이 있다. runtime 미등록 fresh 노드에서만 true 로 켠다.
      enabled: false
      # image: "<your-registry>/nvidia/container-toolkit:v1.17.8-ubuntu20.04"
    # workloadProbe: 검증 체인의 마지막 단계(opt-in). 켜면 노드가 cordon 된 상태에서 장치 1개를
    # 요청하는 probe 파드를 띄워 벤더 CLI 종료 코드로 판정한다(Succeeded=통과). 기본 꺼짐 — image
    # 가 비어 있으면 파드 생성이 거절된다. `nvidia-smi -L` 1회 실행(acpp.probeImages.nvidia 와 같은
    # 전제) — nvidia-container-runtime 이 주입하므로 image 는 CUDA 베이스면 된다. 예:
    # nvidia/cuda:12.9.1-base-ubuntu22.04(Harbor 미러: kcloud/nvidia/cuda:동일 태그).
    workloadProbe:
      enabled: false
      image: ""
      command: ["nvidia-smi", "-L"]
      resourceName: "nvidia.com/gpu"
      timeoutSeconds: 120
    upgradePolicy:
      autoUpgrade: true
      drainEnabled: true
      forceUpgrade: false
      maxUnavailable: 1
      maxParallelUpgrades: 1
      drainTimeout: "5m"
      # validationTimeout 은 install Job 이 끝난 뒤의 검증(NDR 반영·device-plugin 재광고)에만
      # 쓰인다. Job 실행 자체는 activeDeadlineSeconds(30m)가 시한을 갖는다.
      validationTimeout: "10m"
      rollbackOnFailure: true
      # cross-major reboot: rmmod 불가로 재부팅이 필요한 NVIDIA 메이저 교체(예 535→580) 대응.
      # 미지정 시 CRD 기본값(maxReboots=1, rebootTimeout 15m) 적용. cross-major 는 통상 1회 재부팅이면 충분.
      maxReboots: 1
      rebootTimeout: "15m"
      # driver.rebootExecutor 는 CRD 기본 Job(operator 가 privileged reboot Job 생성). kured 는 1차 미구현.

  # ─────────────────────────────────────────────────────────────────────
  # Furiosa RNGD (mode=daemonset). rngd-1 노드가 준비돼 있어 기본값은 enabled=true 다.
  # ─────────────────────────────────────────────────────────────────────
  rngd:
    enabled: true
    name: furiosa-rngd-ds
    vendor: furiosa
    model: rngd
    rebootStrategy: IfNeeded
    kernelAllowlist: ["6.3.*", "6.5.*", "6.8.*"]
    # verifiedVersions: 검증된 driver version 화이트리스트.
    verifiedVersions:
      - "2026.1.0"
      - "2026.2.0"
      - "2026.3.0"
      - "2026.3.1"
    # 자립 셀렉터(node-manager 부여). 수동/NFD 라벨 비의존.
    nodeSelector:
      kcloud.ai/rngd.present: "true"
    driver:
      # RNGD 는 Mode=job 이 기본이다. RUN_MODE=job 지원 이미지(-v1)가 필요하고,
      # daemonset 코드 경로는 fallback 으로 남아 있다.
      mode: job
      version: "2026.3.1"
      # registry 는 global.registry 로 조립됨 (repository 는 registry-relative path).
      # v1 부터 Warboy 와 같은 통합 설치기 이미지를 쓴다. 모델은 PCI 로 자동 판별한다.
      repository: "furiosa-driver-ds"
      tag: "v3"
      installer: apt
      # 다운그레이드 허용 여부 (false=버전 낮추기 금지, 안전장치)
      allowDowngrade: false
      # 버전 출처: Policy(CR 명세 사용) | Node(노드 자동 감지)
      versionSource: "Policy"
      # Passthrough 모드 노드에서 드라이버 설치 건너뜀
      skipOnPassthrough: true
      # 커널별 사전 컴파일 이미지. 키는 노드의 uname -r, 값은 이미지 참조다.
      # 태그의 버전 토큰이 위 version 과 같아야 한다 — 다르면 operator 가 이 이미지를
      # 쓰지 않고 기본 image 로 되돌아가며 KernelImageRejected 경고를 낸다.
      # 사이트 값이며 기본은 비움.
      kernelImages: {}
      # 커널별 사전 컴파일 이미지의 빌드 개정(…-vN)과 variant 토막.
      # RNGD 발행 규약은 "<pkgVersion>-rngd-k<커널>-vN" 이라 variant 토막이 필수다 —
      # 아래 variant 를 비우면 존재하지 않는 태그를 조립해 install Job 이 그것을 당기지 못한다.
      # 빈 값(기본)이면 조립하지 않고 image(DKMS 컴파일)를 쓴다. 발행된 커널 이미지가 없는
      # 레지스트리에서 빌드 개정을 켜면 같은 실패가 나므로 기본은 비움이다.
      kernelImageBuildRevision: ""
      kernelImageVariant: "rngd"
    # workloadProbe: 검증 체인의 마지막 단계(opt-in). 켜면 노드가 cordon 된 상태에서 장치 1개를
    # 요청하는 probe 파드를 띄워 벤더 CLI 종료 코드로 판정한다(Succeeded=통과). 기본 꺼짐 — image
    # 가 비어 있으면 파드 생성이 거절된다. `furiosa-smi info` 1회 실행(acpp.probeImages.furiosa 와
    # 같은 CLI). 단, docker.io/furiosaai/furiosa-smi:2026.1.0 은 라이브러리만 담고 CLI 가 없어
    # 켜기 전에 CLI 가 든 이미지를 image 에 지정해야 한다.
    workloadProbe:
      enabled: false
      image: ""
      command: ["furiosa-smi", "info"]
      resourceName: "furiosa.ai/rngd"
      timeoutSeconds: 120
    upgradePolicy:
      autoUpgrade: true
      drainEnabled: true
      rollbackOnFailure: true
      maxUnavailable: 1
      validationTimeout: "10m"

  # ─────────────────────────────────────────────────────────────────────
  # Tenstorrent Blackhole (mode=job). DIP→DUS 버전 관리 체계를 쓴다. trackOnly=false(실설치)는
  # install Job 이 baked tt-kmd 소스를 DKMS 로 빌드·설치한다는 뜻이다(air-gap, 전이 재현:
  # test/live/tt-kmd-upgrade/run.sh). driver.image 는 실존 installer 이미지이고
  # imageVersionBaked=true 라 이미지↔버전이 1:1 이며, 롤백은 이전 버전 태그로 재구성한다.
  # ─────────────────────────────────────────────────────────────────────
  tenstorrent:
    enabled: true
    name: tenstorrent-blackhole-ds
    vendor: tenstorrent
    model: blackhole-p150
    rebootStrategy: IfNeeded
    kernelAllowlist: ["5.15.*", "6.8.*"]
    # verifiedVersions: 검증된 tt-kmd 버전 화이트리스트. 라이브에서 전이를 확인한 버전만 적는다.
    # 새 버전은 이미지를 만들고 test/live/tt-kmd-upgrade/run.sh 로 전이를 확인한 뒤에 넣는다.
    verifiedVersions:
      - "2.8.0"
      - "2.11.0"
    # 자립 셀렉터(node-manager 부여). 수동 라벨 비의존.
    nodeSelector:
      kcloud.ai/tenstorrent.present: "true"
    driver:
      mode: job
      # trackOnly=false: 실설치가 활성화된다. installer 이미지가 tt-kmd 소스를 baked 하여
      # DKMS 로 빌드·설치한다(air-gap). RUN_MODE=job 이면 설치 후 exit 0 으로 끝난다.
      trackOnly: false
      version: "2.11.0"
      versionSource: "Policy"
      # job모드 실설치 이미지(Harbor kcloud/tenstorrent-driver-ds:<ver>-v1, 예: 2.11.0-v1).
      # tag 의 kmd 버전과 version 을 함께 bump 한다(이미지↔버전 1:1 baked).
      repository: "tenstorrent-driver-ds"
      tag: "2.11.0-v1"
      installer: script
      imageVersionBaked: true   # 이미지↔버전 1:1 baked — 롤백은 이전 버전 태그(2.8.0-v1)로
      allowDowngrade: false
      skipOnPassthrough: true
      # 커널별 사전 컴파일 이미지. 예: "5.15.0-190-generic": "<registry>/tenstorrent-driver-ds:2.11.0-k5.15.0-190-generic-v1".
      # 사이트 값이며 기본은 비움. mode=job 전제.
      kernelImages: {}
      # 커널별 사전 컴파일 이미지의 빌드 개정(…-vN). 값을 주면 kernelImages 에 노드 커널
      # 항목이 없어도 "<version>-k<커널>-<빌드 개정>" 규약으로 이미지 참조를 조립한다.
      # Tenstorrent 발행 규약에는 variant 토막이 없다(예 2.11.0-k5.15.0-190-generic-v1).
      # 빈 값(기본)이면 조립하지 않고 image(baked tt-kmd 소스를 DKMS 로 빌드)를 쓴다.
      # 발행된 커널 이미지가 없는 레지스트리에서 켜면 install Job 이 그 태그를 당기지 못한다.
      kernelImageBuildRevision: ""
    # workloadProbe: 검증 체인의 마지막 단계(opt-in). 켜면 노드가 cordon 된 상태에서 장치 1개를
    # 요청하는 probe 파드를 띄워 벤더 CLI 종료 코드로 판정한다(Succeeded=통과). 기본 꺼짐 — image
    # 가 비어 있으면 파드 생성이 거절된다. `tt-smi -s` 1회 실행(acpp.probeImages.tenstorrent 와
    # 같은 CLI, images 저장소 probe-tenstorrent 빌드).
    workloadProbe:
      enabled: false
      image: ""
      command: ["tt-smi", "-s"]
      resourceName: "tenstorrent.com/blackhole"
      timeoutSeconds: 120
    upgradePolicy:
      autoUpgrade: false
      drainEnabled: true
      rollbackOnFailure: true
      maxUnavailable: 1
      validationTimeout: "10m"

rollingUpdate:
  # maxSurge 는 선언 값이 없다(deployment.yaml 하드코딩 유지, 1). 기본값을 0 으로
  # 두는 이유는 replicas=1 환경에서 기존 deployment.yaml 하드코딩 동작(중단 없는
  # 롤아웃)을 그대로 보존하기 위함이다. 올리려면 --set rollingUpdate.maxUnavailable=1.
  maxUnavailable: 0

# ─────────────────────────────────────────────────────────────────────────────
# crdUpgrade: helm upgrade 시 operator 바이너리의 apply-crds 서브명령으로 CRD 를 자동 적용한다.
# Helm 은 crds/ 를 install 시에만 처리해 upgrade 때 수동 `kubectl apply -f crds/` 가 필요한데,
# 이 Job 이 그 절차를 대신한다(operator 이미지를 재사용해 별도 미러링도 불필요하다).
# 수동 적용을 선호하거나 Job 에 권한을 줄 수 없는 환경은 enabled: false 로 끄고 기존 절차를 쓴다.
# ─────────────────────────────────────────────────────────────────────────────
crdUpgrade:
  enabled: true
  # pre-upgrade cleanup Job(구 이름 DaemonSet 삭제)이 사용하는 kubectl 이미지. 벤더 이미지이므로
  # global.vendorRegistry 로 조립된다.
  #   - vendorRegistry 가 비어("") 있으면 → docker.io/bitnamilegacy/kubectl:1.28 (public)
  #   - vendorRegistry 설정 시 → <vendorRegistry>/bitnamilegacy/kubectl:1.28 (사설 미러)
  # kubectlImage 를 명시하면 조립을 무시하고 그 값을 그대로 쓴다(full override).

  # 저장소 이름이 bitnamilegacy 인 이유: Bitnami 가 공개 카탈로그를 정리하며 docker.io/bitnami/
  # kubectl 의 태그를 모두 내리고 bitnamilegacy 로 옮겼다. 옛 <registry>/bitnami/kubectl 경로에
  # 사설 미러를 두고 있다면 kubectlImage 로 그 경로를 직접 지정한다.
  kubectlUpstream: "docker.io"
  kubectlRepository: bitnamilegacy/kubectl
  kubectlTag: "1.28"
  kubectlImage: ""

# Leader election (controller-runtime Lease-based)
leaderElection:
  enabled: true

# Pod placement & runtime tuning. imagePullSecrets 는 operator Deployment 뿐 아니라
# CR(NPUClusterPolicy/DriverInstallPolicy)을 통해 컨트롤러가 런타임 생성하는 전 자식
# DaemonSet·ServiceAccount 에도 전파된다 — private 레지스트리에서 `--set
# imagePullSecrets[0].name=<secret>` 한 줄로 전 파드 pull 이 가능하다. 미지정([]) 시
# 노드레벨(containerd) 인증 경로를 유지하며(하위호환), imagePullPolicy 는 바꾸지 않으므로
# air-gap 프리로드(IfNotPresent 캐시 hit) 경로도 그대로 성립한다.
imagePullSecrets: []
nodeSelector: {}
tolerations: []
affinity: {}

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# ─────────────────────────────────────────────────────────────────────────────
# uninstall: helm uninstall 한 번으로 설치물을 남김없이 지우기 위한 hook 설정. gate.enabled 가
# 참이면 pre-delete Job 이 먼저 돌아 가속기를 사용 중인 Pod 가 있으면 삭제를 보류하고(이
# 시점엔 아무것도 안 지워진다), 없으면 같은 Job 이 npu.ai CR 과 생성 DaemonSet 을 지운다.
# 자세한 절차는 deploy/helm/README.md 의 "삭제" 절에 있다.
# ─────────────────────────────────────────────────────────────────────────────
uninstall:
  gate:
    enabled: true
    # 사용 중 검사를 건너뛴다. 클러스터 자체를 삭제하는 경로에서만 참으로 둔다 —
    # 그때는 워크로드가 함께 사라지므로 보류할 이유가 없다.
    skipUsageCheck: false
    # CR 하나가 operator finalizer 처리로 사라질 때까지 기다리는 상한. 넘기면
    # finalizer 를 벗겨 지우고 경고를 남긴다.
    timeout: 5m
  # helm 은 crds/ 를 삭제하지 않는다. 참이면 post-delete Job 이 npu.ai CRD 를 지운다.
  # 같은 클러스터에 다시 설치할 예정이면 거짓으로 두어 CRD 를 남길 수 있다.
  purgeCRDs: true
