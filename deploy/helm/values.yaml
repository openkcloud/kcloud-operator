# values.yaml: NPU Operator 기본 설정값
# 생성일: 2026-03-25 | 수정일: 2026-07-20

# ─────────────────────────────────────────────────────────────────────────────
# global.registry: 사설 이미지(operator/detector/device-plugin/driver)의 레지스트리.
#   기본값은 placeholder("<your-registry>") 이므로 그대로 두면 사설 IP 가 노출되지 않음.
#   설치 시 한 줄로 주입:  --set global.registry=<host:port>  또는  -f values-airgap.example.yaml
#   비어있으면("") 사설 이미지는 registry-relative(repo:tag, Docker Hub 기본)로 렌더됨.
#   public device-plugin 이미지(nvcr.io / ghcr.io)는 이 prefix 가 적용되지 않음.
#   (bitnami/kubectl 은 crdUpgrade 블록에서 global.registry 로 미러 조립됨 — airgap 대응)
# ─────────────────────────────────────────────────────────────────────────────
global:
  registry: "<your-registry>"

# operator 이미지: registry 는 global.registry 로 조립됨 (repository 는 registry-relative path).
image:
  repository: kcloud-operator
  tag: v0.5.75
  pullPolicy: IfNotPresent

# acpp: AcceleratorPartitionPolicy 관련 설정.
#   probeImage: verify 단계 1-파티션 테스트 Pod 이미지. air-gap(Harbor mirror) 클러스터는
#   미러 도달 가능 이미지로 지정. 빈 값이면 operator 코드 기본값(registry.k8s.io/pause:3.9) 사용.
acpp:
  probeImage: docker.io/library/nginx:1.25.2-alpine
  # migJobImage: MIG apply/rollback Job 이 host nvidia-smi 를 nsenter 로 호출할 때 쓰는 이미지(util-linux 포함).
  # air-gap 은 Harbor 미러 경로로 지정. 미설정시 코드 기본값(env 미주입)으로 동작하지 않으므로 라이브에선 필수.
  migJobImage: registry.example.com:5000/kcloud/mig-tool:v0.1.0
  # MPS 공유 모드에서 필요한 control daemon. ACPP 가 sharing.mode=mps 일 때만 배치한다
  # (별도 토글 없음 — 정책이 켜면 뜨고 끄면 사라진다).
  # migJobImage 와 같은 규약이다: 빈 값이면 env 가 주입되지 않아 코드 기본값(공개
  # nvcr.io/nvidia/k8s-device-plugin)이 쓰이고, air-gap 클러스터에서는 당길 수 없어 daemon 이
  # ImagePullBackOff 로 남는다. 그래서 기본값을 Harbor 미러 경로로 둔다 — 라이브에선 필수.
  # 경로 규약은 미러된 upstream 이미지와 동일(kcloud/<upstream-org>/<image>). 이 태그가 Harbor 에
  # 실제로 미러돼 있어야 한다 — 없으면 daemon 은 여전히 안 뜨지만, 이제 그 사실이 status 에
  # SharingDaemonNotReady 로 드러난다(Ready 로 위장하지 않는다).
  mpsControlDaemon:
    image: registry.example.com:5000/kcloud/nvidia/k8s-device-plugin:v0.19.3
  # measuredSharing: 이 클러스터에서 **실제로 시험한** 공유 기능을 기록한다. capability status 의
  # verification 축이 required → verified 로 올라간다. 유효값은 "verified" 뿐이고 그 외/미설정은
  # required 다. 코드는 이 값을 스스로 만들지 않는다 — 실측은 하드웨어·드라이버·device-plugin
  # 조합에서 일어난 사건이라 코드가 모든 장치에 대해 주장할 수 없기 때문이다(정직성 §19.3).
  # MPS 지원 여부 자체(supported)는 장치별 MIG 관측이 정하므로 이 값이 뒤집지 못한다 —
  # 검증 축만 올린다. 하드웨어를 교체하면 다시 시험할 때까지 지워야 한다.
  #
  # ⚠ 이 값은 status 표기만 바꾸지 않는다 — **워크로드 승인 게이트**다. AcceleratorWorkload 의
  # 공유 요청은 미검증 축을 거절하므로, 켜는 순간 이 클러스터의 모든 NVIDIA 장치에서 그 거절이
  # 풀린다. implementation:auto 의 후보 선택도 이 축을 읽는다(timeSlicing → multiProcess 순).
  #
  # 두 값의 효과는 대칭이 아니다(실측 확인):
  #  - timeSlicing: MIG-capable 장치의 time-slicing 워크로드 승인을 실제로 연다.
  #    비-MIG 장치(A2 등)는 TimeSlicing 축이 미기입이라 영향 없음.
  #  - multiProcess: auto 후보로는 올라가지만 워크로드는 아직 거절된다 — MPS capability 가
  #    maxReplicas 를 채우지 않아 "maxReplicas is unset" 게이트에 걸린다. 이것만 켜면 auto 가
  #    MPS 를 고른 뒤 거절하므로, 켤 때는 timeSlicing 도 함께 켜는 편이 안전하다.
  #
  # ⚠ 이종 클러스터: 이 값은 클러스터 단위다. A30/A2 를 시험하고 켠 뒤 H100 노드를 추가하면
  # 그 노드는 한 번도 측정되지 않은 채 공유 워크로드를 받는다.
  measuredSharing:
    # multiProcess: "verified"  # MPS 한 GPU 위 CUDA 프로세스 2개 동시 실행 확인 시
    # timeSlicing: "verified"   # time-slicing 배수 광고·할당 확인 시
    multiProcess: ""
    timeSlicing: ""

# fullnameOverride: operator Deployment/SA/RBAC 리소스명(파드 prefix). 릴리스명과 분리.
#   #28(2026-07-20): npu-operator-controller-manager → kcloud-operator-controller (가시성).
#   selector 라벨은 chart/release 이름 기반이라 불변 → immutable selector 함정 없음. 릴리스명(npu-operator) 유지.
fullnameOverride: kcloud-operator-controller

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

metricsService:
  enabled: false
  port: 8443

deployClusterPolicy: true

clusterPolicy:
  name: npuclusterpolicy-sample
  namespace: ""

detector:
  # registry 는 global.registry 로 조립됨 (repository 는 registry-relative path).
  repository: "kcloud-node-manager"
  tag: "0.6.4"
  namespace: "kube-system"

# ─────────────────────────────────────────────────────────────────────────────
# NOTE: 아래 nvidia/furiosa 블록은 NPUClusterPolicy CR의 devicePlugin 설정입니다.
#       드라이버 설치 정책(DriverInstallPolicy CR)은 하단 driverInstallPolicies 블록을
#       사용하세요. 두 블록은 별개의 CRD를 대상으로 합니다.
# ─────────────────────────────────────────────────────────────────────────────
nvidia:
  enabled: true
  devicePluginImage: "nvcr.io/nvidia/k8s-device-plugin:v0.17.1"
  # 자립 셀렉터(node-manager 가 감지 시 부여). NFD/gpu-operator 라벨 비의존.
  nodeSelector:
    kcloud.ai/nvidia.present: "true"
  # GPU 텔레메트리(온도/사용률/메모리/전력) exporter. NPU 4벤더는 node-manager 가
  # hwmon 으로 수집하지만 NVIDIA 드라이버는 hwmon 을 등록하지 않아 NVML 경로가 필요하다.
  # enabled=true 로 켜면 NVIDIA 노드에 upstream dcgm-exporter DS(:9400)가 뜬다.
  dcgmExporter:
    enabled: false
    image: "nvcr.io/nvidia/k8s/dcgm-exporter:4.5.2-4.8.1-ubuntu22.04"

furiosa:
  enabled: true
  devicePluginImage: "ghcr.io/furiosa-ai/k8s-device-plugin:0.10.1"
  configMapName: "npu-device-plugin"
  # 자립 셀렉터(node-manager 가 Warboy 감지 시 부여). NFD/수동 라벨 비의존.
  nodeSelector:
    kcloud.ai/furiosa.present: "true"
  # ─────────────────────────────────────────────────────────────────────
  # Furiosa RNGD device plugin (Phase 1, 2026-04-21)
  # spec.furiosa.rngd 필드 — omitempty 이므로 enabled=false 시 CR에서 생략됨.
  # ─────────────────────────────────────────────────────────────────────
  rngd:
    enabled: true
    # ⚠️ partitionPolicy != "none" 은 operator 가 device-plugin 에 `--policy <값>` 을
    #    전달하므로, 그 flag 를 지원하는 파티션 가능 이미지(`furiosa-device-plugin-mi`)가
    #    반드시 필요하다. 일반 `furiosaai/furiosa-device-plugin` 이미지는 `--policy` 미지원
    #    → CrashLoopBackOff(unknown flag). 아래 기본값은 production(4 instance/card) 재현용.
    # registry 는 global.registry 로 조립됨 (repository 는 registry-relative path).
    devicePluginRepository: "kcloud/furiosa-device-plugin-mi"
    devicePluginTag: "v0.1.0"
    resourceName: "furiosa.ai/rngd"
    # 파티션 정책: "none"(1) / "quad-core"(2) / "dual-core"(4) / "single-core"(8) instance/card.
    # "none" 으로 바꾸면 위 -mi 이미지든 일반 이미지든 동작(--policy 미전달).
    partitionPolicy: "dual-core"
    # 자립 셀렉터(node-manager 가 RNGD 감지 시 부여). 수동/NFD 라벨 비의존.
    nodeSelector:
      kcloud.ai/rngd.present: "true"
  # ─────────────────────────────────────────────────────────────────────
  # Furiosa 통합 device-plugin (S3-8, A' 방안, 2026-07-20)
  # enabled=true 면 Warboy/RNGD 를 위 두 개의 개별 DS 대신 하나의 통합 DS 로 배포.
  # 통합 이미지에 두 벤더 바이너리를 동봉하고 entrypoint 가 PCI(0x1ed2 device ID)로
  # 모델을 감지해 해당 바이너리를 exec 한다(proxy 없음). 리소스명·버전핀 불변.
  # 기본 false = 기존 2-DS 경로(fallback 보존). registry 는 global.registry 로 조립.
  # ─────────────────────────────────────────────────────────────────────
  unified:
    enabled: false
    devicePluginRepository: "kcloud/furiosa-unified-device-plugin"
    devicePluginTag: "0.1.0"

rebellions:
  enabled: true
  # 사설 이미지: registry 는 global.registry 로 조립됨 (repository 는 registry-relative path).
  devicePluginRepository: "rebellions/k8s-device-plugin"
  devicePluginTag: "v0.3.6"
  resourceName: "ATOM"
  resourcePrefix: "rebellions.ai"
  # 2026-04-22: Warboy/RNGD/NVIDIA 와 동일하게 kube-system 으로 통일.
  # 2026-06-02: DS/SA/ConfigMap 이름 prefix 를 `rbln-device-plugin` 으로 변경 (§1 리네임).
  namespace: "kube-system"
  configMapName: "rbln-device-plugin-config"
  # 자립 셀렉터(node-manager 가 감지 시 부여). 수동 라벨 비의존.
  nodeSelector:
    kcloud.ai/rebellions.present: "true"
    kubernetes.io/arch: "amd64"

tenstorrent:
  enabled: true
  # 사설 이미지: registry 는 global.registry 로 조립됨 (repository 는 registry-relative path).
  # Harbor 에 kcloud/tenstorrent/k8s-device-plugin:v0.1.0 로 push 예정.
  devicePluginRepository: "tenstorrent/k8s-device-plugin"
  devicePluginTag: "v0.1.0"
  resourceName: "tenstorrent.com/blackhole"
  # 자립 셀렉터(node-manager 가 Blackhole 감지 시 부여). 수동 라벨 비의존.
  nodeSelector:
    kcloud.ai/tenstorrent.present: "true"

runtimeClass:
  nvidia:
    enabled: true

# ─────────────────────────────────────────────────────────────────────────────
# Admission webhook (S4-1): DIP/NCP validating + opt-in Pod mutating.
# 기본 opt-in(enabled=false) — 라이브 검증 시에만 true 로 전환.
# cert 는 helm lookup 으로 최초 1회만 발급하고 upgrade 마다 재사용(멱등).
# failurePolicy=Ignore: webhook 장애가 클러스터 admission 을 막지 않게(최우선 안전).
# ─────────────────────────────────────────────────────────────────────────────
webhook:
  enabled: false
  # 서버 포트(operator 컨테이너 내부). controller-runtime 기본 9443.
  port: 9443
  failurePolicy: Ignore
  # Pod mutating 대상 opt-in 라벨. 이 라벨이 없는 Pod 는 무개입.
  injectLabel: "kcloud.ai/inject"

# ─────────────────────────────────────────────────────────────────────────────
# 관리 REST API (S5-3-②) + 웹 콘솔(track ③, /ui/): kubeconfig 없는 외부 관리툴/대시보드용 HTTP API.
# operator pod 내 별도 HTTPS listener(:9444). 인증=TokenReview, 인가=SubjectAccessReview.
# 기본 opt-in(enabled=false) — 라이브 검증 시에만 true 로 전환. cert 는 lookup 멱등(upgrade 재수행에도 불변).
# Service kcloud-operator-controller-api(ClusterIP, 443→9444). control 은 전부 CR patch 로 귀결.
# ─────────────────────────────────────────────────────────────────────────────
api:
  # 관리 REST API + 웹 콘솔(/ui/). 활성 시 cert Secret 과 ClusterIP Service 가 생기고
  # operator 가 :9444 HTTPS listener 를 연다. 콘솔은 별도 값 없이 이 하나로 함께 켜진다.
  enabled: false
  # 서버 포트(operator 컨테이너 내부). metrics(:8443)·webhook(:9443)와 겹치지 않게 :9444.
  port: 9444

# ─────────────────────────────────────────────────────────────────────────────
# DriverInstallPolicy CR 자동 생성 설정 (driverInstallPolicies와 nvidia/furiosa 구분)
# ─────────────────────────────────────────────────────────────────────────────
driverInstallPolicies:
  # ─────────────────────────────────────────────────────────────────────
  # Furiosa Warboy (mode=daemonset)
  # 기존 mode=job (`furiosa-warboy`) + tester mode=daemonset (`furiosa-warboy-ds`)
  # 중복을 2026-04-21 에 mode=daemonset 단일 정책으로 통합 (P0-3).
  # 이전 배포와의 충돌 방지를 위해 이름도 `furiosa-warboy-ds` 로 고정.
  # mode=job 으로 회귀가 필요하면 values override 로 enabled=false 후 수동 CR 생성.
  # ─────────────────────────────────────────────────────────────────────
  furiosa:
    enabled: true
    name: furiosa-warboy-ds
    vendor: furiosa
    model: warboy
    rebootStrategy: IfNeeded
    kernelAllowlist: ["5.15.*", "6.8.*"]
    containerdMinVersion: "1.7.0"
    # verifiedVersions: 검증된 driver version 화이트리스트.
    # 비어있으면 버전 검증 skip (backward compat). 추가 시 외 버전은 UnverifiedVersion 상태로 거부.
    verifiedVersions:
      - "1.7.8"
      - "1.9.8-3"
      - "1.9.9-3"
    # Furiosa installer DaemonSet 은 node-manager 가 부여한 자립 셀렉터 노드에만 스케줄.
    # detector 오탐으로 NVIDIA-only 노드에서 Furiosa 가 보고되더라도 nodeSelector 로 2차 차단.
    nodeSelector:
      kcloud.ai/furiosa.present: "true"
    driver:
      # #13 완전 전환: Warboy Mode=job 기본화(privileged driver DS 상주 0). 설치=일회성 install Job,
      # RUN_MODE=job 지원 이미지(-v5) 필요. daemonset 코드 경로는 fallback 보존(회귀 시 mode=daemonset 복귀).
      mode: job
      version: "1.9.8-3"
      # registry 는 global.registry 로 조립됨 (repository 는 registry-relative path).
      repository: "furiosa-driver-ds"
      tag: "1.9.8-3-v5"
      installer: apt
      # 다운그레이드 허용 여부 (false=버전 낮추기 금지, 안전장치)
      allowDowngrade: false
      # 버전 출처: Policy(CR 명세 사용) | Node(노드 자동 감지)
      versionSource: "Policy"
      # Passthrough 모드 노드에서 드라이버 설치 건너뜀
      skipOnPassthrough: true
    upgradePolicy:
      autoUpgrade: true
      drainEnabled: true
      forceUpgrade: false
      maxUnavailable: 1
      maxParallelUpgrades: 1
      drainTimeout: "5m"
      validationTimeout: "10m"
      rollbackOnFailure: true
  # ─────────────────────────────────────────────────────────────────────
  # NVIDIA generic (mode=daemonset)
  # 2026-04-21 에 기본값을 enabled=true 로 전환 (P0-1). image 는 -v16 접미사 필수.
  # ─────────────────────────────────────────────────────────────────────
  nvidia:
    enabled: true
    name: nvidia-gpu-ds
    vendor: nvidia
    model: generic
    rebootStrategy: IfNeeded
    kernelAllowlist: ["5.15.*", "6.8.*"]
    containerdMinVersion: "1.7.0"
    # verifiedVersions: 검증된 driver version 화이트리스트.
    verifiedVersions:
      - "535.288.01"
      - "580.126.09"
      - "580.142"
      - "580.159.03"
      - "595.58.03"
    # 자립 셀렉터(node-manager 부여). 드라이버 install DS/Job + toolkit DS 공용.
    nodeSelector:
      kcloud.ai/nvidia.present: "true"
    driver:
      # #13 완전 전환: NVIDIA Mode=job 기본화(마지막 — kubelet restart 리스크 격리).
      # 런타임 lifecycle 은 상주 toolkit DS 소유(driver=install Job / 런타임=toolkit 분리, #7 경계).
      # v176(a1: v17→v16 위임, MANAGE_CONTAINER_TOOLKIT=false)이 RUN_MODE=job 지원. daemonset fallback 보존.
      mode: job
      # plain 태그 (e.g. 580.126.09) 는 entrypoint 누락된 broken image —
      # idempotent skip + race-safe host module pool 재검사 + 강화된 NVRM regex
      # 가 적용된 -v173 (v17.3) 사용 권장. -v16 (legacy host install) 는 deprecated.
      # default 는 worker1 host 가 보유한 580.159.03 + -v173 (first-try Idle 도달).
      # 2026-06-01: worker1 실설치=580.159.03 고정. 580.142-v173 → 580.159.03-v173 교정
      #             (라이브 무중단 복구, idempotent skip 경로). 상세: docs/05 §4.2.7 알려진 이슈
      version: "580.159.03"
      # registry 는 global.registry 로 조립됨 (repository 는 registry-relative path).
      repository: "nvidia-driver-ds"
      tag: "580.159.03-v179"
      installer: apt
      # 다운그레이드 허용 여부 (false=버전 낮추기 금지, 안전장치)
      allowDowngrade: false
      # 버전 출처: Policy(CR 명세 사용) | Node(노드 자동 감지)
      versionSource: "Policy"
      # Passthrough 모드 노드에서 드라이버 설치 건너뜀
      skipOnPassthrough: true
      env:
        - name: NVIDIA_DRIVER_CHOICE
          value: "recommended"
    toolkit:
      # enabled=true 시 ToolkitDaemonSet reconciler 가 nvidia-container-toolkit DS 를
      # 생성하여 containerd 에 nvidia runtime 을 등록한다(nvidia-ctk, idempotent).
      # ⚠️ containerd 변경은 노드 전체 영향 — 이미 host-managed 로 runtime 이 등록된
      #    노드에서는 no-op. image 미지정 시 코드 기본값(nvcr.io/.../container-toolkit)을
      #    사용하므로, 내부/air-gap 클러스터에서는 아래 image 를 Harbor 미러 경로로 override.
      #
      # ⛔ 기본값 disabled: toolkit DS 가 containerd 를 건드리므로 opt-in 으로만 켠다.
      #    host-managed 로 runtime 이 이미 등록된 클러스터(예: 개발 .91 worker1)나
      #    toolkit 이미지 미러가 없는 air-gap 에서 자동 활성화되면 회귀(ImagePullBackOff)
      #    또는 불필요한 containerd 재시작 위험. runtime 미등록 fresh 노드에서만 true 로.
      enabled: false
      method: apt
      # image: "registry.example.com:5000/kcloud/nvidia/container-toolkit:v1.17.8-ubuntu20.04"
    upgradePolicy:
      autoUpgrade: true
      drainEnabled: true
      forceUpgrade: false
      maxUnavailable: 1
      maxParallelUpgrades: 1
      drainTimeout: "5m"
      validationTimeout: "10m"
      rollbackOnFailure: true
      # S2-5 cross-major reboot: rmmod 불가로 재부팅이 필요한 NVIDIA 메이저 교체(예 535→580) 대응.
      # 미지정 시 CRD 기본값(maxReboots=1, rebootTimeout 15m) 적용. cross-major 는 통상 1회 재부팅이면 충분.
      maxReboots: 1
      rebootTimeout: "15m"
      # driver.rebootExecutor 는 CRD 기본 Job(operator 가 privileged reboot Job 생성). kured 는 1차 미구현.

  # ─────────────────────────────────────────────────────────────────────
  # Furiosa RNGD (mode=daemonset)
  # 2026-04-21 Phase 1 신규 추가. rngd-1 노드 준비 완료이므로 default enabled=true.
  # ─────────────────────────────────────────────────────────────────────
  rngd:
    enabled: true
    name: furiosa-rngd-ds
    vendor: furiosa
    model: rngd
    rebootStrategy: IfNeeded
    kernelAllowlist: ["6.3.*", "6.5.*", "6.8.*"]
    containerdMinVersion: "1.7.0"
    # verifiedVersions: 검증된 driver version 화이트리스트.
    verifiedVersions:
      - "2026.1.0"
    # 자립 셀렉터(node-manager 부여). 수동/NFD 라벨 비의존.
    nodeSelector:
      kcloud.ai/rngd.present: "true"
    driver:
      # #13 완전 전환: RNGD Mode=job 기본화. RUN_MODE=job 지원 이미지(-v1) 필요.
      # daemonset 코드 경로 fallback 보존(회귀 시 mode=daemonset 복귀).
      mode: job
      version: "2026.1.0"
      # registry 는 global.registry 로 조립됨 (repository 는 registry-relative path).
      repository: "furiosa-rngd-driver-installer"
      tag: "2026.1.0-v1"
      installer: apt
      # 다운그레이드 허용 여부 (false=버전 낮추기 금지, 안전장치)
      allowDowngrade: false
      # 버전 출처: Policy(CR 명세 사용) | Node(노드 자동 감지)
      versionSource: "Policy"
      # Passthrough 모드 노드에서 드라이버 설치 건너뜀
      skipOnPassthrough: true
    upgradePolicy:
      autoUpgrade: true
      drainEnabled: true
      rollbackOnFailure: true
      maxUnavailable: 1
      validationTimeout: "10m"

  # ─────────────────────────────────────────────────────────────────────
  # Tenstorrent Blackhole (mode=job, trackOnly) — 2026-07-16 버전관리 편입 (#15 Phase 2)
  # worker3 p150. TT 를 DIP→DUS 버전 관리 체계에 편입한다.
  # ⚠️ trackOnly=true — DUS 추적(버전 관측 + verifiedVersions 게이트)만 수행하고
  #    설치 Job/DaemonSet 은 생성하지 않는다(mode=job 이나 설치 경로 자체가 비활성).
  #    NDR 이 이미 driverVersion 2.8.0 을 보고 중이므로 DUS 는 Idle 로 수렴한다.
  #    tt-kmd 실제 설치(DKMS)는 job 모드 2차(#15 2단계)로 이관.
  # driver.image 는 실존 installer 이미지(kcloud/tenstorrent-driver-ds:0.1.1)를 지정한다.
  #    trackOnly 로 평시엔 pull 되지 않지만, self-heal 엣지에서 Job 이 뜨더라도
  #    ImagePullBackOff 없이 정상 스케줄되도록 실존 태그를 둔다.
  # ─────────────────────────────────────────────────────────────────────
  tenstorrent:
    enabled: true
    name: tenstorrent-blackhole-ds
    vendor: tenstorrent
    model: blackhole-p150
    rebootStrategy: IfNeeded
    kernelAllowlist: ["5.15.*", "6.8.*"]
    containerdMinVersion: "1.7.0"
    # verifiedVersions: 검증된 tt-kmd 버전 화이트리스트.
    verifiedVersions:
      - "2.8.0"
      - "2.9.0"
    # 자립 셀렉터(node-manager 부여). 수동 라벨 비의존.
    nodeSelector:
      kcloud.ai/tenstorrent.present: "true"
    driver:
      mode: job
      # trackOnly=false: 실설치 활성(#26). installer 이미지가 tt-kmd 소스를 baked 하여
      # DKMS 로 빌드/설치(air-gap). RUN_MODE=job → 설치 후 exit 0.
      trackOnly: false
      version: "2.8.0"
      versionSource: "Policy"
      # job모드 실설치 이미지(Harbor kcloud/tenstorrent-driver-ds:0.2.0-kmd<ver>).
      # tag 의 kmd 버전과 version 을 함께 bump 한다(이미지↔버전 1:1 baked).
      repository: "tenstorrent-driver-ds"
      tag: "0.2.0-kmd2.8.0"
      installer: script
      allowDowngrade: false
      skipOnPassthrough: true
    upgradePolicy:
      autoUpgrade: false
      drainEnabled: true
      rollbackOnFailure: true
      maxUnavailable: 1
      validationTimeout: "10m"

rollingUpdate:
  maxUnavailable: 1

# ─────────────────────────────────────────────────────────────────────────────
# crdUpgrade: helm upgrade 시 operator 바이너리의 apply-crds 서브명령으로 CRD를 자동 적용.
# Helm은 설계상 crds/를 install 전용으로 다루므로 upgrade 시 수동 `kubectl apply -f crds/`
# 가 필요한데, 이 옵션으로 Job이 대신 수행하여 절차를 단순화함.
# pre-upgrade Job은 operator 이미지(image.repository:image.tag)를 재사용하므로
# 별도 이미지 미러링이 불필요함.
# 운영 정책상 수동 적용을 선호하거나 Job이 사용할 권한을 부여할 수 없는 환경에서는
# `enabled: false`로 비활성화하고 기존 절차(docs/operator_v1.3.md §3.4) 사용.
# ─────────────────────────────────────────────────────────────────────────────
crdUpgrade:
  enabled: true
  # pre-upgrade cleanup Job(구 이름 DaemonSet 삭제)이 사용하는 kubectl 이미지.
  # 기본 동작: 다른 사설 이미지와 동일하게 global.registry 로 조립됨
  #   - global.registry 설정 시 → <registry>/bitnami/kubectl:1.28 (사설 미러, airgap 정상)
  #   - global.registry 가 비어("") 있으면 → bitnami/kubectl:1.28 (public Docker Hub)
  # kubectlImage 를 명시하면 global.registry 를 무시하고 그 값을 그대로 사용(full override).
  kubectlRepository: bitnami/kubectl
  kubectlTag: "1.28"
  kubectlImage: ""

# Leader election (controller-runtime Lease-based)
leaderElection:
  enabled: true

# Pod placement & runtime tuning
# imagePullSecrets 는 operator Deployment 뿐 아니라 CR(NPUClusterPolicy/DriverInstallPolicy)을
# 통해 컨트롤러가 런타임 생성하는 전 자식 DaemonSet(detector/device-plugin/driver) 및
# 생성 ServiceAccount(kcloud-node-manager/rbln-device-plugin)에도 전파된다. private 레지스트리에서
# `--set imagePullSecrets[0].name=<secret>` 한 줄로 전 파드 pull 이 가능하다.
# 미지정([]) 시 노드레벨(containerd) 인증 경로를 유지한다(하위호환). imagePullPolicy 는
# 변경하지 않으므로 air-gap 프리로드(IfNotPresent 캐시 hit) 경로도 그대로 성립한다.
imagePullSecrets: []
nodeSelector: {}
tolerations: []
affinity: {}

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
