# ============================================================
# values-airgap.example.yaml: airgap/사설 미러 배포 예시 오버라이드
# 상세: 모든 이미지를 단일 사설 미러에서 당기도록 지정하는 방법.
#       사용:  helm install/upgrade <release> kcloud-operator/deploy/helm -f values-airgap.example.yaml
#       <your-registry> 부분을 실제 미러 host:port (예: registry.internal:5000) 로 교체한다.
# 생성일: 2026-06-02 | 수정일: 2026-09-09 (global.vendorRegistry 도입)
# ============================================================

# ─────────────────────────────────────────────────────────────────────────────
# (1) kcloud 가 빌드하는 이미지: global.registry 한 줄로 일괄 prefix.
#     operator / node-manager / host-exec / furiosa-exporter / 드라이버 설치기 3종 /
#     Furiosa 통합 device-plugin / Tenstorrent device-plugin 이 모두
#     <your-registry>/<repo>:<tag> 로 조립된다.
# ─────────────────────────────────────────────────────────────────────────────
global:
  registry: "<your-registry>"   # 예: registry.internal:5000/kcloud

  # ───────────────────────────────────────────────────────────────────────────
  # (2) 벤더(3rd-party) 이미지: global.vendorRegistry 한 줄로 일괄 prefix.
  #     미러에 upstream 의 org 경로를 그대로 살려 올려 둔다:
  #       <your-registry>/nvidia/k8s-device-plugin:v0.19.3
  #       <your-registry>/bitnamilegacy/kubectl:1.28
  #       <your-registry>/dra-driver-nvidia/dra-driver-nvidia-gpu:v0.4.0
  #       <your-registry>/furiosaai/furiosa-device-plugin:2026.1.1
  #       <your-registry>/furiosaai/furiosa-dra-driver:2026.1.1
  #       <your-registry>/rebellions/k8s-device-plugin:v0.3.6
  #     DRA 드라이버 두 개는 해당 기능을 켤 때만 필요하다.
  # ───────────────────────────────────────────────────────────────────────────
  vendorRegistry: "<your-registry>"   # 위와 같은 미러여도 되고 달라도 된다

# ─────────────────────────────────────────────────────────────────────────────
# (3) 전체 경로를 그대로 적는 이미지: 두 레지스트리 어느 쪽도 적용되지 않으므로
#     미러 경로를 직접 명시한다.
# ─────────────────────────────────────────────────────────────────────────────
nvidia:
  devicePluginImage: "<your-registry>/nvidia/k8s-device-plugin:v0.17.1"
  # GPU 텔레메트리 exporter(선택). 켤 경우 이미지도 미러 경로로 지정한다.
  dcgmExporter:
    enabled: false
    image: "<your-registry>/nvidia/dcgm-exporter:4.5.2-4.8.1-ubuntu22.04"

furiosa:
  devicePluginImage: "<your-registry>/furiosa-ai/k8s-device-plugin:0.10.1"

acpp:
  # 파티션 검증 Pod 이미지. 빈 값이면 코드 기본값 registry.k8s.io/pause:3.9 를 쓰는데
  # air-gap 에서는 당길 수 없다.
  probeImage: "<your-registry>/library/nginx:1.25.2-alpine"

driverInstallPolicies:
  nvidia:
    toolkit:
      # containerd 에 nvidia runtime 을 등록하는 DaemonSet. upstream 은
      # nvcr.io/nvidia/k8s/container-toolkit 이다(경로에 k8s/ 가 들어간다).
      enabled: false
      image: "<your-registry>/nvidia/container-toolkit:v1.17.8-ubuntu20.04"
