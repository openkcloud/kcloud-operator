# ============================================================
# values-k8s1.28.yaml: K8s 1.26~1.30 용 배포 프리셋
# 상세: DRA 를 제외한 라인. 1.34 용 이미지를 1.28 에 올리면 resource.k8s.io 부재로
#       acceleratorworkload 컨트롤러가 조용히 기동하지 않는다(실측 2026-08-06).
#       operator 만 -k8s1.28 접미 이미지를 쓰고 나머지는 1.34 프리셋과 동일하다.
# 생성일: 2026-08-06 | 수정일: 2026-08-07
# ============================================================
# global.registry 는 여기서 정하지 않는다 — 기본값이 플레이스홀더인 것은 사설 IP 를
# 저장소에 남기지 않으려는 의도된 설계다(values.yaml:6). 설치 시 반드시 함께 준다:
#   helm install ... -f values-k8sX.YY.yaml --set global.registry=<레지스트리>
# 빠뜨리면 "<your-registry>/..." 가 그대로 나가 InvalidImageName 으로 죽는다(실측 2026-08-06).
image:
  tag: v0.6.1-k8s1.28

# DRA 는 이 라인에 없다. allocationAPI=dra 요청은 번역에서 거절된다.
