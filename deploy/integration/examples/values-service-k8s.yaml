# 상세: 차트 프리셋(values-k8s1.34.yaml) 뒤에 -f 로 붙인다. 벤더 선택은 없다 — operator 가
#       노드 장치를 감지해 있는 벤더만 배치한다. 공개 인터넷이면 아래 두 값도 기본값이라 생략 가능.
