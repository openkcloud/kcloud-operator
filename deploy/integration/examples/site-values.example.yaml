# ============================================================
# site-values.example.yaml: Add-on 이 만들 site-values.yaml 의 본보기
# 상세: 이 파일 자체를 설치에 넘기지 않는다. Add-on 이 이 내용을 복사해 대상 환경에 맞게 고친
#       site-values.yaml 을 만들고, 차트 프리셋(values-k8s1.34.yaml) 뒤에 -f 로 붙인다.
#       벤더 선택은 없다 — operator 가 노드 장치를 감지해 있는 벤더만 배치한다.
#       공개 인터넷이면 아래 두 값이 차트 기본값과 같지만, 파일 자체는 생략하지 않는다.
#       helm 은 -f 로 지정한 파일이 없으면 실패한다.
# 생성일: 2026-09-10 | 수정일: 2026-09-14 (이름을 산출물과 짝이 되게 바꾸고 생성 주체 명시)
# ============================================================
global:
  registry: ghcr.io/openkcloud        # 사내 미러: <harbor>/<프로젝트>
  vendorRegistry: ""                  # 사내 미러: <harbor>/<프로젝트>
# 사내 미러를 쓸 때만 아래 완성 경로 필드도 함께 지정한다(global 값으로 조립되지 않음).
