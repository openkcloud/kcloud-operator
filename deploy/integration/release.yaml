# ============================================================
# release.yaml: Magnum CAPI Add-on 이 kcloud-operator 를 설치할 때 고정하는 상수
# 상세: 차트 주소·버전·Release 이름·namespace·지원 K8s 범위. B(kcloud-magnum-capi-helm)는
#       이 값을 Add-on 설정에 그대로 옮긴다. 버전은 릴리스 태그마다 갱신된다.
# 생성일: 2026-09-10 | 수정일: 2026-10-11
# ============================================================
chart:
  ref: oci://ghcr.io/openkcloud/charts/kcloud-operator
  # addon-provider 는 oci:// 를 받지 못하므로 HTTP 저장소 주소를 따로 둔다. index.yaml 은 위 OCI 차트의 사본이다.
  repo: https://openkcloud.github.io/kcloud-operator
  # 차트 버전은 아래 kubernetesProfiles 의 chartVersion 이 정본이다. 여기에 다시 적지 않는다 —
  # 두 곳에 두면 한쪽만 갱신되는 일이 생긴다.
release:
  name: kcloud-operator
  # kcloud 가 개발한 리소스만 이 네임스페이스에 둔다. 벤더 device-plugin·toolkit·dcgm-exporter 는
  # operator 가 kube-system 에 만든다.
  namespace: kcloud
kubernetesProfiles:
  # Service K8s minor 버전 → 차트 버전과 프리셋. 범위 밖 버전은 설치하지 않는다. valuesURL
  # 은 Add-on 이 설치에 쓰는 주소로 커밋 SHA 에 고정해 내용이 안 바뀐다 — valuesBrowseURL
  # 은 브랜치 주소라 새 커밋이 들어오면 같은 주소가 다른 내용을 돌려주므로 자동화에 쓰지
  # 않는다(helm 의 -f 는 URL 을 받으므로 미리 풀 필요가 없다. Add-on CR 처럼 값을 인라인으로
  # 넣는 방식이면 valuesURL 내용을 그대로 옮긴다). 프리셋을 고칠 때는 먼저 push 하고 그 커밋
  # SHA 로 valuesURL 을 갱신한다 — 차트 버전도 함께 올려 같은 버전이 다른 프리셋과 안 섞이게.
  - range: "1.31-1.34"
    chartVersion: "0.8.0"
    valuesFile: values-k8s1.34.yaml
    valuesURL: https://raw.githubusercontent.com/openkcloud/kcloud-operator/c636694d823c4c7197f8ff23c61038ae8dcbda05/deploy/helm/values-k8s1.34.yaml
    valuesBrowseURL: https://raw.githubusercontent.com/openkcloud/kcloud-operator/main/deploy/helm/values-k8s1.34.yaml
    operatorTag: v0.8.0
  - range: "1.26-1.30"
    chartVersion: "0.6.2"   # DRA 를 뺀 라인
    valuesFile: values-k8s1.28.yaml
    valuesURL: https://raw.githubusercontent.com/openkcloud/kcloud-operator/9397ea30fe494120877d65cb27053a2a3eb09340/deploy/helm/values-k8s1.28.yaml
    valuesBrowseURL: https://raw.githubusercontent.com/openkcloud/kcloud-operator/release/k8s-1.28/deploy/helm/values-k8s1.28.yaml
    operatorTag: v0.6.2-k8s1.28
inputs:
  # Magnum label 은 하나다. 벤더는 operator 가 노드 장치를 감지해 자동 배치한다.
  - name: kcloud_operator_enabled
    values: ["true", "false"]
siteValues:
  # 사이트가 덮어쓸 수 있는 값. 나머지는 프리셋 그대로. helm 은 -f 파일이 없으면 실패하므로
  # 공개망이라 덮어쓸 값이 없어도 Add-on 이 site-values.yaml 을 반드시 만든다(기본 내용은
  # 아래 세 줄, 본보기는 examples/site-values.example.yaml — 그대로 넘기지 않고 복사해 쓴다).
  #   global:
  #     registry: ghcr.io/openkcloud
  #     vendorRegistry: ""
  - key: global.registry
    default: ghcr.io/openkcloud
    note: kcloud 가 빌드한 이미지의 레지스트리
  - key: global.vendorRegistry
    default: ""
    note: 비면 벤더 upstream 직접, 채우면 <미러>/<org>/<image> 규약의 air-gap 미러
helm:
  # 꺾쇠로 적은 값은 Add-on 이 채운다. <chartVersion>·<valuesURL> 은 위 프로파일에서 고르고,
  # <siteValuesFile> 은 Add-on 이 설치 직전에 대상 환경에 맞게 만드는 로컬 파일이다.
  siteValuesFile: site-values.yaml
  install: helm upgrade --install kcloud-operator oci://ghcr.io/openkcloud/charts/kcloud-operator --version <chartVersion> -n kcloud --create-namespace --reset-values -f <valuesURL> -f <siteValuesFile> --wait --wait-for-jobs --timeout 15m
  uninstall: helm uninstall kcloud-operator -n kcloud --wait
  # uninstall 은 pre-delete hook 이 가속기 사용 Pod 를 확인한다. 있으면 실패(보류)하고
  # `kubectl -n kcloud logs job/kcloud-operator-uninstall-gate` 에 Pod 목록이 남는다.
