# ============================================================
# release.yaml: Magnum CAPI Add-on 이 kcloud-operator 를 설치할 때 고정하는 상수
# 상세: 차트 주소·버전·Release 이름·namespace·지원 K8s 범위. B(kcloud-magnum-capi-helm)는
#       이 값을 Add-on 설정에 그대로 옮긴다. 버전은 릴리스 태그마다 갱신된다.
# 생성일: 2026-09-10
# ============================================================
chart:
  ref: oci://ghcr.io/openkcloud/charts/kcloud-operator
  # 1.34 라인. Chart version == operator 이미지 태그(v 접두)와 같다.
  version: "0.7.30"
release:
  name: kcloud-operator
  # kcloud 가 개발한 리소스만 이 네임스페이스에 둔다. 벤더 device-plugin·toolkit·dcgm-exporter 는
  # operator 가 kube-system 에 만든다.
  namespace: kcloud
kubernetesProfiles:
  # Service K8s minor 버전 → 차트 버전과 프리셋. 범위 밖 버전은 설치하지 않는다.
  # 프리셋은 차트 안에 있고 같은 내용이 저장소 태그에서 raw URL 로 열린다. helm 의 -f 는
  # URL 을 받으므로 차트를 미리 풀 필요가 없다(helm pull --untar 불필요). Add-on CR 처럼
  # 값을 인라인으로 넣는 방식이면 valuesURL 의 내용을 그대로 옮긴다.
  - range: "1.31-1.34"
    chartVersion: "0.7.30"
    valuesFile: values-k8s1.34.yaml
    valuesURL: https://raw.githubusercontent.com/openkcloud/kcloud-operator/v0.7.30/deploy/helm/values-k8s1.34.yaml
    operatorTag: v0.7.30
  - range: "1.26-1.30"
    chartVersion: "0.6.2"   # DRA 를 뺀 라인. 2026-09-10 1.28 클러스터에서 검증
    valuesFile: values-k8s1.28.yaml
    valuesURL: https://raw.githubusercontent.com/openkcloud/kcloud-operator/v0.6.2-k8s1.28/deploy/helm/values-k8s1.28.yaml
    operatorTag: v0.6.2-k8s1.28
inputs:
  # Magnum label 은 하나다. 벤더는 operator 가 노드 장치를 감지해 자동 배치한다.
  - name: kcloud_operator_enabled
    values: ["true", "false"]
siteValues:
  # 사이트가 덮어쓸 수 있는 값. 나머지는 프리셋 그대로.
  - key: global.registry
    default: ghcr.io/openkcloud
    note: kcloud 가 빌드한 이미지의 레지스트리
  - key: global.vendorRegistry
    default: ""
    note: 비면 벤더 upstream 직접, 채우면 <미러>/<org>/<image> 규약의 air-gap 미러
helm:
  # <chartVersion>·<valuesURL> 은 위 프로파일에서 고른다.
  install: helm upgrade --install kcloud-operator oci://ghcr.io/openkcloud/charts/kcloud-operator --version <chartVersion> -n kcloud --create-namespace --reset-values -f <valuesURL> -f site-values.yaml --wait --wait-for-jobs --timeout 15m
  uninstall: helm uninstall kcloud-operator -n kcloud --wait
  # uninstall 은 pre-delete hook 이 가속기 사용 Pod 를 확인한다. 있으면 실패(보류)하고
  # `kubectl -n kcloud logs job/kcloud-operator-uninstall-gate` 에 Pod 목록이 남는다.
