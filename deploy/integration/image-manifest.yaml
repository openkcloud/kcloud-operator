  - image: rebellions/rbln-workload
    tag: ubuntu22.04-v1
    digest: ""
    condition: "test/live/rebellions-timeslice MEASURE_MODE=pods 실행 시(내부 빌드, GHCR 미발행). 벤더 SDK 미포함 — node5 hostPath 로 마운트"
vendor:  # global.vendorRegistry 가 비면 아래 upstream 그대로
  - image: nvcr.io/nvidia/k8s-device-plugin
    tag: v0.17.1
    condition: NVIDIA 노드
  - image: nvcr.io/nvidia/k8s/dcgm-exporter
    tag: 4.5.2-4.8.1-ubuntu22.04
    condition: NVIDIA 노드(nvidia.dcgmExporter.enabled)
  - image: nvcr.io/nvidia/k8s/container-toolkit
    tag: v1.17.8-ubuntu20.04
    condition: NVIDIA 노드(driverInstallPolicies.nvidia.toolkit.enabled)
  - image: ghcr.io/furiosa-ai/k8s-device-plugin
    tag: "0.10.1"
    condition: Furiosa Warboy 노드
  - image: docker.io/furiosaai/furiosa-device-plugin
    tag: "2026.1.1"
    condition: Furiosa RNGD 노드
  - image: docker.io/rebellions/k8s-device-plugin
    tag: v0.3.6
    condition: Rebellions ATOM 노드(rebellions.enabled, 광고 주체가 device-plugin 인 기본 구성)
  - image: docker.io/bitnamilegacy/kubectl
    tag: "1.28"
    condition: helm hook Job(CRD 갱신·옛 DS 정리·post-delete CRD 삭제)
  - image: registry.k8s.io/dra-driver-nvidia/dra-driver-nvidia-gpu
    tag: v0.4.0
    condition: NVIDIA 노드(nvidia.dra.enabled)
  - image: docker.io/furiosaai/furiosa-dra-driver
    tag: "2026.1.1"
    condition: Furiosa RNGD 노드(furiosa.rngd.dra.enabled)
  - image: docker.io/rebellions/k8s-dra-driver-npu
    tag: v0.2.0
    condition: Rebellions ATOM 노드(rebellions.dra.enabled)
  - image: ghcr.io/tenstorrent/tt-dra-driver
    tag: "0.0.48"
    condition: Tenstorrent 노드(tenstorrent.dra.enabled)
  - image: ghcr.io/tenstorrent/tt-fabric-manager
    tag: latest
    condition: "Tenstorrent 노드(tenstorrent.dra.enabled, DRA 드라이버와 같은 파드). 벤더가 버전 태그를 내지 않아 latest 다 — 재현이 필요하면 sha 태그를 골라 tenstorrent.dra.fabricManager.tag 를 덮는다"
  - image: docker.io/library/nginx
    tag: 1.25.2-alpine
    condition: ACPP 적용 뒤 검증 파드(acpp.probeImage 기본값)
  - image: docker.io/nvidia/cuda
    tag: 12.9.1-base-ubuntu22.04
    digest: ""
    condition: "acpp.probeImages.nvidia 설정 시(upstream 이미지를 사이트 미러에 두고 쓴다. GHCR 로 발행하지 않는다 — 릴리스 시 갱신). acpp.probeImages.nvidia 는 전체 경로 값(fullPathValues)이라 조립하지 않고 미러 경로를 직접 적는다. 미러 경로 예: <미러>/kcloud/nvidia/cuda:12.9.1-base-ubuntu22.04"
  - image: docker.io/furiosaai/furiosa-smi
    tag: "2026.1.0"
    digest: ""
    condition: "acpp.probeImages.furiosa 설정 시(upstream 이미지를 사이트 미러에 두고 쓴다. GHCR 로 발행하지 않는다 — 릴리스 시 갱신). NEEDS VENDOR RESEARCH: 이 이미지는 libfuriosa_smi.so 만 담고 furiosa-smi CLI 가 없음(2026-09-20 확인) — HostPathBinary 코드 배선 전까지 켜면 probe 가 항상 실패. 미러 경로 예: <미러>/kcloud/furiosaai/furiosa-smi:2026.1.0"
fullPathValues:  # global 값으로 조립되지 않아 미러 시 직접 지정하는 값
  - nvidia.devicePluginImage
  - nvidia.dcgmExporter.image
  - furiosa.devicePluginImage
  - driverInstallPolicies.nvidia.toolkit.image
  - crdUpgrade.kubectlImage
  - acpp.probeImage
  - acpp.probeImages.nvidia
  - acpp.probeImages.tenstorrent
  - acpp.probeImages.furiosa
  - acpp.probeImages.rebellions
aptRepositories:  # 드라이버는 이미지가 아니라 노드가 apt 로 받는다
  - vendor: nvidia
    source: ppa:graphics-drivers/ppa
    auth: none
  - vendor: furiosa-rngd
    source: http://asia-northeast3-apt.pkg.dev/projects/furiosa-ai
    auth: none
    note: furiosa-driver-rngd, furiosa-smi, furiosa-libsmi(exporter 가 호스트에서 읽음)
  - vendor: furiosa-warboy
    source: https://archive.furiosa.ai/ubuntu
    auth: Secret furiosa-apt-auth (namespace kcloud, key furiosa.conf)
  - vendor: tenstorrent
    source: none (tt-kmd 소스가 이미지에 있고 DKMS 로 빌드)
    auth: none
