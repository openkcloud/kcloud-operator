# ============================================================
# rngd-pod.yaml: RNGD 1장을 할당받아 furiosa-smi 로 장치를 확인하는 파드
# 상세: kubectl exec -it rngd-pod -- furiosa-smi info
#       이미지 rngd-smi 는 furiosa-smi 만 담고, 장치는 furiosa-rngd-device-plugin 이 주입한다.
# 생성일: 2026-09-11
# ============================================================
apiVersion: v1
kind: Pod
metadata:
  name: rngd-pod
spec:
  restartPolicy: Never
  containers:
  - name: rngd-pod
    image: <레지스트리>:5100/kcloud/rngd-smi:2026.1.1
    command: ["sleep", "infinity"]
    resources:
      limits:
        cpu: "2"
        memory: "4Gi"
        furiosa.ai/rngd: "1"
      requests:
        cpu: "2"
        memory: "4Gi"
        furiosa.ai/rngd: "1"
