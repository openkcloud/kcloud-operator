# ============================================================
# tt-pod.yaml: Tenstorrent Blackhole 1장을 할당받아 tt-smi 로 장치를 확인하는 파드
# 상세: kubectl exec -it tt-pod -- tt-smi -s   (스냅샷)  /  tt-smi -ls (목록)
#       runtimeClass 불필요. /dev/tenstorrent/N 은 kcloud-tt-device-plugin 이 주입한다.
# 생성일: 2026-09-11
# ============================================================
apiVersion: v1
kind: Pod
metadata:
  name: tt-pod
spec:
  restartPolicy: Never
  containers:
  - name: tt-pod
    image: <레지스트리>:5100/kcloud/tt-smi:latest
    command: ["sleep", "infinity"]
    resources:
      limits:
        cpu: "2"
        memory: "4Gi"
        tenstorrent.com/blackhole: "1"
      requests:
        cpu: "2"
        memory: "4Gi"
        tenstorrent.com/blackhole: "1"
