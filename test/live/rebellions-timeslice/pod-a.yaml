# ============================================================
# pod-a.yaml: co-run 소비자 A — descriptor 가 광고한 rebellions/atom 1개로 /dev/rbln0·/dev/rsd0 를
#             받아 workload.py 를 DEVICE_ID=0 으로 실행(같은 장치를 pod-b 와 동시에 공유)
# 상세: descriptor(rebellions-timeslice)가 광고한 1개를 요청해 ConfigMap(rbln-ts-workload)의
#       workload.py 를 PHASE=corun-a 로 돈다. 이미지·마운트·사전 컴파일 적재 근거는 README 참고.
# 생성일: 2026-09-25 | 수정일: 2026-10-11
# ============================================================
apiVersion: v1
kind: Pod
metadata:
  name: rbln-ts-corun-a
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: node5
  containers:
    - name: c
      image: <레지스트리>:5100/kcloud/rebellions/rbln-workload:ubuntu22.04-v1
      command: ["python3", "/work/workload.py"]
      env:
        - name: PHASE
          value: "corun-a"
        - name: DURATION
          value: "30"
        - name: DEVICE_ID
          value: "0"
        - name: MATMUL_DIM
          value: "2048"
        - name: START_AT
          value: ""          # apply 전에 pod-b 와 같은 epoch 초로 채운다(측정 창 정렬)
        - name: PYTHONPATH
          value: /host-local:/host-lib
        - name: RBLN_NPU_NAME
          value: "RBLN-CA22"
        - name: RBLN_COMPILED_PATH
          value: /models/matmul-2048-RBLN-CA22.rbln
      resources:
        limits:
          rebellions/atom: "1"
      volumeMounts:
        - name: workload
          mountPath: /work
        - name: host-local
          mountPath: /host-local
          readOnly: true
        - name: host-lib
          mountPath: /host-lib
          readOnly: true
        - name: rbln-thunk-so
          mountPath: /usr/lib/librbln-thunk.so.3.0.0
          readOnly: true
        - name: rbln-ccl-so
          mountPath: /usr/lib/librbln-ccl.so.3.0.0
          readOnly: true
        - name: rbln-ml-so
          mountPath: /usr/lib/librbln-ml.so
          readOnly: true
        - name: rbln-stat-bin
          mountPath: /usr/bin/rbln-stat
          readOnly: true
        - name: rbln-smi-bin
          mountPath: /usr/bin/rbln-smi
          readOnly: true
        - name: models
          mountPath: /models
          readOnly: true
  volumes:
    - name: workload
      configMap:
        name: rbln-ts-workload
    - name: host-local
      hostPath:
        path: /usr/local/lib/python3.10/dist-packages
        type: Directory
    - name: host-lib
      hostPath:
        path: /usr/lib/python3/dist-packages
        type: Directory
    - name: rbln-thunk-so
      hostPath:
        path: /usr/lib/librbln-thunk.so.3.0.0
        type: File
    - name: rbln-ccl-so
      hostPath:
        path: /usr/lib/librbln-ccl.so.3.0.0
        type: File
    - name: rbln-ml-so
      hostPath:
        path: /usr/lib/librbln-ml.so
        type: File
    - name: rbln-stat-bin
      hostPath:
        path: /usr/bin/rbln-stat
        type: File
    - name: rbln-smi-bin
      hostPath:
        path: /usr/bin/rbln-smi
        type: File
    - name: models
      hostPath:
        path: /home/kcloud/rbln-ts-cache
        type: Directory
