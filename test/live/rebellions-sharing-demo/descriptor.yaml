# ============================================================
# descriptor.yaml: Rebellions ATOM 을 descriptor 하나로 SW 시분할 광고(node5 유휴 재실측 근거)
# 상세: vendor=rebellions·product=atom 으로 리소스명 rebellions/atom 을 광고하고,
#       sharing timeSliced replicas 2 로 장치 1개를 2개로 광고한다(격리 없는 SW 시분할).
#       deviceNodes 를 /dev/rbln0 하나로 고정해(템플릿 {{id}} 미사용) 두 소비자가 같은
#       장치를 받게 한다. backends=devicePlugin. 생성물 DaemonSet 이름:
#       kcloud-generated-rebellions-atom-share-demo-dp.
#       레지스트리 rebellions timeSlicing 이 Software 여야 컨트롤러(sharingRefusal)가 켠다.
# 생성일: 2026-09-22
# ============================================================
apiVersion: npu.ai/v1alpha1
kind: AcceleratorDescriptor
metadata:
  name: rebellions-atom-share-demo
spec:
  vendor: rebellions
  product: atom
  allocationUnit: device
  identity:
    source: pciAddress
    stableAcrossReboot: true
  deviceNodes:
    - /dev/rbln0
  backends:
    - devicePlugin
  sharing:
    mode: timeSliced
    replicas: 2
