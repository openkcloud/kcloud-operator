# ============================================================
# pod-corun-a.yaml: co-run 처리량 측정 파드 A — 같은 장치를 corun-b 와 동시에 공유
# 상세: descriptor 공유 리소스(tenstorrent/blackhole-p150, 벤더 리소스 아님)를 요청해 시분할
#       경로를 타고, ConfigMap(tt-ts-workload)의 workload.py 를 PHASE=corun-a 로 실행한다.
# 생성일: 2026-09-22 | 수정일: 2026-10-11
# ============================================================
apiVersion: v1
kind: Pod
metadata:
  name: tt-ts-corun-a
  namespace: default
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: k8s-worker3
  securityContext:
    runAsUser: 0
  containers:
    - name: c
      image: <레지스트리>:5100/kcloud/tenstorrent/tt-metalium:v0.58.0-rc4-torch
      command: ["python3", "/work/workload.py"]
      env:
        - name: PHASE
          value: "corun-a"
        - name: DURATION
          value: "60"
        - name: DEVICE_ID
          value: "0"
        - name: MATMUL_DIM
          value: "2048"
      securityContext:
        capabilities:
          add: ["IPC_LOCK"]
      resources:
        limits:
          tenstorrent/blackhole-p150: "1"
          hugepages-1Gi: 1Gi
          memory: 4Gi
          cpu: "2"
        requests:
          hugepages-1Gi: 1Gi
          memory: 2Gi
          cpu: "1"
      volumeMounts:
        - name: hugepage-1g
          mountPath: /dev/hugepages-1G
        - name: workload
          mountPath: /work
  volumes:
    - name: hugepage-1g
      emptyDir:
        medium: HugePages-1Gi
    - name: workload
      configMap:
        name: tt-ts-workload
