# ============================================================
# pod-solo.yaml: solo 처리량 측정 파드 — 장치를 혼자 쓸 때의 기준선(solo1·solo2 재사용)
# 상세: descriptor 가 광고한 tenstorrent/blackhole-p150 1개와 hugepages-1Gi 1개를 요청해
#       k8s-worker3 의 /dev/tenstorrent/0 을 주입받고, ConfigMap(tt-ts-workload)로 마운트된
#       /work/workload.py 를 PHASE=solo 로 실행한다. 벤더 리소스(tenstorrent.com/blackhole)가
#       아니라 descriptor 공유 리소스를 요청해 시분할 경로를 탄다. restartPolicy Never, root 실행.
# 생성일: 2026-09-22
# ============================================================
apiVersion: v1
kind: Pod
metadata:
  name: tt-ts-solo
  namespace: default
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: k8s-worker3
  securityContext:
    runAsUser: 0
  containers:
    - name: c
      image: <레지스트리>:5100/kcloud/tenstorrent/tt-metalium:v0.58.0-rc4-torch
      command: ["python3", "/work/workload.py"]
      env:
        - name: PHASE
          value: "solo"
        - name: DURATION
          value: "60"
        - name: DEVICE_ID
          value: "0"
        - name: MATMUL_DIM
          value: "2048"
      securityContext:
        capabilities:
          add: ["IPC_LOCK"]
      resources:
        limits:
          tenstorrent/blackhole-p150: "1"
          hugepages-1Gi: 1Gi
          memory: 4Gi
          cpu: "2"
        requests:
          hugepages-1Gi: 1Gi
          memory: 2Gi
          cpu: "1"
      volumeMounts:
        - name: hugepage-1g
          mountPath: /dev/hugepages-1G
        - name: workload
          mountPath: /work
  volumes:
    - name: hugepage-1g
      emptyDir:
        medium: HugePages-1Gi
    - name: workload
      configMap:
        name: tt-ts-workload
