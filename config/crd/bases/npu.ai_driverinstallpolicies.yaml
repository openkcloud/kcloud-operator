---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: driverinstallpolicies.npu.ai
spec:
  group: npu.ai
  names:
    kind: DriverInstallPolicy
    listKind: DriverInstallPolicyList
    plural: driverinstallpolicies
    shortNames:
    - dip
    singular: driverinstallpolicy
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DriverInstallPolicy는 노드의 장치 드라이버/툴킷 설치 정책을 정의합니다.
          예) Vendor: "furiosa"/"nvidia", Model: "warboy"/"generic"(또는 GPU 세대명)
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DriverInstallPolicySpec 은 벤더/모델별 드라이버 설치 정책을 담습니다.
            properties:
              driver:
                description: 설치할 드라이버 사양
                properties:
                  allowDowngrade:
                    default: false
                    description: |-
                      AllowDowngrade (b) 는 호스트에 이미 설치된 드라이버가 desired 보다 상위 버전일 때
                      하위 버전으로의 다운그레이드 설치를 허용할지 결정합니다.
                      기본 false = 다운그레이드 금지(기존 상위 버전 유지, 설치 보류). true 여야 하위 버전 설치 허용.
                    type: boolean
                  env:
                    description: (선택) 인스톨러 환경변수
                    items:
                      description: KV는 단순 키-값 환경변수 표현입니다.
                      properties:
                        name:
                          type: string
                        value:
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                  image:
                    description: |-
                      인스톨러 컨테이너 이미지
                      예: "registry.example.com:5000/furiosa-driver-installer:1.7.8" 또는 "ghcr.io/you/nvidia-apt-installer:latest"

                      CRD 는 docker reference 의 syntax 만 검증한다 (tag 부에 invalid char 차단). 의미론적
                      검증 — broken plain tag 가 mode=daemonset 환경에서 entrypoint 누락된 broken image 로
                      작동하는 결함을 차단 (architectural plan §3.4 defense-in-depth) — 은 state_machine 의
                      isVerifiedBuildTag 가드 가 담당한다 (followup plan §F4).

                      허용 (registry/host:port/repo 부 + ":" + tag 부):
                        - registry 부: alphanumerics, `.`, `_`, `:`, `/`, `-` (port 표기 호환)
                        - tag 부:      alphanumerics, `.`, `_`, `+`, `-` (sub-version 예: "580.142-v17.1")
                    pattern: ^[a-zA-Z0-9._:/-]+:[a-zA-Z0-9._+-]+$
                    type: string
                  imageVersionBaked:
                    description: |-
                      ImageVersionBaked 는 이미지에 드라이버 버전이 구워져 있어 태그가 곧 설치 버전인 경우다
                      (예: tenstorrent-driver-ds:2.8.0-v1 — entrypoint 가 baked 버전을 권위로 삼고 DRIVER_VERSION 을
                      무시한다). 참이면 apt/script installer 라도 롤백 대상 이미지를 이전 버전 태그로 재구성한다.
                      거짓(기본)이면 같은 이미지 + DRIVER_VERSION 으로 되돌린다.
                    type: boolean
                  installer:
                    description: |-
                      설치 방식
                      apt  : APT 기반(내/외부 리포지터리 사용)
                      ngc  : NVIDIA NGC 드라이버 컨테이너(커널 매칭 이미지) 사용
                      script : 컨테이너 내 스크립트로 설치(자유도 높음)
                    enum:
                    - apt
                    - ngc
                    - script
                    type: string
                  kernelImageBuildRevision:
                    description: |-
                      KernelImageBuildRevision 은 사전 컴파일 커널 이미지 태그의 빌드 개정(…-vN)이다. 선언하면
                      kernelImages 에 노드 커널 항목이 없어도 태그 규약
                      "<version>[-<kernelImageVariant>]-k<커널>-<빌드 개정>" 으로 이미지 참조를 조립한다 —
                      커널 하나하나를 맵에 적지 않아도 사전 컴파일 경로가 동작한다.
                      비우면(기본) 조립하지 않고 image(DKMS 컴파일)를 쓴다. version 이 비면 태그의 버전 토막을
                      정할 수 없어 조립 자체가 불가능하므로 CEL 이 그 조합을 거절한다.

                      불리언 토글이 아니라 이 값이 조립을 켜는 이유는 빌드 개정을 유도할 수 없기 때문이다. 같은
                      드라이버 버전의 커널 이미지를 다시 구우면 개정만 올라가고, 그 숫자는 발행하는 쪽만 안다
                      (라이브 예: 커널 이미지 …:580.126.09-k5.15.0-171-generic-v4 와 같은 정책의 일반 설치
                      이미지 …:v3 은 서로 다른 개정이다).

                      kernelImages 에 적힌 항목은 조립보다 우선한다 — 규약을 벗어난 이미지의 예외 지정 수단이다.
                      조립한 참조도 kernelImages 값과 같은 검증(검증 빌드 태그·버전 토큰 대조)을 통과해야 쓰인다.
                      조립한 태그가 레지스트리에 없으면 install Job 이 그 이미지를 당기지 못하므로, 발행된 커널
                      집합을 벗어난 노드는 kernelImages 로 따로 지정하거나 이 값을 비워 둔다.
                      mode=job 에서만 유효하다(kernelImages 와 같은 이유 — DaemonSet 하나는 커널별 이미지를 가질 수 없다).
                    pattern: ^v[0-9]+(\.[0-9]+)?$
                    type: string
                  kernelImageVariant:
                    description: |-
                      KernelImageVariant 는 조립할 태그의 variant 토막이다(버전과 커널 토막 사이).
                      벤더 발행 규약에 그 토막이 있을 때만 채운다 — Furiosa 계열은 필수이고
                      (…:<pkgVersion>-rngd-k<커널>-vN), NVIDIA·Tenstorrent 규약에는 그 토막이 없다.
                      벤더 차이를 코드가 아니라 정책으로 받는 이유는 컨트롤러에 벤더 이름 분기를 만들지
                      않기 위해서다. 비우면(기본) "<version>-k<커널>-<빌드 개정>" 을 조립한다.
                      spec.model 을 쓰지 않는 이유는 모든 벤더에 model 이 있고 그 값이 태그에 들어가서는
                      안 되는 벤더가 있기 때문이다.
                      kernelImageBuildRevision 이 비면 아무 효과가 없다. mode=job 에서만 유효하다.
                      첫 문자에서 숫자를 빼는 이유는 버전 토큰 대조다. 조립한 태그에서 버전 토막을 떼는 정규식
                      (internal/upgrade 의 kernelImageVersionRe)은 숫자·점으로 이어진 앞머리를 버전으로 읽으므로,
                      "2x" 같은 값이면 버전 토막이 variant 첫 자까지 삼켜 spec.driver.version 과 달라진다.
                      그러면 조립한 이미지가 거절되고 DKMS 이미지로 조용히 떨어진다.
                    maxLength: 63
                    pattern: ^[a-zA-Z][a-zA-Z0-9._]*$
                    type: string
                  kernelImages:
                    additionalProperties:
                      description: |-
                        KernelImageRef 는 kernelImages 맵의 값이다. image 와 같은 image reference 형식이며, 길이
                        상한은 kernelImages 값 CEL 검증의 비용을 API 서버 예산 안에 들이기 위한 것이다.
                      maxLength: 512
                      type: string
                    description: |-
                      KernelImages 는 노드 커널 버전(node.status.nodeInfo.kernelVersion, 예 "5.15.0-190-generic")마다
                      쓸 사전 컴파일 설치 이미지다. 상태기계가 preflight 에서 노드 커널로 이 맵을 찾고, 없으면
                      image(DKMS 컴파일 이미지)를 쓴다. 값은 image 와 같은 형식이며 검증 빌드 태그(…-vN)여야 한다.
                      mode=job 에서만 유효하다(DaemonSet 하나는 커널별 이미지를 가질 수 없다). 자동 롤백 대상은 전이
                      착수 시 캡처한 이전 버전의 DKMS 태그다(resolvedImage 에서 커널 토큰을 떼고 …-vN 만 남긴 재구성).
                      따라서 사전 컴파일 설치의 롤백은 노드 DKMS 빌드로 되돌아가며 헤더·컴파일러가 필요하다.
                      맵 크기와 값 길이 상한은 kernelImages CEL 검증의 비용을 API 서버 예산 안에 들이기 위한 것이다.
                    maxProperties: 64
                    type: object
                  mode:
                    default: daemonset
                    description: |-
                      Mode는 드라이버 설치 방식을 결정합니다.
                      daemonset: DaemonSet으로 드라이버를 상시 실행 (컨테이너화 드라이버, 검증된 21초 롤링 자산 — 기본값).
                      job:       순간 install Job 으로 설치 후 즉시 종료 (상주 pod 없음). 100% opt-in.
                                 DUS 상태머신이 install Job 의 단일 소유자이며 daemonset 경로 본문은 무변경으로 재사용된다.
                    enum:
                    - daemonset
                    - job
                    type: string
                  skipOnPassthrough:
                    default: true
                    description: |-
                      SkipOnPassthrough (a) 는 노드의 GPU 가 전량 vfio-pci(passthrough)에 바인딩된 경우
                      드라이버 설치를 보류(skip)할지 결정합니다.
                      기본 true = 전량 vfio 노드에서 설치 보류(passthrough 보호). false 면 기존 동작(설치 진행).
                    type: boolean
                  trackOnly:
                    default: false
                    description: |-
                      TrackOnly 는 true 면 DUS 추적(버전 관측 + verifiedVersions 게이트)만 수행하고,
                      설치 경로(driver DaemonSet / install Job)를 생성하지 않습니다. installer 이미지가
                      아직 없는 벤더를 버전 관리 체계에 임시 편입할 때 사용합니다(예: Tenstorrent Blackhole —
                      실제 설치는 tt-kmd DKMS 로 2차). 기본 false = 기존 동작(설치 경로 활성).
                    type: boolean
                  version:
                    description: |-
                      예: "1.7.8" (Furiosa) 또는 "575.64.03"(NVIDIA)
                      비워두면 인스톨러 스크립트가 "권장 버전"으로 자동 선택하도록 구현 가능
                    type: string
                  versionSource:
                    default: Policy
                    description: |-
                      VersionSource (c) 는 effective desired 버전을 어디서 채택할지 결정합니다.
                      Policy : 기존 동작 — spec.driver.version 을 desired 로 사용.
                      Host   : 호스트에 설치된 버전을 desired 로 채택(기존 존중). 호스트 무드라이버면 Policy 버전으로 fallback.
                    enum:
                    - Policy
                    - Host
                    type: string
                required:
                - image
                type: object
                x-kubernetes-validations:
                - message: driver.kernelImages requires driver.mode=job
                  rule: '!has(self.kernelImages) || size(self.kernelImages) == 0 ||
                    self.mode == ''job'''
                - message: driver.kernelImages values must be image references
                  rule: '!has(self.kernelImages) || self.kernelImages.all(k, self.kernelImages[k].matches(''^[a-zA-Z0-9._:/-]+:[a-zA-Z0-9._+-]+$''))'
                - message: driver.kernelImageBuildRevision requires driver.mode=job
                  rule: '!has(self.kernelImageBuildRevision) || size(self.kernelImageBuildRevision)
                    == 0 || self.mode == ''job'''
                - message: driver.kernelImageBuildRevision requires a non-empty driver.version
                  rule: '!has(self.kernelImageBuildRevision) || size(self.kernelImageBuildRevision)
                    == 0 || (has(self.version) && size(self.version) > 0)'
                - message: driver.kernelImageVariant requires driver.mode=job
                  rule: '!has(self.kernelImageVariant) || size(self.kernelImageVariant)
                    == 0 || self.mode == ''job'''
              imagePullSecrets:
                description: |-
                  ImagePullSecrets 는 operator 가 생성하는 driver DaemonSet pod spec 에 부착되는
                  pull secret 목록입니다. helm `imagePullSecrets` 값이 CR 을 통해 전파됩니다.
                  미지정 시 빈 목록 — 노드레벨 인증 경로를 유지하는 하위호환 동작입니다.
                items:
                  description: |-
                    LocalObjectReference contains enough information to let you locate the
                    referenced object inside the same namespace.
                  properties:
                    name:
                      default: ""
                      description: |-
                        Name of the referent.
                        This field is effectively required, but due to backwards compatibility is
                        allowed to be empty. Instances of this type with an empty value here are
                        almost certainly wrong.
                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                      type: string
                  type: object
                  x-kubernetes-map-type: atomic
                type: array
              jobOverrides:
                description: (선택) 잡 템플릿 오버라이드(서비스어카운트, TTL, Backoff 등)
                properties:
                  backoffLimit:
                    description: 실패 재시도 횟수
                    format: int32
                    type: integer
                  priorityClassName:
                    description: (선택) 파드 우선순위 클래스
                    type: string
                  serviceAccountName:
                    description: 서비스어카운트 이름(미지정 시 운영자 기본 SA 사용 또는 빈값)
                    type: string
                  ttlSecondsAfterFinished:
                    description: 완료 후 자동 삭제 TTL(초)
                    format: int32
                    type: integer
                type: object
              kernelAllowlist:
                description: '허용 커널 버전 패턴 (예: ["5.15.*","6.8.*"])'
                items:
                  type: string
                type: array
              model:
                description: |-
                  예: "warboy", "generic" (또는 "a100","a30" 등 필요시 사용)
                  빈 값 허용(벤더만 매칭)하려면 Controller에서 로직으로 지원
                type: string
              nodeSelector:
                additionalProperties:
                  type: string
                description: (선택) 잡/파드에 적용할 노드 셀렉터(특정 노드군에만 설치)
                type: object
              rebootExecutor:
                default: Job
                description: |-
                  RebootExecutor 는 재부팅 실행 방식입니다. Job(기본): operator 가 privileged reboot Job 생성.
                  kured: 노드에 kured sentinel annotation 만 부착(kured 운영 클러스터용, cordon/drain 중복 억제 설정 권장).
                enum:
                - Job
                - kured
                type: string
              rebootStrategy:
                description: 재부팅 전략
                enum:
                - Require
                - IfNeeded
                - Never
                type: string
              toolkit:
                description: (선택) NVIDIA Container Toolkit 등 런타임 툴킷 설치 사양
                properties:
                  enabled:
                    description: 설치 여부
                    type: boolean
                  env:
                    description: (선택) 환경변수
                    items:
                      description: KV는 단순 키-값 환경변수 표현입니다.
                      properties:
                        name:
                          type: string
                        value:
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                  image:
                    description: (선택) 전용 인스톨러 이미지 (미지정 시 Driver.Image 재사용 가능)
                    type: string
                required:
                - enabled
                type: object
              upgradePolicy:
                description: Upgrade policy for driver version changes
                properties:
                  autoUpgrade:
                    description: AutoUpgrade enables automatic upgrade when version
                      mismatch is detected
                    type: boolean
                  drainEnabled:
                    description: DrainEnabled enables cordon+drain before driver upgrade
                      on nodes with active GPU workloads
                    type: boolean
                  drainTimeout:
                    description: DrainTimeout is the maximum duration to wait for
                      node drain to complete (e.g. "5m", "10m")
                    type: string
                  forceUpgrade:
                    description: ForceUpgrade allows drain --force when pods cannot
                      be evicted gracefully
                    type: boolean
                  idleCooldownSeconds:
                    default: 10
                    description: |-
                      IdleCooldownSeconds 는 Idle 진입 후 다음 upgrade 트리거를 받지 않을 최소 기간(초).
                      미지정(nil) 시 default 10s 적용. 0 또는 음수는 cooldown 비활성화 (legacy 동작).
                      rolling-update 테스트에서 연속 trigger 가 mid-state 로 오인되거나 관측되지 않은 채
                      신규 사이클이 시작되는 것을 차단하는 안전장치 (followup plan §F3).
                    format: int32
                    minimum: 0
                    type: integer
                  maxParallelUpgrades:
                    description: MaxParallelUpgrades is the maximum number of nodes
                      being upgraded in parallel
                    format: int32
                    minimum: 1
                    type: integer
                  maxReboots:
                    default: 1
                    description: |-
                      MaxReboots 는 cross-major 드라이버 교체 시 노드 재부팅을 트리거할 최대 횟수입니다.
                      초과 시 Failed 로 전이(무한 재부팅 방지). cross-major 는 통상 1회면 충분. 기본 1.
                    format: int32
                    minimum: 1
                    type: integer
                  maxRollbackAttempts:
                    default: 3
                    description: |-
                      MaxRollbackAttempts는 롤백이 반복 실패할 때 시도할 최대 횟수입니다.
                      이 값을 초과하면 "Failed" 상태로 전이하여 무한 루프를 방지합니다. 기본값 3.
                    format: int32
                    minimum: 1
                    type: integer
                  maxUnavailable:
                    default: 1
                    description: MaxUnavailable is the max number of nodes being upgraded
                      simultaneously
                    format: int32
                    type: integer
                  rebootTimeout:
                    description: RebootTimeout 은 Rebooting 상태에서 노드 Ready 복귀를 대기할 최대
                      시간(e.g. "15m"). 미지정 시 15m.
                    type: string
                  rollbackOnFailure:
                    description: RollbackOnFailure triggers automatic rollback to
                      the previous driver version on upgrade failure
                    type: boolean
                  rollbackTarget:
                    description: |-
                      RollbackTarget 은 롤백 시 어떤 image 로 되돌릴지 결정합니다.
                      previousValidated : 직전 사이클에서 검증된 PreviousImage 가 있을 때만 롤백 (없으면 Failed).
                                          plain tag 치환으로 인한 broken image 회귀 (architectural plan §3.4) 차단.
                      spec              : 현재 동작 — PreviousImage 가 없으면 태그만 치환하여 복구 (legacy, unsafe).
                      비워두면 spec 과 동일하게 처리되어 backward compat 유지. 신규 클러스터는 previousValidated 권장.
                    enum:
                    - previousValidated
                    - spec
                    type: string
                  validationTimeout:
                    description: ValidationTimeout is the maximum duration to wait
                      for driver validation after upgrade (e.g. "2m")
                    type: string
                type: object
              vendor:
                description: |-
                  예: "furiosa", "nvidia"
                  컨트롤러에서 NodeDeviceReport.status.devices[].vendor 와 매칭
                type: string
              verifiedVersions:
                description: |-
                  VerifiedVersions 검증된 driver version 화이트리스트.
                  non-empty 이면 spec.driver.version 이 이 목록에 없을 경우 업그레이드를 거부하고
                  DUS 를 "UnverifiedVersion" 상태로 전이합니다 (NVIDIA GPU Operator validateDriver 동등).
                  비어있으면 버전 검증을 skip 하여 기존 동작을 유지합니다 (backward compat).
                items:
                  type: string
                type: array
              workloadProbe:
                description: |-
                  WorkloadProbe 는 검증 체인의 마지막 단계다. 켜면 드라이버 교체 검증 때 노드마다 장치 1개를 요청하는
                  파드를 하나 띄워 명령을 실행하고 지운다(Succeeded 면 통과). 노드는 그 시점에 cordon 돼 있어 사용자
                  워크로드를 밀어내지 않는다. 기본 꺼짐 — 이미지가 air-gap 미러에 있어야 한다.
                properties:
                  command:
                    description: Command 는 종료 코드 0 이면 통과로 보는 명령이다. 비면 이미지 ENTRYPOINT.
                    items:
                      type: string
                    type: array
                  enabled:
                    type: boolean
                  image:
                    description: |-
                      Image 는 벤더 CLI 가 든 이미지다(예: acpp.probeImages 와 같은 것).
                      필수. 비면 probe 는 파드를 만들지 않고 비통과(벤더 기본 이미지 없음).
                    type: string
                  resourceName:
                    description: |-
                      ResourceName 은 요청할 확장 자원(예: nvidia.com/gpu).
                      필수. 비면 probe 는 파드를 만들지 않고 비통과(벤더 기본 리소스명 없음 —
                      furiosa 는 product 가 있어야 리소스명이 정해진다).
                    type: string
                  timeoutSeconds:
                    description: TimeoutSeconds 는 파드 완료 대기 상한(기본 120).
                    format: int32
                    minimum: 10
                    type: integer
                required:
                - enabled
                type: object
            required:
            - driver
            - vendor
            type: object
        type: object
    served: true
    storage: true
