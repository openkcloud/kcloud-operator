---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: acceleratorhealths.npu.ai
spec:
  group: npu.ai
  names:
    kind: AcceleratorHealth
    listKind: AcceleratorHealthList
    plural: acceleratorhealths
    shortNames:
    - ah
    singular: acceleratorhealth
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.state
      name: STATE
      type: string
    - jsonPath: .status.allocationAllowed
      name: ALLOC
      type: boolean
    - jsonPath: .status.reason
      name: REASON
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AcceleratorHealth 는 노드 하나의 health 상태다.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AcceleratorHealthSpec 은 관측 대상이다.
            properties:
              nodeName:
                type: string
            required:
            - nodeName
            type: object
          status:
            description: AcceleratorHealthStatus 는 판정 결과다.
            properties:
              allocationAllowed:
                description: AllocationAllowed 가 false 면 배치 판정이 이 노드를 후보에서 뺀다.
                type: boolean
              detectedAt:
                description: DetectedAt 은 현재 상태로 바뀐 시각이다(같은 상태가 이어지면 갱신하지 않는다).
                format: date-time
                type: string
              devices:
                description: Devices 는 장치별 판정이다(장치 단위 신호가 없으면 비어 있다).
                items:
                  description: |-
                    DeviceHealth 는 장치 하나의 판정 결과다. 노드 단위 상태가 답하지 못하는
                    "어느 장치가 문제인가" 를 운영자가 status 만 보고 알 수 있게 한다.
                  properties:
                    pciAddress:
                      type: string
                    reason:
                      type: string
                    state:
                      type: string
                  required:
                  - pciAddress
                  type: object
                type: array
              reason:
                type: string
              recoveryFailures:
                description: RecoveryFailures 는 종점 실패로 끝난 복구 작업 수다(격리 임계의 입력).
                format: int32
                type: integer
              recoveryOperationRef:
                description: RecoveryOperationRef 는 이 상태 때문에 만든 복구 작업 이름이다.
                type: string
              signals:
                items:
                  description: HealthSignal 은 신호 하나의 관측 기록이다.
                  properties:
                    message:
                      type: string
                    name:
                      type: string
                    ok:
                      type: boolean
                    target:
                      description: |-
                        Target 은 장치 단위 신호일 때의 PCI 다. 노드 단위 신호면 비어 있다 —
                        장치 단위 health 로 넓힐 때의 이행 경로다.
                      type: string
                  required:
                  - name
                  - ok
                  type: object
                type: array
              state:
                enum:
                - Unknown
                - Healthy
                - Degraded
                - Unhealthy
                - Quarantined
                - Recovering
                type: string
              suspectedAt:
                description: |-
                  SuspectedAt 은 광고 불일치를 처음 본 시각이다. 유예 계산이 이 값을 쓴다 —
                  condition 의 전이 시각에 얹으면 재검증 pass 가 매번 지워 유예가 영영 안 찬다(Stage 1 D-7).
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
