---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: nodedevicereports.npu.ai
spec:
  group: npu.ai
  names:
    kind: NodeDeviceReport
    listKind: NodeDeviceReportList
    plural: nodedevicereports
    shortNames:
    - ndr
    singular: nodedevicereport
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              nodeName:
                description: 이 리포트가 속하는 노드 이름 (immutable 권장)
                type: string
            required:
            - nodeName
            type: object
          status:
            properties:
              conditions:
                items:
                  properties:
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  type: object
                type: array
              devices:
                items:
                  properties:
                    computeCapability:
                      type: string
                    count:
                      format: int32
                      type: integer
                    driverBinding:
                      description: |-
                        DriverBinding 은 해당 장치의 PCI 커널 드라이버 바인딩 상태입니다.
                        "nvidia"=드라이버 바인딩, "vfio-pci"=passthrough 바인딩, "none"=미바인딩(free). (a) passthrough 감지용.
                      type: string
                    driverLoaded:
                      type: boolean
                    driverVersion:
                      type: string
                    driverVersionDetail:
                      type: string
                    firmwareVersion:
                      type: string
                    memoryMiB:
                      description: GFD(S3-3) 소스 필드 — node-agent 가 스캔 시 sysfs/PCI 에서
                        best-effort 추출합니다(미가용 시 공란).
                      format: int64
                      type: integer
                    model:
                      type: string
                    needsReboot:
                      type: boolean
                    pcieAddress:
                      type: string
                    vendor:
                      type: string
                  type: object
                type: array
              passthroughReserved:
                description: |-
                  PassthroughReserved 는 노드에 GPU 가 존재하며 전량 vfio-pci(passthrough)에 바인딩된 경우 true 입니다.
                  (a) 관리자가 passthrough 예약 노드를 식별하고 드라이버 설치 보류 판단을 보조합니다.
                type: boolean
              validation:
                description: Validation 은 node-agent 가 상시/정기 실행하는 벤더별 검증 결과입니다(S2-3).
                properties:
                  lastRunTime:
                    description: LastRunTime 은 마지막 검증 시각입니다(node-agent 가 RFC3339 로
                      기록).
                    format: date-time
                    type: string
                  passed:
                    description: Passed 는 게이트 step 전부 통과 여부입니다(AC-1).
                    type: boolean
                  steps:
                    description: 'Steps 는 step 별 결과입니다(AC-3: 실패 step 식별).'
                    items:
                      description: ValidationStep 은 S2-3 5단계 각각의 결과입니다.
                      properties:
                        message:
                          description: Message 는 실패/보조 사유입니다(운영자 디버깅).
                          type: string
                        name:
                          description: |-
                            Name 은 step 이름입니다("driverModule"|"deviceNode"|"devicePlugin"|"runtime"|"sampleWorkload").
                            멀티벤더 노드는 "<vendor>/<step>" 접두사가 붙습니다.
                          type: string
                        passed:
                          description: Passed 는 해당 step 통과 여부입니다.
                          type: boolean
                      required:
                      - name
                      - passed
                      type: object
                    type: array
                  vendor:
                    description: Vendor 는 검증 대상 벤더입니다(멀티벤더 노드는 콤마 구분).
                    type: string
                required:
                - passed
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
