---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: npuclusterpolicies.npu.ai
spec:
  group: npu.ai
  names:
    kind: NPUClusterPolicy
    listKind: NPUClusterPolicyList
    plural: npuclusterpolicies
    singular: npuclusterpolicy
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: NPUClusterPolicy is the Schema for the npuclusterpolicies API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NPUClusterPolicySpec defines the desired state of NPUClusterPolicy.
            properties:
              detector:
                description: |-
                  INSERT ADDITIONAL SPEC FIELDS - desired state of cluster
                  Important: Run "make" to regenerate code after modifying this file
                properties:
                  image:
                    type: string
                type: object
              furiosa:
                properties:
                  configMapName:
                    type: string
                  devicePluginImage:
                    type: string
                  enabled:
                    type: boolean
                  nodeSelector:
                    additionalProperties:
                      type: string
                    type: object
                  rngd:
                    description: |-
                      RngdSpec defines the RNGD-specific (Furiosa RNGD NPU) device plugin configuration.
                      Backward-compatible: all fields are omitempty; omit the whole block to keep legacy behavior.
                    properties:
                      configMapName:
                        type: string
                      devicePluginImage:
                        type: string
                      enabled:
                        type: boolean
                      nodeSelector:
                        additionalProperties:
                          type: string
                        type: object
                      partitionPolicy:
                        description: |-
                          PartitionPolicy: "none" (default, 1 instance/card), "single-core" (8), "dual-core" (4), "quad-core" (2).
                          Furiosa libfuriosa-kubernetes PartitioningPolicy 와 1:1 매핑.
                        enum:
                        - none
                        - single-core
                        - dual-core
                        - quad-core
                        type: string
                      resourceName:
                        type: string
                    type: object
                  unified:
                    description: |-
                      Unified: true 면 Warboy/RNGD 를 두 개의 개별 DaemonSet 대신 하나의 통합 DaemonSet 으로
                      배포한다(A' 방안 — 동봉 바이너리 + PCI 감지 exec). 기본 false = 기존 2-DS 경로(fallback).
                      통합 DS 는 자립 라벨(kcloud.ai/furiosa-family.present, node-manager 부여)로 양 노드에 스케줄되며,
                      리소스명(beta.furiosa.ai/npu / furiosa.ai/rngd)은 각 바이너리가 광고하므로 불변.
                    type: boolean
                  unifiedDevicePluginImage:
                    description: 'UnifiedDevicePluginImage: 통합 DS 가 사용할 동봉 이미지. Unified=true
                      일 때만 사용.'
                    type: string
                required:
                - devicePluginImage
                - enabled
                type: object
              imagePullSecrets:
                description: |-
                  ImagePullSecrets 는 operator 가 런타임 생성하는 모든 자식 DaemonSet
                  (detector/device-plugin) pod spec 및 생성 ServiceAccount 에 부착되는
                  pull secret 목록입니다. helm `imagePullSecrets` 값이 CR 을 통해 전파됩니다.
                  미지정 시 빈 목록 — 노드레벨(containerd) 인증 경로를 유지하는 하위호환 동작입니다.
                items:
                  description: |-
                    LocalObjectReference contains enough information to let you locate the
                    referenced object inside the same namespace.
                  properties:
                    name:
                      default: ""
                      description: |-
                        Name of the referent.
                        This field is effectively required, but due to backwards compatibility is
                        allowed to be empty. Instances of this type with an empty value here are
                        almost certainly wrong.
                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                      type: string
                  type: object
                  x-kubernetes-map-type: atomic
                type: array
              nvidia:
                properties:
                  dcgmExporter:
                    description: |-
                      DcgmExporter 는 NVIDIA GPU 텔레메트리(온도/사용률/메모리/전력) exporter 설정이다.
                      NPU 4벤더는 node-manager 가 hwmon 으로 수집하지만 NVIDIA 드라이버는 hwmon 을 등록하지
                      않아 NVML 경로가 필요하므로, upstream dcgm-exporter 를 operand 로 배포한다.
                      미지정(nil) 또는 Enabled=false 면 DS 를 만들지 않고 기존 것이 있으면 제거한다.
                    properties:
                      enabled:
                        description: Enabled=false(기본) 면 배포하지 않는다.
                        type: boolean
                      image:
                        description: Image 미지정 시 nvcr.io upstream 기본값을 사용한다(air-gap
                          환경은 미러 경로를 지정).
                        type: string
                    type: object
                  devicePluginImage:
                    type: string
                  enabled:
                    type: boolean
                  nodeSelector:
                    additionalProperties:
                      type: string
                    type: object
                required:
                - devicePluginImage
                - enabled
                type: object
              rebellions:
                description: |-
                  RebellionsSpec defines the Rebellions ATOM+ device plugin configuration.
                  Backward-compatible: all fields are omitempty; omit the whole block to keep legacy behavior.
                properties:
                  configMapName:
                    type: string
                  devicePluginImage:
                    type: string
                  enabled:
                    type: boolean
                  namespace:
                    type: string
                  nodeSelector:
                    additionalProperties:
                      type: string
                    type: object
                  resourceName:
                    type: string
                  resourcePrefix:
                    type: string
                required:
                - devicePluginImage
                type: object
              tenstorrent:
                description: |-
                  TenstorrentSpec defines the Tenstorrent Blackhole NPU device plugin configuration.
                  Backward-compatible: all fields are omitempty; omit the whole block to keep legacy behavior.
                properties:
                  devicePluginImage:
                    type: string
                  enabled:
                    type: boolean
                  nodeSelector:
                    additionalProperties:
                      type: string
                    type: object
                  resourceName:
                    type: string
                type: object
            required:
            - furiosa
            - nvidia
            type: object
          status:
            description: NPUClusterPolicyStatus defines the observed state of NPUClusterPolicy.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              phase:
                type: string
            type: object
        type: object
