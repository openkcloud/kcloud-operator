# ============================================================
# .golangci.yml: cmd/kubectl-npu 전용 lint 설정
# 상세: 루트 .golangci.yml 과 같은 린터 목록을 쓰되 goconst 만 뺀다 — 이 CLI 는
#       dispatch switch 마다 명령·플래그 이름을 그 자리 리터럴로 쓰는 게 읽기 쉬운
#       관례다("status"·"--vendor" 등). goconst 는 이 리터럴들을 상수로 빼라고
#       반복 지적하는데, 그러면 호출부가 상수 정의를 오가며 읽어야 해 dispatch 코드가
#       오히려 읽기 어려워진다. 이 파일이 없으면 golangci-lint 가 상위 디렉터리의
#       루트 설정을 그대로 찾아 써 이 모듈의 goconst 경고가 묻혀 보이지 않았다.
# 생성일: 2026-09-28 | 수정일: 2026-09-28
# ============================================================
version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
