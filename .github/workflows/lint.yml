# lint.yml: push·PR 시 golangci-lint 와 footprint 회귀 게이트를 돈다.
# 상세: CRD embed 번들을 먼저 만들어야 golangci-lint 타입체크가 fresh clone 에서도 통과한다.
#       footprint-check 는 kcloud 차트 정적 렌더 결과를 test/footprint/baseline.json 과
#       대조한다. 클러스터가 없어 static 모드만 돈다.
#       image-tag-check 는 release 태그(v*) push 에만 돈다 — 차트는 발행 전에 다음
#       태그를 먼저 적으므로 평시엔 "아직 미발행" 이 정답이라 매 push·PR 마다 돌리면
#       상시 빨강(신호 없음)이 된다. release.yml 도 같은 push 로 도므로(그 파일 머리말
#       참고) v* 태그 push 순간엔 실제로 돈다. CHECK_REGISTRY=1 로 직접 켠다 —
#       helm·PyYAML 이 footprint-check 단계에서 이미 설치돼 추가 설치가 없다. test.yml 은
#       make test 만 돌려 이 검사를 포함하지 않는다.
# 생성일: 2025-07-04 | 수정일: 2026-10-05 (docs 경로 인용 실재 게이트 추가)
name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # internal/crdapply/crd/*.yaml is a generated (gitignored) embed bundle.
      # Populate it from the committed config/crd/bases so `//go:embed crd/*.yaml`
      # has matching files; otherwise golangci-lint typecheck fails on a fresh clone.
      - name: Generate CRD embed bundle
        run: make embed-crds

      - name: Verify CRD kustomization list
        run: make crd-check

      # 주석·values·워크플로가 가리키는 docs/*.md 가 이 트리에 없으면 실패한다. 없는 문서를
      # 가리키는 주석은 읽는 사람을 빈 경로로 보낸다. 스크립트 자가시험이 먼저 돈다.
      - name: Doc citation existence gate
        run: make doc-cite-check

      - name: Run linter
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.0

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Install jq and PyYAML
        run: sudo apt-get update -y && sudo apt-get install -y jq python3-yaml

      # kcloud 차트 정적 렌더의 상주 operand(Deployment+DaemonSet+StatefulSet) 수가
      # baseline 을 넘으면 실패한다(test/footprint/baseline.json).
      - name: Footprint regression gate
        run: make footprint-check

      # 차트 기본값이 당기는 이미지 태그가 레지스트리에 실재하는지 확인한다. 기본은
      # 꺼져 있는 검사라 CHECK_REGISTRY=1 로 직접 켠다. release 태그(v*) push 에만 —
      # 평시 push·PR 은 "다음 태그가 아직 미발행" 이 정상 상태라 늘 빨강이 된다.
      - name: Image tag existence gate
        if: startsWith(github.ref, 'refs/tags/v')
        run: make image-tag-check
        env:
          CHECK_REGISTRY: "1"
