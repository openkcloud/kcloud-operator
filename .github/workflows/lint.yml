# lint.yml: push·PR 시 golangci-lint 와 주석·문서·설정 검증 게이트들을 돈다.
# 상세: CRD embed 번들을 먼저 만들어야 golangci-lint 타입체크가 fresh clone 에서도 통과한다.
# 생성일: 2025-07-04 | 수정일: 2026-10-11
name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # internal/crdapply/crd/*.yaml is a generated (gitignored) embed bundle.
      # Populate it from the committed config/crd/bases so `//go:embed crd/*.yaml`
      # has matching files; otherwise golangci-lint typecheck fails on a fresh clone.
      - name: Generate CRD embed bundle
        run: make embed-crds

      - name: Verify CRD kustomization list
        run: make crd-check

      # 주석·values·워크플로가 가리키는 docs/*.md 가 이 트리에 없으면 실패한다. 없는 문서를
      # 가리키는 주석은 읽는 사람을 빈 경로로 보낸다. 스크립트 자가시험이 먼저 돈다.
      - name: Doc citation existence gate
        run: make doc-cite-check

      # docs/ 는 공개 저장소에 없는 형제 경로다 — 코드·차트·스크립트가 그 경로를 가리키면
      # 공개 빌드에서 깨진다.
      - name: Sibling docs path gate
        run: make docs-path-check

      # 추적 파일에 사내 내부 주소·계정이 들어가면 공개 릴리스로 새어나간다.
      - name: Private address gate
        run: make private-ip-check

      # 계획 디렉터리는 .gitignore 로 막혀 커밋되지 않는다 — 추적 파일이 그
      # 경로나 task-N 보고서 파일명을 인용하면 받는 사람은 열 수 없는 경로를 안내받는다.
      - name: Workspace citation gate
        run: make workspace-cite-check

      - name: Comment narrative gate
        run: make comment-check

      - name: Linter config verify
        run: make lint-config

      - name: Run linter
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.0

      # cmd/kubectl-npu 는 별도 go.mod 라 위 단계가 내려가지 않는다 — 이 단계가 없으면
      # make lint 가 로컬에서 도는 두 모듈 중 하나가 CI 린트를 받지 않는다. version 은 위 단계와 같게.
      - name: Run linter (kubectl-npu plugin module)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.0
          working-directory: cmd/kubectl-npu

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Install jq and PyYAML
        run: sudo apt-get update -y && sudo apt-get install -y jq python3-yaml

      # kcloud 차트 정적 렌더의 상주 operand(Deployment+DaemonSet+StatefulSet) 수가
      # baseline 을 넘으면 실패한다(test/footprint/baseline.json).
      - name: Footprint regression gate
        run: make footprint-check

      # 차트 기본값이 당기는 이미지 태그가 레지스트리에 실재하는지 확인한다. 기본은
      # 꺼져 있는 검사라 CHECK_REGISTRY=1 로 직접 켠다. release 태그(v*) push 에만 —
      # 평시 push·PR 은 "다음 태그가 아직 미발행" 이 정상 상태라 늘 빨강이 된다.
      - name: Image tag existence gate
        if: startsWith(github.ref, 'refs/tags/v')
        run: make image-tag-check
        env:
          CHECK_REGISTRY: "1"
