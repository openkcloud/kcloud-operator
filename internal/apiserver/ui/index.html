<!-- index.html: kcloud accelerator console — 관리 REST API(:9444) 단일 파일 대시보드 | 생성일: 2026-07-30 | 수정일: 2026-08-12 -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kcloud accelerator console</title>
<style>
/* 색·간격 토큰. 관찰 콘솔(tester/api-demo)과 같은 팔레트를 쓴다 — 두 화면을 나란히 놓고
   보는 사람에게 같은 제품으로 읽혀야 한다. 옛 이름(--bg/--fg/--line/--card/--accent)은
   본문 곳곳의 인라인 style 이 참조하므로 지우지 않고 새 값으로 잇는다. */
:root {
  --canvas:#ffffff; --surface-soft:#f8fafc; --surface-strong:#e0e2e6;
  --ink:#181d26; --body:#333840; --muted:#41454d; --hairline:#dddddd; --border-strong:#9297a0;
  --primary:#181d26; --primary-active:#0d1218; --on-primary:#ffffff;
  --coral:#aa2d00; --mustard:#d9a441; --info:#254fad; --info-border:#458fff; --success:#006400;
  --bg:var(--canvas); --fg:var(--ink); --line:var(--hairline); --card:var(--surface-soft);
  --accent:var(--primary); --ok:var(--success); --warn:#8a5a00; --bad:var(--coral);
  --r-sm:6px; --r-md:10px;
  --font:"Inter Display",-apple-system,BlinkMacSystemFont,"Segoe UI","Pretendard","Noto Sans KR","Apple SD Gothic Neo",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
/* OS 추종. 아래 [data-theme] 오버라이드보다 앞에 두어 강제 선택이 이긴다.
   변수 목록은 :root[data-theme="dark"] 와 같아야 한다 — 하나라도 빠지면 그 색만 밝은 값이
   남아 대비가 깨진다. */
@media (prefers-color-scheme: dark) {
  :root {
    --canvas:#181d26; --surface-soft:#1d1f25; --surface-strong:#2a2f39;
    --ink:#ffffff; --body:#e0e2e6; --muted:#9297a0; --hairline:#333840; --border-strong:#4a515e;
    --primary:#ffffff; --primary-active:#e0e2e6; --on-primary:#181d26;
    --coral:#ff7043; --mustard:#f4d35e; --info:#5b8def; --info-border:#5b8def; --success:#4cc95a;
    --warn:#f4d35e;
  }
}
:root[data-theme="dark"] {
  --canvas:#181d26; --surface-soft:#1d1f25; --surface-strong:#2a2f39;
  --ink:#ffffff; --body:#e0e2e6; --muted:#9297a0; --hairline:#333840; --border-strong:#4a515e;
  --primary:#ffffff; --primary-active:#e0e2e6; --on-primary:#181d26;
  --coral:#ff7043; --mustard:#f4d35e; --info:#5b8def; --info-border:#5b8def; --success:#4cc95a;
  --warn:#f4d35e;
}
:root[data-theme="light"] {
  --canvas:#ffffff; --surface-soft:#f8fafc; --surface-strong:#e0e2e6;
  --ink:#181d26; --body:#333840; --muted:#41454d; --hairline:#dddddd; --border-strong:#9297a0;
  --primary:#181d26; --primary-active:#0d1218; --on-primary:#ffffff;
  --coral:#aa2d00; --mustard:#d9a441; --info:#254fad; --info-border:#458fff; --success:#006400;
  --warn:#8a5a00;
}
* { box-sizing:border-box; }
/* 스크롤바 자리를 늘 비워 둔다 — 탭을 옮길 때 본문이 스크롤바 폭만큼 밀리지 않는다. */
html { scrollbar-gutter:stable; }
body { margin:0; background:var(--canvas); color:var(--body);
       font:14px/1.5 var(--font); -webkit-font-smoothing:antialiased; }

/* 좌측 내비 — 화면이 열이라 상단에 늘어놓으면 지금 어디에 있는지가 안 보인다.
   묶음(자원·정책·관찰)을 세워 두면 보고 있는 것이 어느 축인지 남는다. */
.app-shell { display:grid; grid-template-columns:216px 1fr; min-height:100vh; }
.app-side { border-right:1px solid var(--hairline); background:var(--surface-soft);
            padding:16px 0; position:sticky; top:0; height:100vh; overflow-y:auto;
            display:flex; flex-direction:column; }
.side-brand { display:flex; align-items:center; gap:8px; padding:0 18px 14px;
              font-size:15px; font-weight:600; color:var(--ink); }
.brand-dot { width:12px; height:12px; border-radius:9999px; background:var(--coral); }
.side-group { color:var(--muted); font-size:12px; font-weight:600; padding:14px 18px 6px; }
.side-foot { margin-top:auto; padding:14px 18px 0; font-size:12px; color:var(--muted);
             border-top:1px solid var(--hairline); }
.app-main { min-width:0; }

header { display:flex; gap:10px; align-items:center; flex-wrap:wrap; min-height:60px;
         padding:12px 24px; background:var(--canvas); border-bottom:1px solid var(--hairline);
         position:sticky; top:0; z-index:9; }
header input, header select, header button { height:32px; font-size:13px; border-radius:var(--r-sm); }
h1 { font-size:16px; margin:0; font-weight:500; color:var(--ink); }
input[type=password], input[type=text] { padding:6px 10px; border:1px solid var(--hairline);
         border-radius:var(--r-sm); background:var(--canvas); color:var(--ink); min-width:260px; }
input:focus, select:focus { outline:none; border-color:var(--info-border); }
/* select 에 규칙이 없으면 브라우저 기본색(밝게)이 남아 어두운 테마에서 이 칸만 하얗다. */
select { padding:6px 10px; border:1px solid var(--hairline); border-radius:var(--r-sm);
         background:var(--canvas); color:var(--ink); font:inherit; }
button { padding:0 14px; border:1px solid var(--primary); border-radius:var(--r-sm); cursor:pointer;
         background:var(--primary); color:var(--on-primary); font:inherit; font-weight:500; }
button:active { background:var(--primary-active); border-color:var(--primary-active); }
button.ghost { background:var(--canvas); color:var(--ink); border-color:var(--hairline); }

/* 내비 항목은 버튼이지만 조작 버튼과 같게 그리면 안 된다 — 열 개가 검은 덩어리로 보인다. */
nav { display:flex; flex-direction:column; }
nav button { background:transparent; color:var(--body); border:0; border-left:3px solid transparent;
             border-radius:0; text-align:left; padding:8px 18px 8px 26px; font-size:13px;
             font-weight:400; height:auto; }
nav button:hover { background:var(--surface-strong); }
nav button[aria-current=page] { background:var(--surface-strong); color:var(--ink);
             font-weight:600; border-left-color:var(--coral); }

main { padding:24px; max-width:1600px; }
section { display:none; } section.active { display:block; }

/* 표 — 머리줄에 바탕을 깔고 가로 넘침은 표 안에서만 흐르게 한다. */
table { border-collapse:collapse; width:100%; margin:0 0 20px; font-size:13px;
        border:1px solid var(--hairline); border-radius:var(--r-md); overflow:hidden; }
th, td { text-align:left; padding:9px 12px; border-bottom:1px solid var(--hairline); vertical-align:top; }
th { color:var(--ink); font-weight:500; font-size:12px; white-space:nowrap; background:var(--surface-soft); }
td { color:var(--body); }
tbody tr:last-child td { border-bottom:0; }

.cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
         gap:12px; margin-bottom:24px; }
.card { border:1px solid var(--hairline); border-radius:var(--r-md); padding:14px 16px;
        background:var(--canvas); }
.card b { display:block; font-size:24px; font-weight:600; color:var(--ink); line-height:1.2;
          font-variant-numeric:tabular-nums; }
.card span { color:var(--muted); font-size:12px; }

/* 배지 — 테두리만 있는 알약은 어두운 테마에서 묻힌다. 옅은 바탕을 깔아 등급이 먼저 보이게. */
.badge { display:inline-block; padding:2px 8px; border-radius:var(--r-sm); font-size:12px;
         font-weight:500; line-height:1.4; border:1px solid transparent; white-space:nowrap;
         background:var(--surface-strong); color:var(--ink); border-color:var(--border-strong); }
.badge.ok   { background:rgba(0,100,0,.10);   color:var(--success); border-color:rgba(57,191,69,.35); }
.badge.warn { background:rgba(217,164,65,.16); color:var(--ink);    border-color:rgba(217,164,65,.5); }
.badge.bad  { background:rgba(170,45,0,.10);   color:var(--coral);  border-color:rgba(170,45,0,.30); }
.badge.muted{ background:var(--surface-strong); color:var(--muted); border-color:var(--border-strong); }
.ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); } .muted { color:var(--muted); }

pre { background:var(--surface-soft); border:1px solid var(--hairline); border-radius:var(--r-md);
      padding:12px; overflow:auto; font-size:12px; font-family:var(--mono); margin:8px 0;
      color:var(--ink); }
code { font-family:var(--mono); font-size:12px; }
#err { color:var(--coral); padding:0 24px; }
#err:not(:empty) { background:rgba(170,45,0,.10); border:1px solid rgba(170,45,0,.30);
      border-radius:var(--r-md); margin:16px 24px 0; padding:12px 14px; }
label { color:var(--muted); font-size:12px; }
fieldset { border:1px solid var(--hairline); border-radius:var(--r-md); padding:16px 18px;
      margin:0 0 20px; background:var(--canvas); }
legend { color:var(--muted); font-size:12px; padding:0 6px; }
.row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
/* 선택지 한 줄은 눌리는 영역이 넓어야 한다 — 라디오 동그라미만 과녁이면 고르기 어렵다. */
.opt { display:block; margin:2px 0; padding:7px 10px; border-radius:var(--r-sm);
       color:var(--ink); font-size:13px; cursor:pointer; }
.opt:hover { background:var(--surface-soft); }
.opt input { margin-right:8px; }
.opt:has(input:checked) { background:var(--surface-soft); box-shadow:inset 3px 0 0 var(--coral); }
details summary { color:var(--muted); font-size:12px; cursor:pointer; margin:10px 0 4px; }
h2 { font-size:16px; font-weight:500; color:var(--ink); border-bottom:1px solid var(--hairline);
     padding-bottom:8px; margin:0 0 14px; }
h3 { font-size:14px; font-weight:600; color:var(--ink); margin:18px 0 8px; }
</style>
</head>
<body>
<div class="app-shell">
<aside class="app-side">
  <div class="side-brand"><span class="brand-dot"></span>kcloud operator</div>
<nav>
  <div class="side-group">자원</div>

  <button data-tab="cap">Capability</button>
  <div class="side-group">정책</div>

  <div class="side-foot">관리 API 콘솔 · 화면 안에서 사용자 토큰으로 호출한다</div>

<div class="app-main">
<header>
  <h1>kcloud accelerator console</h1>
  <label for="tok">Bearer 토큰</label>
  <input id="tok" type="password" placeholder="kubectl -n kcloud create token &lt;sa&gt;" autocomplete="off">
  <button id="save">적용</button>
  <button id="reload" class="ghost">새로고침</button>
  <select id="theme" title="화면 테마">
    <option value="system">테마: 시스템</option>
    <option value="light">테마: 밝게</option>
    <option value="dark">테마: 어둡게</option>
  </select>

</header>
<div id="err"></div>
<main>
  <section id="dash" class="active"><div class="cards" id="dashCards"></div><div id="dashTable"></div></section>
  <section id="st"><div id="stOut"></div></section>
  <section id="inv"><div id="invTree"></div></section>
  <section id="cap"><div id="capTable"></div></section>
  <section id="pol">
    <fieldset><legend>공유·분할 정책 만들기</legend>
      <div class="row">
        <label for="wDev">장치</label>
        <select id="wDev"><option value="">— 장치를 고른다 —</option></select>
        <span id="wDevNote" class="muted"></span>
      </div>

      <div id="wIntent">
        <div class="muted" style="margin:8px 0 4px">이 장치를 어떻게 쓰시겠습니까?</div>
        <label class="opt"><input type="radio" name="intent" value="exclusive">
          한 작업이 통째로 씁니다
          <span class="muted">— exclusive · 독점 할당. 분할·공유 없음</span></label>
        <label class="opt"><input type="radio" name="intent" value="shared">
          여러 작업이 나눠 씁니다 (서로 간섭할 수 있음)
          <span class="muted">— shared · 시간분할(Time-Slicing) 또는 다중프로세스(Multi-Process, MPS).
          격리 등급 none — 광고 수만 늘고 연산 시간 비율은 보장되지 않는다</span></label>
        <label class="opt"><input type="radio" name="intent" value="partitioned">

          <span class="muted">— partitioned · 논리분할 / 하드웨어 멀티인스턴스(Multi-Instance).
          NVIDIA MIG · Furiosa RNGD PE Core</span></label>

          <span class="muted">— partitioned-shared · 논리분할 후 공유
          (예: MIG 인스턴스 위에 Time-Slicing)</span></label>

        <label class="opt"><input type="radio" name="impl" value="timeSliced">

      <div class="row" id="wShareRow">

        <span id="wRepMax" class="muted"></span>
      </div>
      <div class="row" id="wPartRow">
        <label>파티션 프로파일</label><select id="wProf"></select>
        <label>장치당 인스턴스</label><input id="wCount" type="text" value="1" style="min-width:60px">
      </div>
      <div class="row">
        <label>정책 이름</label><input id="wName" type="text" placeholder="demo-timeslice">
        <button id="wCheck">미리보기 (적용 안 함)</button>

    </fieldset>
    <div id="wProgress"></div>

  </section>
  <section id="wl"><div id="wlTable"></div></section>
  <section id="cls"><div id="clsTable"></div></section>
  <section id="use"><div id="useTable"></div></section>
  <section id="prev">
    <fieldset><legend>요청</legend>
      <div class="row">
        <label>class</label><input id="pClass" type="text" placeholder="AcceleratorClass 이름">
        <label>mode</label>
        <select id="pMode"><option>exclusive</option><option>shared</option><option>partitioned</option><option>partitioned-shared</option></select>
        <label>replicas</label><input id="pRep" type="text" value="0" style="min-width:60px">
        <button id="pRun">미리보기</button>
      </div>
      <div class="muted">아무것도 만들지 않는다 — 이 요청이 지금 클러스터에서 성립하는지만 계산한다.</div>
    </fieldset>

<script>
const $ = (id) => document.getElementById(id);

// 토큰 받는 곳 두 군데: 주소의 fragment(#token=...) 와 sessionStorage.
//
// fragment 를 쓰는 이유는 브라우저가 그것을 서버로 보내지 않기 때문이다 — 질의 문자열
// (?token=)로 받으면 operator 접근 로그·중간 프록시·Referer 에 토큰 원문이 남는다. 읽은
// 즉시 history.replaceState 로 주소창에서도 지운다(새로고침·북마크로 재유출되지 않게).
//
// 인가 모델은 그대로다. 이 값은 여전히 사용자의 Bearer 토큰이고, /api/v1/* 호출은 종전대로
// TokenReview/SAR 를 통과한다 — 서버가 대신 읽어주는 경로는 여기서도 생기지 않는다.
function tokenFromFragment() {
  const h = location.hash || "";
  if (!h.startsWith("#")) return "";
  const v = new URLSearchParams(h.slice(1)).get("token");
  if (!v) return "";
  history.replaceState(null, "", location.pathname + location.search);
  return v.trim();
}
let token = tokenFromFragment();
if (token) sessionStorage.setItem("kcloud-token", token);
else token = sessionStorage.getItem("kcloud-token") || "";
$("tok").value = token;

// 테마: system 이면 data-theme 속성을 지워 @media 가 다시 결정하게 한다.
function applyTheme(v) {
  if (v === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", v);
  localStorage.setItem("kcloud-theme", v);
}
$("theme").value = localStorage.getItem("kcloud-theme") || "system";
applyTheme($("theme").value);
$("theme").addEventListener("change", () => applyTheme($("theme").value));

function setStatus(msg, cls) { $("status").textContent = msg; $("status").className = cls || "muted"; }
function esc(v) { return String(v ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

// truncated: 마지막으로 불러온 목록이 limit 에 잘렸을 때의 경고 문구. 카드 합계·표가 잘린 첫
// 페이지를 전체인 것처럼 보여주면(리뷰 Important #5) 감사 화면이 "이게 전부" 로 읽힌다.
let truncated = "";
async function api(path, opts) {
  if (!token) throw new Error("토큰이 필요하다. 상단에 Bearer 토큰을 넣고 적용을 누른다.");
  const res = await fetch(path, Object.assign({headers: {"Authorization": "Bearer " + token,
    "Content-Type": "application/json"}}, opts || {}));
  const text = await res.text();
  let body; try { body = JSON.parse(text); } catch (e) { body = {error: text}; }
  if (!res.ok) throw new Error(res.status + " " + (body.error || text));
  const shown = (body.items || []).length;
  truncated = (body.total > shown) ? ` · ⚠ 전체 ${body.total}개 중 ${shown}개만 표시` : "";
  return body;
}

// 정직성: verified 가 true 일 때만 초록. supported 만 true 면 "미검증" 으로 노란 배지다.
// 이 함수 밖에서 지원 여부를 판단하지 않는다.
function shareBadge(m) {
  if (!m) return '<span class="badge muted">unknown</span>';
  if (m.verified) return '<span class="badge ok">지원(검증됨)' + (m.maxReplicas ? " ≤" + m.maxReplicas : "") + "</span>";
  if (m.supported) return '<span class="badge warn">미검증(' + esc(m.verification || "required") + ")</span>";
  // supported:false 라도 verification 이 비었거나 required 면 "측정해서 못 한다" 가 아니라
  // "아직 못 봤다" 다 — partitionBadge 가 이미 하는 구분을 여기서도 한다. 둘을 같게 그리면
  // 관측되지 않은 장치가 못 하는 장치로 보이고, 화면이 그 판정으로 선택지를 잠근다
  // (2026-08-11 라이브: 여섯 장치 전부 sharingCapability 미기록이라 공유 경로가 닫혔다).
  if (!m.verification || m.verification === "required")
    return '<span class="badge warn">공유 미관측 — 판정 불가</span>'
      + (m.reason ? ' <span class="muted">' + esc(m.reason) + "</span>" : "");
  // 여기까지 온 것은 관측했고 안 된다는 뜻이다(verification 이 verified 또는 notApplicable).
  // 이 칸을 없애면 진짜로 못 하는 장치를 고르게 된다.
  return '<span class="badge bad">미지원' + (m.reason ? " · " + esc(m.reason) : "") + "</span>";
}
// shareSelectable: 공유 방식을 고를 수 있는가. 판정 축은 shareBadge 와 같다 — 관측해서 못
// 한다고 나온 것만 막고, 아직 못 본 것은 막지 않는다. 파티션 축의 partOK 와 같은 규칙이다.
function shareSelectable(m) {
  return !!m && (m.supported || !m.verification || m.verification === "required");
}
function isoBadge(v) {
  if (!v) return '<span class="badge muted">unknown</span>';
  return '<span class="badge">' + esc(v) + "</span>";
}
// exclBadge: 배제 표시. operator 가 붙인 라벨을 옮긴 값이라 여기서 사유를 다시 판정하지
// 않는다. 사유가 비면 괄호를 붙이지 않는다 — `제외됨()` 은 사유가 있는 줄 알게 만든다.
// 장치 표와 노드별 광고량 표가 같은 함수를 쓴다(장치 0개 노드는 장치 표에 행이 없다).
function exclBadge(n) {
  if (!n.excluded) return "";
  return '<span class="badge warn">제외됨'
    + (n.excludedReason ? "(" + esc(n.excludedReason) + ")" : "") + "</span>";
}
// partitionBadge: profiles[].supportLevel 도 같은 등급의 정직성 축이다(Verified 만 검증됨).
function partitionBadge(p) {
  if (!p) return '<span class="badge muted">미관측</span>';
  if (!p.hardwareSupported) {
    // 측정해서 못 한다는 것과 아직 못 봤다는 것을 절대 같게 렌더하지 않는다(백엔드가 관측 에러도
    // 같은 hardwareSupported:false 로 낸다 — Verification 이 둘을 가른다).
    if (p.verification === "required" || !p.verification)
      return '<span class="badge warn">미관측 — 판정 불가</span> <span class="muted">'
        + esc(p.reason || "관측 실패") + "</span>";
    return '<span class="badge muted">파티션 불가</span> <span class="muted">' + esc(p.reason || "") + "</span>";
  }
  if (!(p.profiles || []).length) return '<span class="badge muted">profile 없음</span>';
  return p.profiles.map(pr => {
    const cls = pr.supportLevel === "Verified" ? "ok" : pr.supportLevel === "Documented" ? "warn" : "muted";
    return '<span class="badge ' + cls + '">' + esc(pr.name) + " · " + esc(pr.supportLevel || "?") + "</span>";
  }).join(" ");
}
// healthBadge: stale/pending 행은 정상 행과 시각적으로 달라야 한다(같아 보이면 낡은 값을 지금
// 사실로 오인한다) — AcceleratorView.Stale/Pending 를 위해 Task 2 가 낸 Critical fix 두 건의 이유다.
// 세 조건은 서로 배타적이지 않다(stale 인 노드가 동시에 cordon 될 수 있다) — early-return 이면
// 먼저 맞은 배지 하나만 남고 나머지가 조용히 사라진다. 그래서 합성한다.
function healthBadge(x) {
  const b = [];
  if (x.pending) b.push('<span class="badge warn">pending</span> <span class="muted">governed·미보고</span>');
  if (x.stale) b.push('<span class="badge bad">stale</span>'
    + (x.staleReason ? ' <span class="muted">' + esc(x.staleReason) + "</span>" : ""));
  // cordoned 도 "이 행을 액면 그대로 믿지 말라" 는 같은 부류다 — 장치는 있어도 스케줄되지 않는다.
  if (!x.schedulable) b.push('<span class="badge bad">cordoned</span> <span class="muted">스케줄 불가 — 배치되지 않음</span>');
  return b.length ? b.join(" ") : '<span class="badge ok">ok</span>';
}
// shareCell: 공유 상태는 stale/pending 행에서 관측값이 아니라 초기화 기본값이다 — 확정 배지로
// 렌더하면 실제로는 시분할 중인 장치가 exclusive 로 보인다(리뷰 Important #2). 대시보드/인벤토리
// 두 탭이 각자 렌더하다 배수 표기까지 갈라졌던 것(Medium #8)도 이 헬퍼 하나로 합친다.
// oversubscribed(D-1): 광고 수가 물리 장치 수를 넘는다는 것만 확인됐고 원인(복제냐 벤더의
// 하드웨어 서브유닛이냐)은 모른다 — "시분할" 이나 "격리 없음" 이라고 단정하면 안 된다(예:
// Furiosa RNGD 의 PE 는 하드웨어 격리가 있는데 이 문구를 그대로 쓰면 거짓말이 된다).
function shareCell(x) {
  if (x.stale || x.pending) return '<span class="badge muted">공유 상태 미상</span>';
  if (x.sharingMode === "oversubscribed")
    return '<span class="badge warn">초과 광고 ×' + (x.sharingReplicas || "?") + "</span>"
      + " <span class='muted'>원인 미확정 — 격리 여부 불명</span>";
  if (x.sharingMode !== "timeSliced") return '<span class="badge">exclusive</span>';
  return '<span class="badge warn">시분할 ×' + (x.sharingReplicas || "?") + "</span>"
    + " <span class='muted'>물리 장치 1개 공유, 연산 격리 없음</span>";
}
function table(cols, rows) {
  return "<table><thead><tr>" + cols.map(c => "<th>" + esc(c) + "</th>").join("") + "</tr></thead><tbody>"
    + rows.map(r => "<tr>" + r.map(c => "<td>" + c + "</td>").join("") + "</tr>").join("")
    + "</tbody></table>";
}

async function loadDash() {
  // 요약을 먼저 가져온다 — api() 가 truncated 를 매 호출마다 덮어쓰므로, 뒤에 부르면
  // 장치 목록이 잘렸다는 경고가 status 응답(items 없음)에 지워진다.
  const summary = await loadDashSummary();
  const inv = await api("/api/v1/accelerators?limit=500");
  const items = inv.items || [];
  const physical = items.length;
  // partitionProfiles 는 노드 단위 값이라 장치 행마다 그대로 실린다 — 장치 수만큼 더하면 같은
  // profile 을 노드의 장치 개수만큼 중복해서 센다(리뷰 Important #3). 노드×profile 로 중복을 없앤다.
  const profs = new Set();
  items.forEach(x => (x.partitionProfiles || []).forEach(p => profs.add(x.nodeName + "/" + p)));
  // 논리 파티션 수는 profile 이름 개수가 아니라 장치당 인스턴스 수의 합이다 — 항목 1개가
  // 4인스턴스일 수 있다. stale/pending 행은 관측 밖이므로 분모에서 조용히 빼지 않고
  // 미상 행수로 따로 드러낸다(잘린 총계를 전체 사실처럼 보여주면 이 트랙이 고친 결함과 같다).
  let logical = 0, unknownRows = 0;
  items.forEach(x => {
    if (x.stale || x.pending) { unknownRows++; return; }
    (x.partitionInstances || []).forEach(pi => { logical += (pi.countPerDevice || 0); });
  });
  const replicas = items.reduce((a, x) => a + (x.sharingReplicas || 0), 0);
  const byVendor = {};
  items.forEach(x => { byVendor[x.vendor || "unknown"] = (byVendor[x.vendor || "unknown"] || 0) + 1; });
  $("dashCards").innerHTML = summary
    + card(physical, "물리 장치")
    + card(profs.size, "파티션 프로파일(노드×profile)")
    + card(logical, "논리 파티션" + (unknownRows ? " (미상 " + unknownRows + "행 제외)" : ""))
    + card(replicas, "공유 replica(광고 배수)")
    + card(items.filter(x => !x.schedulable).length, "스케줄 불가 노드의 장치")
    + Object.entries(byVendor).map(([v, n]) => card(n, "vendor: " + v)).join("");
  $("dashTable").innerHTML = table(["상태", "노드", "장치", "벤더/모델", "공유", "파티션", "정책", "phase"],
    items.map(x => [healthBadge(x), esc(x.nodeName), x.pending ? "<i class='muted'>미보고</i>" : esc(x.uid),
      esc(x.vendor) + " / " + esc(x.model), shareCell(x),
      esc((x.partitionProfiles || []).join(", ")), esc(x.policy), esc(x.phase)]));
}
function card(n, label) { return '<div class="card"><b>' + esc(n) + "</b><span>" + esc(label) + "</span></div>"; }

// 대시보드 머리에 벤더 축 요약을 붙인다. 지금 대시보드는 장치만 세어 "이 클러스터가
// 무엇을 관리하고 있나" 가 안 보인다. status 응답은 페이지 봉투가 아니다 — items 가 없고
// vendors 가 최상위다.
async function loadDashSummary() {
  const st = await api("/api/v1/status").catch(() => null);
  if (!st) return "";
  return (st.vendors || []).map(v => card(
    (v.enabled ? "사용" : "미사용") + " · 정책 " + ((v.driverInstallPolicies || []).length),
    "벤더 " + v.name)).join("");
}

async function loadCls() {
  const res = await api("/api/v1/classes?limit=500");
  $("clsTable").innerHTML = table(["등급", "매핑 벤더", "매핑"],
    (res.items || []).map(c => [esc(c.name),
      esc([...new Set((c.mappings || []).map(m => m.vendor))].join(", ")),
      (c.mappings || []).map(m => esc(JSON.stringify(m))).join("<br>")]));
}

// 필드 이름은 consumers.go 의 ConsumerView 를 따른다 — node(nodeName 아님), requests 는
// {resource,quantity,vendor} 배열, kind 필드는 없다.
// attribution 이 device 가 아닐 때 deviceUIDs 는 "장치 없음" 이 아니라 "모른다" 는 뜻이라
// 빈 칸으로 두지 않고 그 사유를 적는다.
async function loadUse() {
  const res = await api("/api/v1/consumers?limit=500");
  $("useTable").innerHTML = table(["노드", "네임스페이스", "소비자", "phase", "요청", "할당 API", "귀속", "장치"],
    (res.items || []).map(c => [esc(c.node), esc(c.namespace), esc(c.name), esc(c.phase),
      esc((c.requests || []).map(q => q.resource + " ×" + q.quantity).join(", ")),
      esc(c.allocationAPI), esc(c.attribution),
      c.attribution === "device" ? esc((c.deviceUIDs || []).join(", "))
        : '<span class="muted">장치 단위로 귀속되지 않음 — 모름</span>']));
}

async function loadInv() {
  const inv = await api("/api/v1/accelerators?limit=500");
  const byNode = {};
  (inv.items || []).forEach(x => { (byNode[x.nodeName] = byNode[x.nodeName] || []).push(x); });
  let html = "";
  for (const [node, devs] of Object.entries(byNode)) {
    const sched = devs[0].schedulable ? "" : ' <span class="badge bad">cordoned</span>';
    html += "<h3>" + esc(node) + sched + " <span class='muted'>("
      + esc(JSON.stringify(devs[0].nodeAdvertised || {})) + ")</span></h3><ul>";
    for (const d of devs) {
      const staleTag = d.stale
        ? '<span class="badge bad">stale</span> ' + (d.staleReason ? "<span class='muted'>" + esc(d.staleReason) + "</span> " : "")
        : "";
      // pending: 정책이 이 노드를 타깃하지만 아직 장치를 보고하지 않았다 — uid/model 이 없으므로
      // 일반 장치 행처럼 그리면 "빈 장치" 로 오인한다. 별도 placeholder 로 낸다. staleTag 는 pending
      // 이어도(둘 다 true 일 수 있다) 화면에서 사라지면 안 되므로 continue 앞에 붙인다(리뷰 Critical #1).
      if (d.pending) {
        html += "<li>" + staleTag + "<span class='badge warn'>pending</span> 이 노드는 정책이 타깃하지만 "
          + "아직 장치를 보고하지 않았다(governed, 수렴 중 또는 stale)</li>";
        continue;
      }
      html += "<li>" + staleTag + "<b>" + esc(d.uid) + "</b> · " + esc(d.vendor) + "/" + esc(d.model)
        + ' <span class="badge muted">' + esc(d.source) + "</span>";
      if ((d.partitionProfiles || []).length) html += "<ul><li>파티션: " + esc(d.partitionProfiles.join(", ")) + "</li></ul>";
      // replica 는 하위 항목으로 펼치지 않는다 — 독립 장치가 아니기 때문이다.
      html += "<ul><li>" + shareCell(d) + "</li></ul>";
      html += "</li>";
    }
    html += "</ul>";
  }
  $("invTree").innerHTML = html || "<p class='muted'>장치가 없다.</p>";
}

async function loadCap() {
  const res = await api("/api/v1/capabilities?limit=500");
  const rows = [];
  for (const n of res.items || []) {
    const cand = n.candidate ? '<span class="badge ok">후보</span>'
      : '<span class="badge bad">제외</span> <span class="muted">' + esc(n.candidateReason) + "</span>";
    if (!(n.devices || []).length) {
      rows.push([esc(n.nodeName), "<i class='muted'>장치 정보 없음</i>", "", "", "", "", "", "", cand]);
      continue;
    }
    for (const d of n.devices) {
      const c = d.capability || {}, s = c.sharing || {}, iso = c.isolation || {};
      rows.push([esc(n.nodeName), esc(d.uid) + " / " + esc(d.model),
        partitionBadge(c.partition),
        shareBadge(s.timeSlicing), shareBadge(s.multiProcess), shareBadge(s.brokered),
        isoBadge(iso.compute) + " " + isoBadge(iso.memory) + " " + isoBadge(iso.fault),
        esc((c.allocationAPIs || []).join(", ")), cand]);
    }
  }
  $("capTable").innerHTML = table(
    ["노드", "장치", "파티션(profile · 등급)", "time-slicing", "multi-process", "brokered",
     "격리(compute/memory/fault)", "allocation API", "번역 후보"], rows);
}

// 상태 탭: 사람이 `kubectl npu status` 출력과 이 화면을 나란히 놓고 대조한다 — 세 절의
// 이름과 순서를 터미널과 같게 유지한다. 새 라우트는 만들지 않는다(status 가 CLI 와 같은
// 데이터를 낸다). 절이 비면 표를 지우는 대신 "없음" 을 남긴다 — 절이 통째로 사라지면
// "조회는 됐는데 비었다" 와 "조회 자체가 안 됐다" 가 구분되지 않는다.
async function loadStatus() {
  const st = await api("/api/v1/status");
  const none = "<p class='muted'>없음</p>";

  const pol = [];
  for (const v of st.vendors || []) {
    for (const p of v.driverInstallPolicies || []) {
      pol.push([esc(p.vendor || v.name), esc(p.model), esc(p.desiredVersion),
        v.enabled ? '<span class="badge ok">사용</span>' : '<span class="badge muted">미사용</span>',
        esc(p.installer), esc(p.versionSource)]);
    }
  }
  let html = "<h3>드라이버 설치 정책</h3>" + (pol.length
    ? table(["벤더", "모델", "목표 버전", "활성", "installer", "버전 출처"], pol) : none);

  const devs = [], adv = [], ups = [];
  for (const n of st.nodes || []) {
    for (const d of n.devices || []) {
      // product 는 구 detector 에서 비어 온다 — 그때 vendor/model 로 물러나고, 둘 다 없으면
      // 이름을 지어내지 않고 — 로 둔다. 모르는 PCI 식별자가 nvidia/generic 으로 남는 것은
      // 정상이므로 화면도 그대로 보인다.
      devs.push([esc(n.name),
        esc(d.product || [d.vendor, d.model].filter(Boolean).join("/") || "—"),
        esc(d.pcieAddress), esc(d.count),
        d.driverLoaded ? '<span class="badge ok">적재</span>' : '<span class="badge bad">미적재</span>',
        esc(d.driverVersion),
        // 화면에서만 되는 축 ①: 바인딩. vfio-pci 는 호스트 드라이버가 아니라 통째 넘김이다.
        isoBadge(d.driverBinding)
          + (d.driverBinding === "vfio-pci" ? ' <span class="badge warn">passthrough</span>' : "")
          + (d.needsReboot ? ' <span class="badge bad">재부팅 필요</span>' : ""),
        // 화면에서만 되는 축 ④: 배제. 배제 아닌 노드는 빈 문자열(배지 없음)이다.
        exclBadge(n)]);
    }
    // 화면에서만 되는 축 ②: 노드별 광고량. 가속기 리소스 판별은 규칙이지 목록이 아니다 —
    // 벤더 리소스명이 설정에 따라 달라지므로 이름을 박아두면 새 벤더의 광고량이 조용히 빠진다.
    const acc = Object.entries(n.allocatable || {}).filter(([k]) => k.includes("/")
      && !/^(cpu|memory|pods|ephemeral-storage|hugepages-|attachable-volumes-)/.test(k));
    // 배제 열이 이 표에도 있어야 한다 — 노드 단위 표라 장치 0개 노드도 나오는데, 배제
    // 표시가 없으면 배제된 control-plane 이 `가속기 광고 없음` 으로만 보인다.
    adv.push([esc(n.name),
      acc.length ? acc.map(([k, q]) => esc(k) + " ×" + esc(q)).join("<br>")
                 : "<span class='muted'>가속기 광고 없음</span>",
      exclBadge(n),
      n.passthroughReserved ? '<span class="badge warn">passthrough 예약</span>' : ""]);
    // 화면에서만 되는 축 ③: 드라이버 갱신 상태. Idle 이 아닌 것만 눈에 띄게 한다.
    for (const u of n.upgrades || []) {
      ups.push([esc(n.name), esc(u.name), esc(u.vendor) + "/" + esc(u.model),
        u.state === "Idle" ? '<span class="badge muted">Idle</span>'
                           : '<span class="badge warn">' + esc(u.state) + "</span>",
        esc(u.currentVersion) + " → " + esc(u.desiredVersion), esc(u.retries), esc(u.message)]);
    }
  }
  html += "<h3>노드 장치</h3>" + (devs.length
    ? table(["노드", "장치", "PCI", "개수", "드라이버", "버전", "바인딩", "배제"], devs) : none)
    + "<h4>노드별 광고량</h4>" + (adv.length
      ? table(["노드", "가속기 리소스", "배제", "예약"], adv) : none)
    + "<h4>드라이버 갱신</h4>" + (ups.length
      ? table(["노드", "작업", "벤더/모델", "상태", "버전", "재시도", "메시지"], ups) : none);

  const cps = (st.clusterPolicies || []).map(c => [
    esc(c.namespace ? c.namespace + "/" + c.name : c.name), esc(c.phase),
    c.ready ? '<span class="badge ok">Ready</span>'
      : '<span class="badge bad">' + esc(c.readyReason || "NotReady") + "</span>"
        + (c.readyMessage ? " <span class='muted'>" + esc(c.readyMessage) + "</span>" : "")]);
  html += "<h3>클러스터 정책</h3>" + (cps.length ? table(["이름", "phase", "Ready"], cps) : none);

  $("stOut").innerHTML = html;
}

// 마법사 상태. 화면이 auto 를 확정해 보내므로 서버는 auto 를 모른다.
const wz = {devs: [], cur: null};

// 정책 대상 벤더는 CRD enum 이 furiosa;nvidia 로 고정한다. 다른 벤더는 목록에 내되 고를 수 없다.
const POLICY_VENDORS = ["furiosa", "nvidia"];

async function loadPol() {
  const inv = await api("/api/v1/accelerators?limit=500");
  wz.devs = (inv.items || []).filter(d => !d.pending);
  const sel = $("wDev");
  sel.innerHTML = '<option value="">— 장치를 고른다 —</option>' + wz.devs.map(d => {
    const ok = POLICY_VENDORS.includes(d.vendor);
    return '<option value="' + esc(d.uid) + '"' + (ok ? "" : " disabled")
      + ">" + esc(d.nodeName) + " · " + esc(d.vendor) + "/" + esc(d.model)
      + (ok ? "" : " (카드 통째로 씀 — 정책 대상 아님)") + "</option>";
  }).join("");
  renderWizard();
  const res = await api("/api/v1/policies?limit=500");
  $("polTable").innerHTML = table(["정책", "벤더", "phase", "수렴", "요청 프로파일", "공유", "타깃", ""],
    (res.items || []).map(p => [esc(p.name), esc(p.vendor), esc(p.phase),
      p.converged ? '<span class="badge ok">converged</span>'
                  : '<span class="badge warn">gen ' + esc(p.observedGeneration) + "/" + esc(p.generation) + "</span>",
      esc((p.requestedProfiles || []).join(", ")),
      esc(p.sharingMode) + (p.sharingReplicas ? " ×" + esc(p.sharingReplicas) : ""),
      (p.targets || []).map(t => esc(t.nodeName) + " (" + esc(t.phase) + ") "
        + esc(JSON.stringify(t.advertised || {}))).join("<br>"),
      '<button class="ghost" data-del="' + esc(p.name) + '">되돌리기</button>']));
  document.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click",
    () => deletePolicy(b.dataset.del)));
}

// renderWizard: 고른 장치의 capability 로 선택지를 깎는다. 판정은 기존 배지 헬퍼가 한다 —
// 여기서 supported/verified 를 다시 해석하면 화면과 실제가 갈라진다.
function renderWizard() {
  const d = wz.devs.find(x => x.uid === $("wDev").value);
  wz.cur = d || null;
  const c = (d && d.capability) || {}, s = c.sharing || {};
  $("bTS").innerHTML = shareBadge(s.timeSlicing);
  $("bMPS").innerHTML = shareBadge(s.multiProcess);
  $("bBRK").innerHTML = shareBadge(s.brokered);
  // 관측해서 못 한다고 나온 방식만 잠근다. "된다고 하나 실측 안 됨"(미검증)과 "아직 못 봤다"
  // (미관측)는 경고를 달고 고를 수 있게 둔다 — 숨기지 않는 것이 이 시스템의 정직함이고,
  // 못 봤다는 이유로 잠그면 관측이 비어 있는 클러스터에서 화면이 통째로 닫힌다.
  document.querySelector('input[name=impl][value=timeSliced]').disabled = !shareSelectable(s.timeSlicing);
  document.querySelector('input[name=impl][value=mps]').disabled = !shareSelectable(s.multiProcess);
  const anyShare = shareSelectable(s.timeSlicing) || shareSelectable(s.multiProcess);
  document.querySelector('input[name=intent][value=shared]').disabled = !anyShare;
  // 파티션: hardwareSupported:false 라도 verification 이 required 면 막지 않는다 —
  // 못 한다는 것과 아직 못 봤다는 것은 다르다.
  const p = c.partition || {};
  const partOK = p.hardwareSupported || p.verification === "required" || !p.verification;
  document.querySelector('input[name=intent][value=partitioned]').disabled = !partOK;
  document.querySelector('input[name=intent][value="partitioned-shared"]').disabled = !(partOK && anyShare);
  $("wProf").innerHTML = (p.profiles || []).map(pr =>
    '<option value="' + esc(pr.name) + '">' + esc(pr.name) + " · " + esc(pr.supportLevel || "?") + "</option>").join("");
  $("wDevNote").innerHTML = d ? partitionBadge(p) : "";
  // 상한은 장치가 보고했을 때만 그 값으로 말한다. 보고가 없으면 "최대 16" 같은 확정 문구
  // 대신 스키마 상한임을 밝힌다 — 관측되지 않은 값을 장치의 사실로 내면 안 된다.
  // timeSlicing 만 스키마 상한 16 이 있고 mps 에는 상한이 없다(CRD minimum 만 선언).
  const maxR = (s.timeSlicing && s.timeSlicing.maxReplicas) || (s.multiProcess && s.multiProcess.maxReplicas);
  $("wRepMax").textContent = maxR ? "최대 " + maxR + " (이 장치가 보고한 값)"
                                  : "상한 미보고 — 시분할은 스키마 상한 16";
  const intent = (document.querySelector("input[name=intent]:checked") || {}).value || "";
  $("wShareRow").style.display = intent.includes("shared") ? "flex" : "none";
  $("wPartRow").style.display = intent.startsWith("partitioned") ? "flex" : "none";
  $("wApply").disabled = true;   // 미리보기를 다시 통과해야 적용이 열린다
  $("wOut").innerHTML = "";
}
$("wDev").addEventListener("change", renderWizard);
document.querySelectorAll("input[name=intent], input[name=impl]").forEach(
  r => r.addEventListener("change", renderWizard));

// buildReq: 화면 상태를 PolicyRequest(JSON) 로 옮긴다. auto 는 여기서 확정한다 —
// 서버의 sharing 값에 auto 가 없다.
function buildReq() {
  const d = wz.cur;
  if (!d) throw new Error("장치를 먼저 고른다.");
  const intent = (document.querySelector("input[name=intent]:checked") || {}).value;
  if (!intent) throw new Error("사용 방식을 고른다.");
  const req = {name: $("wName").value.trim(), vendor: d.vendor, nodeName: d.nodeName, intent};
  if (intent.includes("shared")) {
    let impl = (document.querySelector("input[name=impl]:checked") || {}).value || "auto";
    if (impl === "auto") {
      const s = (d.capability || {}).sharing || {};
      // verified 인 것만 auto 후보다. supported 뿐인 것을 자동으로 고르면 실측되지 않은
      // 방식을 사용자 모르게 적용한다 — 그건 고르게 하되 사용자가 직접 고르게 한다.
      impl = (s.timeSlicing && s.timeSlicing.verified) ? "timeSliced"
           : (s.multiProcess && s.multiProcess.verified) ? "mps" : "";
      if (!impl) throw new Error("이 장치에는 검증된 공유 방식이 없다. 고급에서 직접 고른다.");
    }
    req.sharing = impl;
    req.replicas = parseInt($("wRep").value, 10) || 0;
  }
  if (intent.startsWith("partitioned")) {
    // 프로파일 목록이 비어 있으면 서버는 "layout 도 sharing 도 없다" 로 거절한다 — 맞는
    // 말이지만 사용자가 고친 곳을 못 찾는다. 화면이 이미 아는 사실(이 장치의 파티션
    // 프로파일이 관측되지 않았다)을 그대로 말한다. 판정을 복제하는 것이 아니라 빈 입력을
    // 서버에 보내기 전에 되돌리는 것이다.
    req.profile = $("wProf").value;
    if (!req.profile) {
      throw new Error("이 장치의 파티션 프로파일이 관측되지 않았다 — 고를 것이 없다. "
        + "정책이 이 노드를 관리하기 시작하면 목록이 채워진다.");
    }
    req.countPerDevice = parseInt($("wCount").value, 10) || 0;
  }
  return req;
}

// destructive: 파티션 계열은 노드 재부팅을 부를 수 있다. 실측 소요를 함께 보인다.
function destructive(req) { return String(req.intent).startsWith("partitioned"); }

async function checkPolicy() {
  const req = buildReq();
  const res = await api("/api/v1/policies?dryRun=true", {method: "POST", body: JSON.stringify(req)});
  if (res.rejection) {
    $("wOut").innerHTML = rejectionHTML(res.rejection);
    $("wApply").disabled = true;
    return;
  }
  let extra = "";
  if (destructive(req)) {
    const cons = await api("/api/v1/consumers?limit=500").catch(() => ({items: []}));
    // 소비자 응답의 노드 필드는 node 다(nodeName 이 아니다) — consumers.go ConsumerView.
    const here = (cons.items || []).filter(c => c.node === req.nodeName);
    // 소요 수치는 출처를 찾지 못해 뺐다(2026-08-11) — 화면이 "실측 기준" 이라 단언하던
    // 795초·286초는 docs/impl 어디에도 근거가 없다. 근거 있는 값을 다시 재기 전까지는
    // 자릿수만 말한다. 없는 정확도를 보이면 사용자가 그 숫자로 유지보수 창을 잡는다.
    extra = '<p class="warn">이 적용은 노드 재부팅을 부를 수 있다. 수렴에 십수 분이 걸리고 '
      + "그 사이 이 노드의 장치는 배치되지 않는다." + (here.length
        ? " 지금 이 노드의 장치를 쓰는 소비자 " + here.length + "건이 비워진다." : "")
      + "</p>";
  }
  $("wOut").innerHTML = '<span class="badge ok">검증 통과 — 아무것도 만들지 않았다</span>'
    + "<pre>" + esc(JSON.stringify(req, null, 2)) + "</pre>" + extra;
  $("wApply").disabled = false;
  $("wApply").textContent = destructive(req) ? "적용 (재부팅 가능 — 다시 누른다)" : "적용";
  wz.confirmed = !destructive(req);   // 파괴적이면 한 번 더 눌러야 한다
}

async function applyPolicy() {
  const req = buildReq();
  if (destructive(req) && !wz.confirmed) {
    wz.confirmed = true;
    $("wApply").textContent = "정말 적용한다";
    return;
  }
  const res = await api("/api/v1/policies", {method: "POST", body: JSON.stringify(req)});
  if (res.rejection) { $("wOut").innerHTML = rejectionHTML(res.rejection); return; }
  $("wOut").innerHTML = '<span class="badge ok">적용됨 · ' + esc(res.name) + "</span>";
  $("wApply").disabled = true;
  startProgress(res.name, req.nodeName);
}

async function deletePolicy(name) {
  const res = await api("/api/v1/policies/" + encodeURIComponent(name), {method: "DELETE"});
  if (res.rejection) { $("err").textContent = res.rejection.message; return; }
  refresh();
}

// 진행 표시: AcceleratorOperation 단계를 그대로 막대로 그린다. 새 라우트를 만들지 않고
// policies 의 targets[].phase 로 채운다. 5초 폴링.
const PHASES = [["Quiesce", "비우기"], ["Apply", "적용"], ["Verify", "검증"],
                ["Advertise", "광고"], ["Rollback", "되돌림"]];
let progTimer = null, progStart = 0;

// 단계 판정은 이 함수 한 곳에서만 한다. cur 이 PHASES 밖인 경우가 흔하다 — 수렴 뒤의
// Ready, 아직 단계가 안 잡힌 빈 값, 종료 상태가 모두 그렇다. 그때 인덱스 비교는 -1 이라
// 모든 단계가 미완으로 남는데, 이미 수렴한 정책을 "아무 단계도 안 끝났다" 로 그리는 것은
// 거짓이므로 converged 를 먼저 본다. 되돌림만 예외로 미도달로 둔다 — 수렴은 되돌리지
// 않고 끝났다는 뜻이고, 거기에 ✔ 를 찍으면 하지 않은 일을 했다고 적는 것이다.
// PHASES 밖이면서 수렴도 아니면 모른다고 적는다 — 추측해서 채우지 않는다.
function phaseState(key, cur, converged) {
  if (cur === key) return "run";
  // 되돌림은 순서상 마지막이 아니라 곁가지다. 인덱스로 비교하면 앞 네 단계가 전부 ✔ 로
  // 찍히는데, 그 단계들이야말로 지금 되돌려지는 중이다.
  if (cur === "Rollback") return "undo";
  const ci = PHASES.findIndex(x => x[0] === cur);
  if (ci >= 0) return ci > PHASES.findIndex(x => x[0] === key) ? "done" : "todo";
  if (converged) return key === "Rollback" ? "todo" : "done";
  return "unknown";
}
const PHASE_MARK = {run: '<span class="warn">◼ 진행 중</span>', done: '<span class="ok">✔</span>',
                    todo: '<span class="muted">◻</span>', unknown: '<span class="muted">? 알 수 없음</span>',
                    undo: '<span class="bad">↩ 되돌리는 중</span>'};

function stopProgress() { if (progTimer) { clearInterval(progTimer); progTimer = null; } }

function startProgress(name, node) {
  stopProgress();
  progStart = Date.now();
  const tick = async () => {
    const res = await api("/api/v1/policies?limit=500").catch(() => null);
    if (!res) return;
    const p = (res.items || []).find(x => x.name === name);
    if (!p) { $("wProgress").innerHTML = '<span class="muted">정책이 사라졌다 — 삭제됐다.</span>'; stopProgress(); return; }
    const t = (p.targets || []).find(x => x.nodeName === node) || {};
    const cur = String(t.phase || p.phase || "");
    const elapsed = Math.round((Date.now() - progStart) / 1000);
    const rows = PHASES.map(([key, label]) => {
      // 되돌림 단계는 도달했을 때만 붉게 낸다. 평소엔 회색으로 자리만 지킨다.
      const st = phaseState(key, cur, p.converged);
      const mark = (st === "run" && key === "Rollback") ? '<span class="bad">◼ 진행 중</span>' : PHASE_MARK[st];
      return "<tr><td>" + esc(label) + " (" + esc(key) + ")</td><td>" + mark + "</td></tr>";
    }).join("");
    // 단계 원문을 그대로 함께 낸다 — PHASES 에 없는 값이 와도 화면이 숨기지 않는다.
    $("wProgress").innerHTML = "<h3>" + esc(name) + " · " + esc(node) + "</h3>"
      + "<table><tbody>" + rows + "</tbody></table>"
      + '<p class="muted">현재 단계 ' + esc(cur || "(없음)") + " · 경과 " + elapsed + "초 · "
      + (p.converged ? "수렴 완료" : "수렴 대기 gen " + esc(p.observedGeneration) + "/" + esc(p.generation)) + "</p>";
    if (p.converged) stopProgress();
  };
  tick();
  progTimer = setInterval(tick, 5000);
}

// 미리보기 뒤에 입력을 바꾸면 적용 버튼을 다시 잠근다. renderWizard 는 장치·intent·구현
// 방식 변경에만 걸리므로, 이것이 없으면 복제수 2 로 검증하고 99 로 적용하는 길이 열린다.
["wRep", "wCount", "wName", "wProf"].forEach(id => $(id).addEventListener("input", () => {
  $("wApply").disabled = true;
  wz.confirmed = false;
}));
$("wProf").addEventListener("change", () => { $("wApply").disabled = true; wz.confirmed = false; });

$("wCheck").addEventListener("click", () => checkPolicy().catch(e => {
  $("wOut").innerHTML = ""; $("err").textContent = e.message; }));
$("wApply").addEventListener("click", () => applyPolicy().catch(e => {
  $("err").textContent = e.message; }));

async function loadWl() {
  const res = await api("/api/v1/workloads?limit=500");
  $("wlTable").innerHTML = table(["네임스페이스", "이름", "클래스", "모드", "phase", "결과 / 거절"],
    (res.items || []).map(x => [esc(x.namespace), esc(x.name), esc(x.class),
      esc(x.mode) + (x.accessReplicas ? " ×" + esc(x.accessReplicas) : ""), esc(x.phase),
      x.rejection ? rejectionHTML(x.rejection)
        : (x.resolved ? esc(x.resolved.resourceName) + " ×" + esc(x.resolved.quantity)
            + "<br><span class='muted'>" + esc(x.resolved.explanation) + "</span>" : "")]));
}

// 거절은 축을 먼저 보여주고 원문 메시지를 그대로 붙인다 — 요약하지 않는다.
function rejectionHTML(rj) {
  return '<span class="badge bad">' + esc(rj.reason) + "</span>"
    + (rj.axis ? " <b>고칠 곳: " + esc(rj.axis) + "</b>" : "")
    + "<br><span class='muted'>" + esc(rj.message) + "</span>";
}

async function loadEv() {
  const res = await api("/api/v1/events?limit=200");
  $("evTable").innerHTML = table(["시각", "종류", "대상", "type", "reason", "메시지"],
    (res.items || []).map(e => [esc(e.lastTimestamp), esc(e.kind), esc(e.name),
      e.type === "Warning" ? '<span class="badge bad">Warning</span>' : '<span class="badge">Normal</span>',
      esc(e.reason), esc(e.message)]));
}

async function runPreview() {
  const body = {class: $("pClass").value.trim(),
    access: {mode: $("pMode").value, replicas: parseInt($("pRep").value, 10) || 0}};
  const res = await api("/api/v1/preview", {method: "POST", body: JSON.stringify(body)});
  if (res.accepted && res.resolved) {
    const r = res.resolved;
    $("prevOut").innerHTML = '<span class="badge ok">성립</span>'
      + table(["벤더", "모드", "리소스", "수량", "allocation API", "후보 노드"],
        [[esc(r.vendor), esc(r.mode), esc(r.resourceName), esc(r.quantity),
          esc(r.allocationAPI), esc((r.nodes || []).join(", "))]])
      + "<pre>" + esc(r.explanation) + "</pre>";
  } else {
    $("prevOut").innerHTML = rejectionHTML(res.rejection || {});
  }
}

const loaders = {dash: loadDash, st: loadStatus, inv: loadInv, cap: loadCap, pol: loadPol, wl: loadWl,
                 cls: loadCls, use: loadUse, ev: loadEv, prev: async () => {}};
let current = "dash";

async function refresh() {
  $("err").textContent = "";
  try {
    setStatus("불러오는 중…");
    await loaders[current]();
    setStatus("갱신 " + new Date().toLocaleTimeString() + truncated, truncated ? "warn" : "muted");
  }
  catch (e) { setStatus("실패", "bad"); $("err").textContent = e.message; }
}

document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => {
  stopProgress();   // 탭을 떠나도 폴링이 남으면 토큰 만료 뒤 오류가 계속 뜬다
  document.querySelectorAll("nav button").forEach(x => x.removeAttribute("aria-current"));
  b.setAttribute("aria-current", "page");
  document.querySelectorAll("section").forEach(s => s.classList.remove("active"));
  current = b.dataset.tab;
  $(current).classList.add("active");
  refresh();
}));
$("save").addEventListener("click", () => {
  token = $("tok").value.trim();
  sessionStorage.setItem("kcloud-token", token);
  refresh();
});
$("reload").addEventListener("click", refresh);
$("pRun").addEventListener("click", () => runPreview().catch(e => { $("prevOut").innerHTML = ""; $("err").textContent = e.message; }));
if (token) refresh(); else setStatus("Bearer 토큰을 넣어 시작한다.");
</script>
